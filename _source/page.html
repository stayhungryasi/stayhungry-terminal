<title>Stayhungry.ASI Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one code-editor window. Every file opens split: code on the left (what the boss sees), a live preview of charts on the right (what you read). README opens as a full-width mission-control dashboard. Single dark look by design. */
:root{
  --desk:#070910; --win:#0C1020; --pane:#10152A; --card:#151B34; --card2:#1A2142; --bar:#090C18; --line:#232A4D; --sel:#1E2547;
  --ink:#F2EFF7; --mute:#B6BBD6; --cmt:#959CC2; --dim:#545B85;
  --rose:#EDBBA6; --rose-d:#C88A72; --ice:#9CC4EA; --gold:#F4C96E; --lav:#C9B8F5;
  --mint:#83D8B6; --red:#F4808A; --blue:#7CA6F4;
  --f-code:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,"Hiragino Sans","Malgun Gothic",monospace;
  --f-ui:"IBM Plex Sans","IBM Plex Sans KR","Hiragino Sans","Noto Sans JP","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-logo:"Instrument Serif","Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
a{color:var(--ice)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.num{font-family:var(--f-code);font-variant-numeric:tabular-nums}
kbd,code{font-family:var(--f-code);font-size:.9em;background:var(--sel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--rose)}

.app{height:100%;min-height:680px;max-width:1560px;margin:0 auto;display:grid;grid-template-rows:44px minmax(0,1fr) 30px;
  background:var(--win);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 40px 90px -40px #000}

.title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);position:relative}
.tleft{display:flex;align-items:center;gap:14px;min-width:0}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#343B5E}
.logo{font-family:var(--f-logo);font-style:italic;font-size:22px;white-space:nowrap;color:var(--ink)}
.logo b{font-weight:400;color:var(--rose)}
.tcenter{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;color:var(--cmt);white-space:nowrap;pointer-events:none}
.tright{display:flex;align-items:center;gap:10px}
.focus{display:flex;align-items:center;gap:7px;font-family:var(--f-code);font-size:12px;color:var(--rose);border:1px solid #5A4440;border-radius:5px;padding:3px 9px;white-space:nowrap}
.focus i{width:7px;height:7px;border-radius:50%;background:var(--rose);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.langbtn{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--pane);cursor:pointer;font-family:var(--f-code);font-size:12.5px}
.langbtn:hover{border-color:var(--rose-d)}
.menu{position:absolute;right:12px;top:42px;z-index:20;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 18px 40px -12px #000}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;border-radius:7px;cursor:pointer;text-align:left;font-size:15px}
.menu button:hover,.menu button[aria-checked="true"]{background:var(--sel)}
.menu .code{margin-left:auto;font-family:var(--f-code);font-size:11.5px;color:var(--cmt)}
.menu button[aria-checked="true"] .code{color:var(--rose)}

.main{display:grid;grid-template-columns:52px 228px minmax(0,1fr);min-height:0}
.act{background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:14px}
.act button{background:none;border:0;padding:6px;cursor:pointer;border-radius:8px;color:var(--dim)}
.act button.on{color:var(--ink);background:var(--sel)}
.act button:hover{color:var(--ink)}
.side{background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side h4{margin:0;padding:14px 18px 8px;font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--cmt)}
.tree{padding:0 8px;overflow:auto;font-size:14px}
.tree .dir{padding:4px 8px;color:var(--mute);white-space:nowrap}
.tree button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--mute);text-align:left;white-space:nowrap}
.tree button:hover{background:var(--card);color:var(--ink)}
.tree button.on{background:var(--sel);color:var(--ink)}
.fi{font-family:var(--f-code);font-size:9.5px;font-weight:700;width:30px;text-align:center;flex:none;border-radius:3px;padding:1px 0}
.fi.ts{color:#0C1020;background:var(--ice)} .fi.md{color:#0C1020;background:var(--gold)} .fi.tst{color:#0C1020;background:var(--mint)}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;font-size:12.5px;color:var(--cmt);line-height:1.6}
.sidefoot .logo{font-size:19px;display:block}
.sidefoot a{color:var(--rose);text-decoration:none}

.center{display:grid;grid-template-rows:40px minmax(0,1fr) 168px;min-height:0;min-width:0}
.tabbar{display:flex;align-items:stretch;background:var(--bar);border-bottom:1px solid var(--line);min-width:0}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:7px;padding:0 16px;border:0;border-top:2px solid transparent;background:none;cursor:pointer;white-space:nowrap;font-size:13.5px;color:var(--cmt)}
.tabs button.on{background:var(--win);border-top-color:var(--rose);color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.prevbtn{display:flex;align-items:center;gap:7px;border:0;border-left:1px solid var(--line);background:none;padding:0 14px;cursor:pointer;color:var(--mute);font-size:13px;white-space:nowrap}
.prevbtn[aria-pressed="true"]{color:var(--rose)}
.prevbtn:hover{color:var(--ink)}
.editor{overflow:auto;min-width:0}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:100%}
.codep{border-right:1px solid var(--line);padding:16px 0 26px;min-width:0;overflow-x:auto}
.prevp{background:var(--pane);padding:22px;min-width:0;display:grid;gap:16px;align-content:start}
.noprev .split{grid-template-columns:minmax(0,1fr)} .noprev .prevp{display:none}
.code{font-family:var(--f-code);font-size:14.5px;line-height:26px;white-space:pre;min-width:max-content}
.code .l{display:block;padding-right:24px}
.code .l:hover{background:#141A38}
.ln{display:inline-block;width:52px;padding-right:18px;text-align:right;color:var(--dim);user-select:none}
.c{color:var(--cmt)} .k{color:var(--rose)} .s{color:var(--ice)} .n{color:var(--gold)} .p{color:var(--lav)} .i{color:var(--ink)} .m{color:var(--mute)}
.inlay{display:inline-block;vertical-align:middle;height:9px;border-radius:2px;margin:0 10px 3px 8px;opacity:.9}
.cd{font-family:var(--f-code);font-size:11.5px;border-radius:4px;padding:1px 8px;margin:0 10px 0 8px;border:1px solid var(--line);color:var(--ink);background:var(--card)}
.cd.soon{border-color:var(--rose-d);color:var(--rose)} .cd.done{color:var(--cmt)}
.warnsq{text-decoration:underline wavy var(--gold);text-underline-offset:5px}
.chipi{font-family:var(--f-code);font-size:11px;color:#2A1A14;background:var(--rose);border-radius:4px;padding:1px 7px;margin-left:10px}
.cursor{display:inline-block;width:9px;height:19px;background:var(--rose);vertical-align:-4px;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.pv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.pvh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pvh h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.pvh span{font-family:var(--f-code);font-size:11.5px;color:var(--cmt)}
.tag{font-family:var(--f-code);font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid;white-space:nowrap}
.tag.on{color:var(--mint);border-color:#3D6656} .tag.warn{color:var(--gold);border-color:#6E5A30}

.board{display:grid;gap:9px}
.brow{display:grid;grid-template-columns:22px 62px minmax(0,1fr) 64px 70px;gap:10px;align-items:center;font-size:14px}
.brow .rk{font-family:var(--f-code);color:var(--cmt);font-size:12.5px}
.brow .tk{font-family:var(--f-code);font-weight:700}
.btrack{height:14px;background:#0F1430;border-radius:4px;overflow:hidden}
.bfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--rose-d),var(--rose))}
.brow .cap{font-family:var(--f-code);text-align:right;color:var(--mute);font-size:13px}
.pill{font-family:var(--f-code);font-size:12.5px;font-weight:700;text-align:center;border-radius:5px;padding:2px 0}

.home{padding:26px;display:grid;gap:18px;max-width:1360px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.hcopy{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8px 4px}
.hcopy h1{margin:0;font-family:var(--f-logo);font-style:italic;font-weight:400;font-size:clamp(46px,5.6vw,78px);line-height:1}
.hcopy h1 b{font-weight:400;color:var(--rose)}
.hcopy .tagl{font-family:var(--f-code);color:var(--rose);font-size:17px;margin:0}
.hcopy p{margin:0;color:var(--mute);font-size:16.5px;max-width:52ch;line-height:1.65}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--f-ui);border-radius:9px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--rose-d)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#2A1A14}
.btn.pri:hover{background:#F6CDBB}
.nextcard{background:radial-gradient(120% 120% at 100% 0%,#2A2340 0%,var(--card) 55%);border:1px solid #4A3B45;border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.nextcard .who{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nextcard .who b{font-family:var(--f-code);font-size:36px;letter-spacing:.02em}
.cdbig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cdbig div{background:#0E1229;border:1px solid var(--line);border-radius:12px;padding:12px 6px 10px;text-align:center}
.cdbig strong{display:block;font-family:var(--f-code);font-size:clamp(28px,3.4vw,46px);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.cdbig small{display:block;margin-top:6px;font-family:var(--f-code);font-size:11px;color:var(--cmt);letter-spacing:.12em}
.nextcard .when{color:var(--mute);font-size:14.5px}
.queue{display:flex;gap:8px;flex-wrap:wrap}
.qchip{font-family:var(--f-code);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mute);background:#0E1229}
.qchip b{color:var(--ink);font-weight:700;margin-right:6px}
.tiles{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.gwrap{display:grid;justify-items:center;gap:4px}
.gwrap svg{width:100%;max-width:300px;height:auto;display:block}
.gval{font-family:var(--f-code);font-size:44px;font-weight:700;line-height:1;margin-top:-46px}
.gzone{font-size:15px;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:12px}
.mini div{background:#0E1229;border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.mini small{display:block;font-size:11.5px;color:var(--cmt)}
.mini strong{font-family:var(--f-code);font-size:18px}
.mini em{font-style:normal;font-size:12px;display:block}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:#0E1229;border:1px solid var(--line);border-radius:10px;padding:9px 7px;min-height:116px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wd.today{border-color:var(--rose);box-shadow:inset 0 0 0 1px var(--rose)}
.wd .dn{font-family:var(--f-code);font-size:11.5px;color:var(--cmt)}
.wd.today .dn{color:var(--rose)}
.wd .dd{font-family:var(--f-code);font-size:20px;font-weight:700;line-height:1}
.ev{font-size:11.5px;line-height:1.3;border-radius:5px;padding:3px 6px;background:var(--sel);color:var(--ink);overflow-wrap:anywhere}
.ev.e{background:#3A2B33;color:var(--rose)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;cursor:pointer}
.fcard:hover{border-color:var(--rose-d);background:var(--card2)}
.fcard .fn{display:flex;align-items:center;gap:9px;font-family:var(--f-code);font-size:14px;color:var(--ink)}
.fcard p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.5}
.disc{color:var(--cmt);font-size:13px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.disc a{color:var(--rose);text-decoration:none}

.uplist{display:grid;gap:10px}
.uprow{display:grid;grid-template-columns:64px minmax(0,1fr) 92px;gap:12px;align-items:center}
.uprow .tk{font-family:var(--f-code);font-weight:700;font-size:15px}
.uprow .meta{font-size:12.5px;color:var(--cmt)}
.uptrack{height:10px;border-radius:5px;background:#0F1430;overflow:hidden;margin-top:5px}
.upfill{height:100%;border-radius:5px;background:var(--rose)}
.upfill.est{background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 10px)}
.uprow .t{font-family:var(--f-code);font-size:13px;text-align:right}
.tlw{overflow-x:auto} .tlw svg{display:block;width:100%;min-width:560px;height:auto}

.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kcol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start}
.kcol h3{margin:0 0 2px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between}
.kcard{background:#0E1229;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;line-height:1.45}
.graph{display:grid;padding-left:30px;position:relative}
.graph::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--rose),var(--line))}
.gc{position:relative;padding:0 0 16px}
.gc::before{content:"";position:absolute;left:-25px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--win);border:2px solid var(--rose)}
.gc .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.gc .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-code);font-size:12.5px}
.gc .h{color:var(--gold)} .gc .d{color:var(--cmt)} .gc .head{color:#2A1A14;background:var(--rose);border-radius:4px;padding:0 6px;font-size:11px}
.gc .sub{font-family:var(--f-code);font-size:14px;margin-top:4px}
.gc .body{color:var(--mute);font-size:14.5px;margin-top:4px}
.chans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chan{display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink)}
a.chan:hover{border-color:var(--rose-d)}
.chan small{font-family:var(--f-code);font-size:11px;letter-spacing:.12em;color:var(--rose)}
.chan b{font-size:19px}
.chan span{color:var(--mute);font-size:14px}

.runner{margin:18px 24px 28px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;max-width:1240px}
.rmain,.rside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.rdesc{color:var(--mute);margin:0 0 12px;font-size:15.5px}
.rtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-family:var(--f-code);font-size:13px;color:var(--cmt)}
.rtop b{color:var(--ink);font-size:16px;margin-left:5px}
.cbox{background:#0E1229;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.cbox svg{display:block;width:100%;min-width:440px;height:auto}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.guess button{display:grid;gap:3px;justify-items:center;padding:14px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:#0E1229;font-family:var(--f-code);font-size:12.5px;color:var(--cmt)}
.guess button b{font-family:var(--f-ui);font-size:19px;color:var(--ink)}
.guess button:hover{background:var(--sel)}
.guess button:disabled{opacity:.45;cursor:default}
.verdict{min-height:26px;margin-top:10px;font-family:var(--f-code);font-size:14px}
.dotsrow{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
.dotsrow i{width:24px;height:24px;border-radius:6px;background:#0E1229;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--f-code);font-size:12px;color:var(--cmt)}
.res{border-top:1px dashed var(--line);padding-top:14px;margin-top:6px}
.res .big{font-family:var(--f-code);font-size:20px}
.res .big em{font-style:normal;color:var(--rose)}
.res p{color:var(--mute);margin:6px 0 0;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.row input{flex:1;min-width:140px;font:14px var(--f-ui);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:#0E1229;color:var(--ink)}
.hof h5{margin:0 0 6px;font-family:var(--f-code);font-size:11.5px;letter-spacing:.08em;color:var(--cmt);font-weight:400}
.hof ol{margin:0;padding-left:22px;color:var(--mute);font-size:14px}
.small{font-size:12.5px;color:var(--cmt);line-height:1.6}

.term{border-top:1px solid var(--line);background:var(--bar);display:grid;grid-template-rows:34px minmax(0,1fr);min-height:0}
.ttabs{display:flex;gap:20px;padding:0 18px;align-items:center;font-size:11.5px;letter-spacing:.08em;color:var(--cmt)}
.ttabs .on{color:var(--ink);border-bottom:1px solid var(--rose);padding-bottom:6px;margin-top:7px}
.tout{overflow:auto;padding:4px 18px 10px;font-family:var(--f-code);font-size:13px;line-height:21px;color:#CDD1E6}
.tout div{white-space:pre-wrap;word-break:break-word}
.tform{display:flex;gap:8px;align-items:center}
.tform label{color:var(--rose);white-space:nowrap}
.tform input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink);font:13px var(--f-code);caret-color:var(--rose)}
.tform:focus-within label{text-decoration:underline;text-underline-offset:3px}

.status{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:0 12px;background:var(--sel);font-family:var(--f-code);font-size:12px;color:#CDD1E6;overflow:hidden;white-space:nowrap}
.status div{display:flex;gap:16px;align-items:center}
.status button{background:none;border:0;padding:0 2px;cursor:pointer;font:inherit;color:inherit}
.status button:hover{color:var(--ink);text-decoration:underline}
.status a{color:var(--rose);text-decoration:none}
.status .warn{color:var(--gold)}

  .center{grid-template-rows:40px minmax(0,1fr) 140px}

@media (max-width:560px){
  body{padding-block:8px}

  .focus span,.dots{display:none}
  .logo{font-size:19px}

  .mini{grid-template-columns:minmax(0,1fr)}

}

  zones.forEach(z=>{h+=`<path d="${arc(110,110,88,f(z[0])+.006,f(z[1])-.006)}" stroke="${z[2]}" stroke-width="14" fill="none" opacity=".9"/>`;});
  for(let x=0;x<=20;x++){const a=polar(110,110,70,x/20),b=polar(110,110,x%5?66:61,x/20);h+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#C88A72" stroke-width="1"/>`;}
  const nd=polar(110,110,80,f(v)); h+=`<line x1="110" y1="110" x2="${nd[0].toFixed(1)}" y2="${nd[1].toFixed(1)}" stroke="#F2EFF7" stroke-width="3" stroke-linecap="round"/><circle cx="110" cy="110" r="6" fill="#EDBBA6"/>`;

  $('probLbl').innerHTML=`${esc(t.problems)} <span style="color:${col.down}">${fallCount}</span> <span style="color:#F4C96E">⚠ ${estCount}</span>`;
  $('stFall').innerHTML=`<span style="color:${col.down}">●</span> ${esc(fmt(t.falling,{n:fallCount}))} &nbsp;<span style="color:#F4C96E">⚠</span> ${esc(fmt(t.prob_est,{n:estCount}))}`;
  $('stBoss').textContent=t.boss; $('stSample').textContent=t.sample; $('stColor').textContent=col.mode==='asia'?t.colorAsia:t.colorUS; $('stLang').textContent=L[lang].name; $('tin').placeholder=t.t_hint;
  let tree=`<div class="dir">▾ stayhungry.asi</div>`, cur='';
  FILES.forEach(f=>{ if(f.dir!==cur){cur=f.dir; if(cur) tree+=`<div class="dir" style="padding-left:22px">▾ ${cur}</div>`;} tree+=`<button data-open="${f.id}" class="${f.id===file?'on':''}" style="padding-left:${f.dir?36:22}px"><span class="fi ${f.ic}">${ICL[f.ic]}</span>${f.name}</button>`; });
  $('tree').innerHTML=tree;
  $('tabs').innerHTML=FILES.map(f=>`<button role="tab" aria-selected="${f.id===file}" class="${f.id===file?'on':''}" data-open="${f.id}"><span class="fi ${f.ic}">${ICL[f.ic]}</span>${f.name}</button>`).join('');
  $('act').innerHTML=Object.keys(ICONS).map(id=>`<button data-open="${id}" class="${id===file?'on':''}" aria-label="${fname(id)}" title="${fname(id)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${ICONS[id]}</svg></button>`).join('');
  $('prevBtn').hidden=!['market','earn','radar','links'].includes(file); $('prevBtn').setAttribute('aria-pressed',String(showPrev));
  $('prevBtn').innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>${esc(t.togglePrev)}`;
  $('center').classList.toggle('noprev',!showPrev);
  $('tcenter').textContent=`${fname(file)} — stayhungry.asi`; $('stLn').textContent=`Ln ${lineCount[file]||1}, Col 1`;
}
function renderAll(){ vReadme(); vMarket(); vEarn(); vRadar(); vGameHead(); vLinks(); vRoadmap(); vLog(); renderChrome(); render(curShown); }
function open(id){
  if(!FILES.some(f=>f.id===id)) return false;
  file=id; FILES.forEach(f=>{$('v-'+f.id).hidden=f.id!==id;}); $('editor').scrollTop=0; renderChrome();
  const tab=$('tabs').querySelector('.on'); if(tab&&tab.scrollIntoView) tab.scrollIntoView({block:'nearest',inline:'nearest'});
  return true;
}
function setLang(c2){ if(!LANGS.includes(c2)) return; if(window.SHA_PATHS&&c2!==lang){ store.set('sha-lang',c2); location.href='../'+c2+'/'; return; } lang=c2; store.set('sha-lang',c2); renderAll(); open(file); }
function togglePrev(){ showPrev=!showPrev; store.set('sha-prev',showPrev); renderChrome(); }

document.addEventListener('click',e=>{
  if(e.target.closest('[data-boss]')){ bossOn(); return; }
  const o=e.target.closest('[data-open]'); if(o){ open(o.dataset.open); return; }
  const lb=e.target.closest('[data-lang]'); if(lb){ setLang(lb.dataset.lang); closeMenu(); $('langBtn').focus(); return; }
  if(!e.target.closest('#langMenu')&&!e.target.closest('#langBtn')) closeMenu();
});
function closeMenu(){ $('langMenu').hidden=true; $('langBtn').setAttribute('aria-expanded','false'); }
$('langBtn').addEventListener('click',()=>{ const mm=$('langMenu'); mm.hidden=!mm.hidden; $('langBtn').setAttribute('aria-expanded',String(!mm.hidden)); if(!mm.hidden){const b=mm.querySelector('[aria-checked="true"]'); b&&b.focus();} });
$('prevBtn').addEventListener('click',togglePrev);
$('stColor').addEventListener('click',()=>{ colorMode=colors().mode==='asia'?'us':'asia'; store.set('sha-color',colorMode); renderAll(); open(file); });

const t0=Date.now();
setInterval(()=>{ const sc=Math.floor((Date.now()-t0)/1000); $('timer').textContent=[Math.floor(sc/3600),Math.floor(sc/60)%60,sc%60].map(v=>String(v).padStart(2,'0')).join(':'); tickHero(); },1000);
setInterval(()=>{ if(file==='earn') vEarn(); if(file==='readme') vReadme(); },60000);

function bossOn(){
  const t=T(), mods=['core/ledger','core/forecast','reports/q3-budget','reports/headcount','utils/date','utils/currency','ui/table','ui/chart'];
  let h=`<div class="dimb">$ npm run build</div><div class="dimb">&gt; quarterly-report@3.4.1 build</div><div class="dimb">&gt; tsc --noEmit &amp;&amp; vite build</div><br>`;
  mods.forEach((x,j)=>{h+=`<div>transforming src/${x}.ts <span class="dimb">(${(12+j*7)%40+8}ms)</span></div>`;});
  h+=`<br><div class="ok">✓ 214 modules transformed.</div><div>dist/assets/index-4f9c2a.js   <span class="dimb">182.40 kB │ gzip: 58.31 kB</span></div><div>dist/assets/index-b71e0d.css  <span class="dimb">24.15 kB │ gzip: 6.02 kB</span></div><br><div class="ok">✓ ${esc(t.b_title)} in 3.18s</div><div class="dimb">$ <span class="cursor" style="background:#8FC58F"></span></div><div class="hint">${esc(t.b_ret)}</div>`;
  $('boss').innerHTML=h; $('boss').hidden=false; window._title=document.title; document.title='quarterly-report — build';
}
function bossOff(){ $('boss').hidden=true; if(window._title) document.title=window._title; }
$('boss').addEventListener('click',bossOff); $('stBoss').addEventListener('click',bossOn);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!$('langMenu').hidden){closeMenu();$('langBtn').focus();return;} $('boss').hidden?bossOn():bossOff(); return; }
  if(file==='game'&&$('boss').hidden&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){ if(e.key==='ArrowUp'){e.preventDefault();answer(true);} if(e.key==='ArrowDown'){e.preventDefault();answer(false);} }
});

function tprint(h){ const d=document.createElement('div'); d.innerHTML=h; $('tlog').appendChild(d); $('tout').scrollTop=$('tout').scrollHeight; }
function boot(){
  const t=T(), col=colors(); $('tlog').innerHTML=''; tprint('<span style="color:#EDBBA6">$</span> npm run observe');
  const rows=[['09:31:02','INFO ',col.up,'NVDA  ',`<span style="color:${col.up}">+2.31%</span>`,`${t.sampleHead} · ${t.heads[0]}`],['09:31:40','WARN ','#F4C96E','BTC   ',`<span style="color:${col.down}">-3.80%</span>`,`${t.sampleHead} · ${t.heads[1]}`],['09:32:15','ERROR','#F4808A','TSLA  ',`<span style="color:${col.down}">-4.12%</span>`,t.heads[2]],['09:33:01','INFO ','#9CC4EA','RISK  ','',t.heads[3]]];
  const nx=nextEarn(Date.now()); if(nx) rows.splice(1,0,['09:30:11','INFO ','#9CC4EA','EARN  ','',fmt(t.bootE,{t:nx.t,d:erLabel(nx,t,Date.now())})]);
  rows.forEach(r=>tprint(`<span style="color:#959CC2">[${r[0]}]</span> <span style="color:${r[2]}">${r[1]}</span> ${r[3]}${r[4]}  ${esc(r[5])}`));
}
const alias={readme:'readme','readme.md':'readme',home:'readme',market:'market','market.ts':'market',earnings:'earn',earn:'earn','earnings.ts':'earn',radar:'radar',crisis:'radar','crisis-radar':'radar','crisis-radar.ts':'radar',game:'game',chart:'game',test:'game','chart.test.ts':'game',channels:'links','channels.ts':'links',links:'links',roadmap:'roadmap','roadmap.md':'roadmap',log:'log',changelog:'log','changelog.md':'log'};
$('tform').addEventListener('submit',e=>{
  e.preventDefault(); const raw=$('tin').value.trim(); $('tin').value=''; if(!raw) return;
  tprint(`<span style="color:#EDBBA6">guest@stayhungry.asi:~$</span> ${esc(raw)}`);
  const [cmd,...args]=raw.split(/\s+/), a=(args[0]||'').toLowerCase(), t=T();
  switch(cmd.toLowerCase()){
    case 'help': t.t_help.forEach(l=>tprint(esc(l))); break;
    case 'ls': tprint(FILES.map(f=>`<span style="color:#9CC4EA">${f.dir?f.dir+'/':''}${f.name}</span>`).join('   ')); break;
    case 'open': case 'cat': case 'code': { const id=alias[a]; if(id&&open(id)) tprint(esc(fmt(t.t_open,{f:fname(id)}))); else tprint(`<span style="color:#F4808A">${esc(fmt(t.t_nofile,{f:a||'?'}))}</span>`); break; }
    case 'earnings': open('earn'); tprint(esc(fmt(t.t_open,{f:'earnings.ts'}))); break;
    case 'play': open('game'); tprint(esc(fmt(t.t_open,{f:'chart.test.ts'}))); break;
    case 'preview': togglePrev(); break;
    case 'lang': if(LANGS.includes(a)){ setLang(a); tprint(esc(L[a].t_lang)); } else tprint('lang en | ko | es | ja'); break;
    case 'boss': bossOn(); break;
    case 'clear': $('tlog').innerHTML=''; break;
    case 'whoami': tprint(esc(t.t_whoami)); break;
    case 'date': tprint(esc(new Intl.DateTimeFormat(t.loc,{dateStyle:'full',timeStyle:'short'}).format(new Date()))); break;
    case 'sudo': tprint('<span style="color:#F4C96E">nice try.</span>'); break;
    default: tprint(`<span style="color:#F4808A">${esc(fmt(t.t_unknown,{c:cmd}))}</span>`);
  }
});

const NS='http://www.w3.org/2000/svg', svg=$('candles'), ROUNDS=10;
let score=0,streak=0,best=0,data=[],locked=false,curShown=7,lastVerdict=null,results=[];
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function gen(){ let pr=40+Math.random()*460, dr=(Math.random()-.5)*.012, vol=.012+Math.random()*.02; const out=[]; for(let j=0;j<10;j++){ if(j===7) dr=(Math.random()-.5)*.012; const o=pr,cl=o*(1+dr+randn()*vol),h=Math.max(o,cl)*(1+Math.abs(randn())*vol*.5),l=Math.min(o,cl)*(1-Math.abs(randn())*vol*.5); out.push({o,c:cl,h,l}); pr=cl; } return out; }
function el(tag,at,txt){const e=document.createElementNS(NS,tag);for(const q in at)e.setAttribute(q,at[q]);if(txt!=null)e.textContent=txt;return e;}
function render(shown){
  curShown=shown; if(!data.length) return; svg.innerHTML=''; const col=colors(), Lp=60,R=18,Tp=16,B=32,w=640-Lp-R,h=280-Tp-B,slot=w/10;
  const vis=data.slice(0,shown); let lo=Math.min(...vis.map(d=>d.l)),hi=Math.max(...vis.map(d=>d.h)); const pad=(hi-lo)*.12||1; lo-=pad; hi+=pad; const y=v=>Tp+(hi-v)/(hi-lo)*h;
  for(let j=0;j<=4;j++){const v=lo+(hi-lo)*j/4,yy=y(v); svg.appendChild(el('line',{x1:Lp,x2:640-R,y1:yy,y2:yy,stroke:'#232A4D'})); svg.appendChild(el('text',{x:Lp-8,y:yy+4,fill:'#959CC2','font-size':11.5,'text-anchor':'end','font-family':'JetBrains Mono,monospace'},v.toFixed(2)));}
  const base=data[6].c; if(shown>7) svg.appendChild(el('line',{x1:Lp,x2:640-R,y1:y(base),y2:y(base),stroke:'#EDBBA6','stroke-dasharray':'4 4',opacity:.85}));
  for(let j=0;j<10;j++){ const cx=Lp+slot*j+slot/2; svg.appendChild(el('text',{x:cx,y:280-10,fill:j>=7?'#EDBBA6':'#959CC2','font-size':11.5,'text-anchor':'middle','font-family':'JetBrains Mono,monospace'},j<7?`D-${6-j}`:`D+${j-6}`));
    if(j<shown){ const d=data[j],cc=d.c>=d.o?col.up:col.down; svg.appendChild(el('line',{x1:cx,x2:cx,y1:y(d.h),y2:y(d.l),stroke:cc,'stroke-width':1.6})); svg.appendChild(el('rect',{x:cx-slot*.3,y:y(Math.max(d.o,d.c)),width:slot*.6,height:Math.max(2,Math.abs(y(d.o)-y(d.c))),fill:cc,rx:2})); }
    else { svg.appendChild(el('rect',{x:cx-slot*.34,y:Tp+6,width:slot*.68,height:h-12,fill:'none',stroke:'#C88A72','stroke-dasharray':'3 4',rx:7,opacity:.75})); svg.appendChild(el('text',{x:cx,y:Tp+h/2+7,fill:'#EDBBA6','font-size':20,'text-anchor':'middle','font-family':'JetBrains Mono,monospace'},'?')); } }
  if(shown===10){ const d=data[9],chg=(d.c/base-1)*100,ex=Lp+slot*9.5,ey=y(d.c); svg.appendChild(el('circle',{cx:ex,cy:ey,r:4.5,fill:'#F2EFF7'})); svg.appendChild(el('text',{x:ex-10,y:Math.max(ey-10,14),fill:chg>=0?col.up:col.down,'font-size':14,'font-weight':700,'text-anchor':'end','font-family':'JetBrains Mono,monospace'},pct(chg))); }
}
function dots(){ $('dotsRow').innerHTML=Array.from({length:ROUNDS},(_,j)=>{const r=results[j]; return `<i style="${r==null?'':r?'background:#1F3A31;border-color:#3D6656;color:#83D8B6':'background:#3A2228;border-color:#6A3540;color:#F4808A'}">${r==null?j+1:r?'✓':'✗'}</i>`;}).join(''); }
function gameHud(){ const t=T(); $('gSum').textContent=fmt(t.gm_sum,{p:score,f:results.length-score,n:ROUNDS}); $('gK').textContent=streak; dots(); }
function newRound(){ data=gen(); locked=false; lastVerdict=null; render(7); $('bUp').disabled=$('bDown').disabled=false; $('verdict').textContent=''; gameHud(); }
function showVerdict(){ const t=T(),v=lastVerdict; $('verdict').style.color=v.ok?'#83D8B6':'#F4808A'; $('verdict').textContent=fmt(v.ok?t.gm_pass:t.gm_fail,{c:pct(v.chg)}); }
function answer(isUp){
  if(locked||results.length>=ROUNDS) return; locked=true; $('bUp').disabled=$('bDown').disabled=true;
  const ok=(data[9].c>data[6].c)===isUp, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let st=7;
  const tick=()=>{ st++; render(st); if(st<10) setTimeout(tick,reduce?0:240); else fin(); }; tick();
  function fin(){ results.push(ok); if(ok){score++;streak++;best=Math.max(best,streak);} else streak=0; lastVerdict={ok,chg:(data[9].c/data[6].c-1)*100}; showVerdict(); gameHud();
    setTimeout(()=>{ if(results.length>=ROUNDS) end(); else newRound(); },reduce?900:1400); }
}
const tierOf=sc=>T().tiers[sc>=8?3:sc>=6?2:sc>=4?1:0];
function endText(){ const t=T(); $('rBig').innerHTML=`${score}/${ROUNDS} · <em>${esc(tierOf(score))}</em>`; $('rText').textContent=fmt(t.gm_end,{b:best})+' '+(score>=6?t.gm_end_good:t.gm_end_norm); }
function end(){ $('bUp').disabled=$('bDown').disabled=true; $('res').hidden=false; endText(); $('hofForm').hidden=score<3; $('copied').textContent=''; }
function hofRender(){ const list=store.get('sha-hof',[]),ol=$('hofList'); ol.innerHTML=''; if(!list.length){const li=document.createElement('li'); li.textContent=T().hof_empty; ol.appendChild(li); return;}
  list.forEach(r=>{const li=document.createElement('li'),b=document.createElement('b'); b.style.color='#F2EFF7'; b.textContent=r.name; li.appendChild(b); li.appendChild(document.createTextNode(` · ${r.score}/${ROUNDS} · ${r.date}`)); ol.appendChild(li);}); }
$('hofSave').addEventListener('click',()=>{ const nm=$('hofName').value.trim()||'anonymous', list=store.get('sha-hof',[]); list.push({name:nm,score,date:new Date().toISOString().slice(0,10)}); list.sort((a,b)=>b.score-a.score); store.set('sha-hof',list.slice(0,5)); hofRender(); $('hofForm').hidden=true; });
$('share').addEventListener('click',()=>{ const t=T(), txt=fmt(t.share,{s:score,t:tierOf(score)})+CREDIT, done=()=>{$('copied').textContent=t.copied;};
  const fb=()=>{const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){$('copied').textContent=txt;} ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,fb); else fb(); });
$('again').addEventListener('click',()=>{ results=[];score=0;streak=0;best=0; $('res').hidden=true; newRound(); });
$('bUp').addEventListener('click',()=>answer(true)); $('bDown').addEventListener('click',()=>answer(false));

data=gen(); renderAll(); open('readme'); boot(); newRound();
})();
</script>
