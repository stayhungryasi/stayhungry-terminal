<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차등의결권이 정말 운명을 갈랐나</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout: 한 열 스크롤 리포트. 요약(판정) → 구조(지분·의결권) → 가격 → 시총 → 일정 → 한미 대비 */
:root{
  color-scheme: dark; /* 허브(stayhungryasi.com) 단일 다크 테마 */
  --page:#0A0C10; --surface:#12161E; --ink:#EEF0F5; --ink2:#C7CCD8; --muted:#7C8499;
  --grid:#1D2330; --axis:#2A3142; --ring:#1D2330;
  --acc:#F26522; --acc2:#FF8A4C;
  --s1:#2F8FDD; --s2:#d95926; --s3:#2EA87A;
  --good:#2EA87A; --warn:#F2B33D; --serious:#FF8A4C;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Noto Sans KR",monospace;
  --display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:20px}
header .kicker{font-family:var(--mono);font-size:12px;color:var(--acc2);letter-spacing:.06em}
h1{font-family:var(--display);font-weight:900;font-size:28px;line-height:1.25;margin:6px 0 10px;text-wrap:balance}
header p{margin:0;color:var(--ink2);max-width:60ch}
.lede{margin-top:14px;padding:14px 16px;border-left:3px solid var(--acc);background:var(--surface);font-weight:600}
section{background:var(--surface);border:1px solid var(--ring);border-radius:18px;padding:20px 16px}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--ink2);font-size:13px;margin:0 0 14px}
.note{color:var(--muted);font-size:12px;margin:12px 0 0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
body{word-break:keep-all;overflow-wrap:anywhere}

/* 판정 */
.tally{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;margin-bottom:10px}
.tally i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.g{background:var(--good)} .w{background:var(--warn)} .c{background:var(--serious)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.tile{appearance:none;border:0;border-radius:8px;padding:8px 0 6px;font:inherit;color:#0b0b0b;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2}
.tile b{font-size:15px}
.tile small{font-size:12px}
.tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.tile:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.detail{margin-top:14px;padding:12px 14px;border:1px solid var(--grid);border-radius:10px;min-height:118px}
.detail .tag{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;margin-bottom:4px}
.detail .claim{font-weight:600;margin:0 0 4px}
.detail .find{margin:0;color:var(--ink2);font-size:14px}

/* 덤벨 */
.db{display:flex;flex-direction:column;gap:14px;position:relative}
.db-row .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:baseline;flex-wrap:wrap}
.db-row .who{font-weight:600}
.db-row .vals{color:var(--ink2)}
.track{position:relative;height:18px;margin-top:4px}
.track::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:var(--grid)}
.track .half{position:absolute;left:50%;top:-2px;bottom:-2px;width:0;border-left:1px dashed var(--axis)}
.track .link{position:absolute;top:7px;height:4px;background:var(--acc);opacity:.45;border-radius:2px}
.dot{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--surface)}
.dot.own{background:var(--surface);border:3px solid var(--ink2)}
.dot.vote{background:var(--acc)}
.dot.ghost{background:transparent;border:2px dashed var(--muted)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}

/* 주가 */
.readout{font-size:14px;margin:0 0 8px;min-height:44px}
.readout b{font-size:26px;font-family:var(--mono);color:var(--acc)}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--mono);fill:var(--muted);font-size:10px}
svg .lab{fill:var(--ink);font-size:11px;font-weight:600}
.pt{cursor:pointer}

/* 시총 */
.share{display:flex;gap:2px;height:22px;border-radius:5px;overflow:hidden;margin-bottom:8px}
.share i{display:block}
.t1{background:var(--s1)} .t2{background:var(--s2)} .t3{background:var(--s3)}
.caps{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.cap .top{display:flex;gap:8px;align-items:baseline;font-size:13px}
.cap .rk{color:var(--muted);width:18px;flex:none;text-align:right}
.cap .nm{font-weight:600}
.cap .ctl{color:var(--ink2);font-size:12px;flex:1;min-width:0}
.cap .v{margin-left:auto;font-weight:600;flex:none}
.bar{height:10px;margin:3px 0 0 26px;background:transparent}
.bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.bar i.pf{background:repeating-linear-gradient(45deg,var(--s2) 0 4px,transparent 4px 8px);border:1px solid var(--s2)}
.cap.sep{border-top:1px dashed var(--axis);padding-top:10px}

/* 타임라인 */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:78px 16px 1fr;gap:8px;align-items:start;padding:6px 0;font-size:14px}
.tl time{color:var(--muted);font-size:12px;padding-top:2px;text-align:right}
.tl .mk{width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:5px;justify-self:center}
.tl .next .mk{background:var(--surface);border:2px solid var(--acc2)}
.tl .next time{color:var(--acc2);font-weight:600}
.tl .div{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px dashed var(--axis);padding-top:8px;margin-top:4px}

/* 한미 */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{border:1px solid var(--grid);border-radius:10px;padding:12px}
.vs h3{margin:0 0 6px;font-size:14px;font-family:var(--display)}
.vs ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}
.vs .arrow{font-size:12px;font-weight:700;color:var(--ink);margin-top:8px}
@media (max-width:480px){.vs{grid-template-columns:1fr} h1{font-size:24px}}
.open{margin:0;padding-left:18px;font-size:14px;color:var(--ink2)}
footer{color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .12s}.tile:active{transform:scale(.96)}}
</style>
</head>
<body>
<main>
<header><div class="kicker" data-t="kicker"></div><h1><span data-t="h1a"></span><br><span style="color:var(--acc)" data-t="h1b"></span></h1><p data-t="intro"></p><div class="lede" data-t="lede"></div></header>
<section><h2 data-t="v_h"></h2><p class="sub" data-t="v_sub"></p><div class="tally" id="tally"></div><div class="legend" id="vlegend"></div><div class="tiles" id="tiles"></div><div class="detail" id="detail" aria-live="polite"></div></section>
<section><h2 data-t="d_h"></h2><p class="sub" data-t="d_sub"></p><div class="legend" id="dlegend"></div><div class="db" id="db"></div><div class="scale num"><span>0%</span><span>25</span><span>50</span><span>75</span><span>100%</span></div><p class="note" data-t="d_note"></p></section>
<section><h2 data-t="p_h"></h2><p class="sub" data-t="p_sub"></p><p class="readout" id="readout"></p><svg id="px" viewBox="0 0 340 230" role="img"></svg><p class="note" data-t="p_note"></p></section>
<section><h2 data-t="c_h"></h2><p class="sub" data-t="c_sub"></p><div class="share" id="share"></div><div class="legend" id="share-legend"></div><div class="caps" id="caps"></div><p class="note" data-t="c_note"></p></section>
<section><h2 data-t="t_h"></h2><p class="sub" data-t="t_sub"></p><ol class="tl" id="tl"></ol></section>
<section><h2 data-t="s_h"></h2><p class="sub" data-t="s_sub"></p><div class="vs"><div><h3 data-t="us"></h3><ul id="us_l"></ul><div class="arrow" data-t="us_a"></div></div><div><h3 data-t="kr"></h3><ul id="kr_l"></ul><div class="arrow" data-t="kr_a"></div></div></div></section>
<section><h2 data-t="o_h"></h2><ul class="open" id="o_l"></ul></section>
<footer data-t="foot"></footer>
</main>
