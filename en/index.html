<style>
/* Layout: one long report made of LOG panels, the card-news system at page scale. Near-black grid ground, white + orange stacked headlines, tracked mono eyebrows, one giant number per panel, hatched = estimate, source line under every panel. Single dark look by design. */
:root{
  --bg:#0A0C10; --card:#12161E; --card2:#171C26; --line:#1D2330; --line2:#2A3142; --grid:rgba(255,255,255,.028);
  --ink:#EEF0F5; --ink2:#C7CCD8; --mute:#8D95A8; --dim:#5E6679;
  --or:#F26522; --or2:#FF8A4C; --orbg:#2A1509;
  --blue:#2F8FDD; --green:#2EA87A; --red:#FF4438; --gold:#F2B33D;
  --sans:"Noto Sans KR","Noto Sans JP","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:dark;
}
html[lang="ko"] body{word-break:keep-all;overflow-wrap:anywhere}
html[lang="ja"]{--sans:"Noto Sans JP","Noto Sans KR","Hiragino Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
b,strong{color:var(--ink);font-weight:700}
.wrap{max-width:1180px;margin:0 auto}
.tab{font-variant-numeric:tabular-nums}
main{overflow-x:clip}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));background:rgba(10,12,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.2em;white-space:nowrap;text-decoration:none}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--or);box-shadow:0 0 12px 2px rgba(242,101,34,.7)}
.brand span{color:var(--mute);font-weight:400}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;color:var(--mute);text-decoration:none;padding:8px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--or)}
.tr{display:flex;gap:8px;align-items:center;position:relative}
.chipbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;white-space:nowrap}
.chipbtn:hover{border-color:var(--or)}
.menu{position:absolute;right:0;top:46px;min-width:190px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 20px 40px -12px #000}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:15px;text-align:left}
.menu button:hover,.menu button[aria-checked="true"]{background:var(--card2)}
.menu button span{font-family:var(--mono);font-size:12px;color:var(--mute)}
.menu button[aria-checked="true"] span{color:var(--or)}

.log{padding-block:84px 0}
.loghead{display:flex;justify-content:space-between;align-items:center;gap:16px;font-family:var(--mono);font-size:13px;letter-spacing:.26em;color:var(--mute);padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:44px}
.loghead .l{display:flex;align-items:center;gap:12px;color:var(--ink);font-weight:600;min-width:0}
.loghead .l i{width:8px;height:8px;border-radius:50%;background:var(--or);flex:none}
.eb{font-family:var(--mono);font-size:clamp(13px,1.5vw,16px);letter-spacing:.24em;color:var(--or);margin:0 0 18px;text-transform:uppercase}
h2,h3{margin:0;font-weight:900;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
.h{font-size:clamp(40px,6.4vw,88px)}
.h .o{color:var(--or);display:block}
.h .w{display:block}
.sub{margin:22px 0 0;font-size:clamp(17px,1.9vw,22px);color:var(--ink2);max-width:62ch;line-height:1.55}
.src{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
.src p{margin:0;font-size:13.5px;color:var(--dim);max-width:70ch;line-height:1.6}
.handle{font-family:var(--mono);font-size:13.5px;letter-spacing:.14em;color:var(--mute);text-align:right;text-decoration:none;line-height:1.7}
.handle:hover{color:var(--or)}
.tagS{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);border:1px solid #5C4618;border-radius:5px;padding:1px 7px;vertical-align:middle}

.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 28px;min-width:0}
.card .k{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--mute);display:flex;justify-content:space-between;gap:10px;align-items:center}
.card .v{font-size:clamp(40px,4.6vw,60px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:14px}
.card .m{font-size:16px;color:var(--ink2);margin-top:8px;line-height:1.5}
.card.hot{border-color:#4A2416;background:linear-gradient(160deg,#1C130F 0%,var(--card) 60%)}

.giant{display:flex;align-items:flex-end;gap:clamp(18px,3vw,40px);flex-wrap:wrap;margin-top:34px}
.giant .num{font-size:clamp(96px,17vw,230px);font-weight:900;line-height:.82;letter-spacing:-.05em;color:var(--or);font-variant-numeric:tabular-nums}
.giant .side{font-size:clamp(18px,2.2vw,28px);color:var(--ink2);line-height:1.4;padding-bottom:10px}
.giant .side b{display:block;font-size:clamp(22px,2.6vw,34px);color:var(--ink)}
.glow{position:relative;isolation:isolate}
.glow::after{content:"";position:absolute;right:0;top:8%;width:min(620px,80%);aspect-ratio:1;background:radial-gradient(circle,rgba(242,101,34,.18) 0%,rgba(242,101,34,0) 62%);pointer-events:none;z-index:-1}

.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:30px;max-width:900px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 6px 14px;text-align:center;min-width:0}
.cd strong{display:block;font-size:clamp(42px,8vw,104px);font-weight:900;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cd div:last-child strong{color:var(--or)}
.cd small{display:block;margin-top:8px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--mute)}
.when{margin-top:18px;font-size:clamp(16px,1.8vw,20px);color:var(--ink2);line-height:1.7}

.summary{margin-top:44px;background:var(--card);border-left:4px solid var(--or);border-radius:0 14px 14px 0;padding:28px 32px}
.summary .eb{font-size:13px;margin-bottom:16px}
.summary ol{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:s}
.summary li{counter-increment:s;font-size:clamp(17px,2vw,23px);font-weight:700;line-height:1.45;display:grid;grid-template-columns:34px minmax(0,1fr)}
.summary li::before{content:counter(s) ".";color:var(--or);font-weight:900}
.summary li a{text-decoration:none;border-bottom:1px solid var(--line2)}
.summary li a:hover{border-color:var(--or)}

.erows{margin-top:44px;border-top:1px solid var(--line)}
.erow{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) 150px;gap:24px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.erow .tk{font-size:clamp(26px,3vw,36px);font-weight:900;letter-spacing:-.02em;line-height:1.1}
.erow .dt{font-size:14.5px;color:var(--mute);margin-top:4px}
.track{height:34px;border-radius:7px;background:#141925;overflow:hidden}
.fill{height:100%;border-radius:7px;background:var(--or)}
.fill.est{background:repeating-linear-gradient(135deg,var(--or) 0 2px,rgba(242,101,34,.14) 2px 11px);box-shadow:inset 0 0 0 1.5px var(--or)}
.fill.done{background:#2A3142}
.erow .t{font-size:clamp(18px,2vw,24px);font-weight:900;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.erow .t small{display:block;font-size:12.5px;font-weight:500;color:var(--mute);font-family:var(--mono);letter-spacing:.06em}
.erow.est .t{color:var(--gold)}
.cps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.cps .d{font-size:clamp(22px,2.4vw,30px);font-weight:900;color:var(--or)}
.cps .x{font-size:19px;font-weight:700;margin-top:8px}
.cps .y{font-size:15.5px;color:var(--ink2);margin-top:2px}
.lbl{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--mute);margin:64px 0 0}

.mix{display:grid;gap:22px;margin-top:36px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:clamp(20px,2.2vw,28px);font-weight:900;margin-bottom:10px}
.mh span:last-child{color:var(--ink2)}
.mbar{display:flex;gap:4px;height:clamp(78px,9vw,112px)}
.seg{border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden}
.seg b{color:#0A0C10;font-size:clamp(12px,1.6vw,20px);font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg strong{color:#0A0C10;font-size:clamp(19px,3.2vw,40px);font-weight:900;line-height:1;letter-spacing:-.02em}
.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;font-size:16px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.tblwrap{overflow-x:auto}
.mtable{width:100%;border-collapse:collapse;margin-top:30px;font-size:clamp(15px,1.8vw,20px);min-width:420px}
.mtable th{font-weight:500;color:var(--mute);text-align:right;padding:10px 6px;font-size:15px}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:14px 6px;border-top:1px solid var(--line);text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.mtable td b{font-weight:900}

.score{margin-top:36px;display:grid;gap:6px}
.srow{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:center;padding:10px 0}
.srow .n{font-size:clamp(20px,2.2vw,26px);font-weight:900;line-height:1.2}
.srow .c{font-size:15px;color:var(--mute);margin-top:2px}
.schart{position:relative;height:56px}
.schart .zero{position:absolute;top:-8px;bottom:-8px;width:2px;background:#3A4256}
.schart .bar{position:absolute;top:10px;height:36px;border-radius:5px;background:var(--ink)}
.schart .bar.miss{background:var(--red)}
.schart .val{position:absolute;top:8px;font-size:clamp(18px,2.4vw,30px);font-weight:900;white-space:nowrap;line-height:40px}
.axis{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px}
.ticks{position:relative;height:24px;font-family:var(--mono);font-size:13px;color:var(--dim)}
.ticks span{position:absolute;transform:translateX(-50%)}
.note{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;font-size:clamp(16px,1.8vw,20px);color:var(--ink2);line-height:1.6}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font-size:18px;font-weight:700;color:var(--or);text-decoration:none;border:1.5px solid var(--or);border-radius:12px;padding:14px 20px}
.cta:hover{background:var(--orbg)}

.checks{margin-top:44px;border-top:1px solid var(--line)}
.chk{display:grid;grid-template-columns:56px minmax(0,1fr) 200px;gap:22px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.ico{width:40px;height:40px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#0A0C10}
.ico.ok{border-radius:50%;background:var(--green)}
.ico.fail{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid var(--red)}
.chk .n{font-size:clamp(20px,2.3vw,28px);font-weight:900;line-height:1.2}
.chk .m{font-size:16.5px;color:var(--ink2);margin-top:4px}
.chk .v{font-size:clamp(30px,3.8vw,48px);font-weight:900;text-align:right;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chk.bad .v{color:var(--red)}
.thermo{margin-top:84px}
.tbar{position:relative;height:22px;border-radius:11px;background:linear-gradient(90deg,var(--green) 0 40%,var(--gold) 40% 70%,var(--red) 70% 100%)}
.mk{position:absolute;top:-10px;width:6px;height:42px;margin-left:-3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 4px var(--bg)}
.mk span{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;white-space:nowrap}
.tlab{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:20px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:140px;min-width:0}
.wd .dn{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--mute)}
.wd .dd{font-size:34px;font-weight:900;line-height:1}
.wd.today{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}
.wd.today .dn{color:var(--or)}
.ev{font-size:14px;font-weight:700;border-radius:6px;padding:5px 8px;background:#1B2130;line-height:1.3}
.ev.e{background:var(--orbg);color:var(--or2)}

.rcols,.rrow{display:grid;grid-template-columns:44px 110px minmax(0,1fr) 90px 120px;gap:18px;align-items:center}
.rcols{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;color:var(--dim);margin-top:44px}
.rcols span:nth-child(4){text-align:right}
.rcols span:nth-child(5){text-align:center}
.rank{margin-top:14px;display:grid;gap:12px}
.rrow .r{font-family:var(--mono);font-size:16px;color:var(--mute)}
.rrow .tk{font-size:clamp(20px,2.2vw,26px);font-weight:900}
.rrow .bar{height:30px;border-radius:5px;background:var(--ink)}
.rrow:first-child .bar{background:var(--or)}
.rrow .cap{font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:17px;font-weight:900;text-align:center;border-radius:8px;padding:4px 0;font-variant-numeric:tabular-nums}

.game{margin-top:44px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.gbox{background:#0E1219;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.gbox svg{display:block;width:100%;min-width:460px;height:auto}
.gtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-family:var(--mono);font-size:14px;color:var(--mute);letter-spacing:.04em}
.gtop b{font-size:18px;margin-left:6px}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.guess button{padding:16px;border-radius:12px;cursor:pointer;border:1.5px solid var(--line2);background:var(--card2);font-size:22px;font-weight:900;min-height:64px}
.guess button:hover{border-color:var(--or)}
.guess button:disabled{opacity:.4;cursor:default}
.guess button small{display:block;font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--mute);letter-spacing:.04em}
.verdict{min-height:30px;margin-top:12px;font-size:18px;font-weight:700}
.dots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dots i{height:46px;border-radius:9px;background:#0E1219;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:15px;color:var(--dim)}
.dots i.ok{background:#12301F;border-color:#245B3D;color:var(--green);font-size:20px;font-weight:700}
.dots i.no{background:#331616;border-color:#6A2A2A;color:var(--red);font-size:20px;font-weight:700}
.res{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}
.res .big{font-size:clamp(30px,3vw,42px);font-weight:900;line-height:1.15}
.res .big em{font-style:normal;color:var(--or);display:block;font-size:.62em}
.res p{color:var(--ink2);margin:10px 0 0;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.row input{flex:1;min-width:150px;font:16px var(--sans);padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:#0E1219;color:var(--ink)}
.btn{font:700 15px var(--sans);border-radius:10px;padding:12px 18px;cursor:pointer;border:1px solid var(--line2);background:var(--card2)}
.btn:hover{border-color:var(--or)}
.btn.pri{background:var(--or);border-color:var(--or);color:#140904}
.hof{margin-top:22px}
.hof ol{margin:8px 0 0;padding-left:22px;color:var(--ink2);font-size:15.5px}
.small{font-size:14px;color:var(--mute);line-height:1.6}

.hub{margin-top:44px;border-top:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:72px minmax(0,1fr) 170px;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}
.hrow .no{font-size:clamp(34px,4vw,48px);font-weight:900;color:var(--or);line-height:1}
.hrow .tt{font-size:clamp(20px,2.3vw,28px);font-weight:900;line-height:1.25}
.hrow .dd{font-size:16.5px;color:var(--ink2);margin-top:4px}
.hrow .where{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;color:var(--mute);margin-top:6px}
.stp{justify-self:end;font-family:var(--mono);font-size:13px;letter-spacing:.1em;font-weight:600;border-radius:999px;padding:6px 14px;white-space:nowrap}
.stp.on{color:var(--green);border:1.5px solid var(--green)}
.stp.rd{color:var(--gold);border:1.5px dashed var(--gold)}
.stp.nx{color:var(--mute);border:1.5px solid var(--line2)}
.gitlog{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px;font-family:var(--mono);font-size:15px;line-height:2;overflow-x:auto}
.gitlog div{white-space:nowrap}
.gitlog .h{color:var(--gold)} .gitlog .d{color:var(--dim)}
.chans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}
.chan{display:grid;gap:6px;align-content:start;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
a.chan:hover{border-color:var(--or)}
.chan small{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--or)}
.chan b{font-size:21px;font-weight:900}
.chan span{font-size:15px;color:var(--ink2);line-height:1.5}

.term{margin-top:44px;background:#07090D;border:1px solid var(--line2);border-radius:16px;overflow:hidden}
.term .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--mute)}
.term .bar i{width:11px;height:11px;border-radius:50%;background:#2A3142}
.tout{height:300px;overflow:auto;padding:16px 20px;font-family:var(--mono);font-size:15px;line-height:1.75;color:var(--ink2)}
.tout div{white-space:pre-wrap;word-break:break-word}
.tform{display:flex;gap:10px;align-items:center;margin-top:4px}
.tform label{color:var(--or);white-space:nowrap}
.tform input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink);font:15px var(--mono);caret-color:var(--or)}
.tform:focus-within label{text-decoration:underline;text-underline-offset:4px}

footer{margin-top:96px;padding-block:36px 56px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
footer p{margin:0;color:var(--dim);font-size:14px;max-width:70ch;line-height:1.7}

.boss{position:fixed;inset:0;z-index:60;background:#0B0D12;color:#B8C0B0;font-family:var(--mono);font-size:14px;line-height:23px;cursor:pointer;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));overflow:auto}
.boss .ok{color:#8FC58F} .boss .dimb{color:#5E6670}
.boss .hint{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));color:#3E454E;font-size:11px}
.cur{display:inline-block;width:10px;height:20px;background:#8FC58F;vertical-align:-4px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

@media (max-width:980px){
  .nav{display:none}
  .cards3,.cps{grid-template-columns:minmax(0,1fr)}
  .game{grid-template-columns:minmax(0,1fr)}
  .chans{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srow,.axis{grid-template-columns:minmax(0,1fr);gap:6px}
  .axis .sp{display:none}
  .erow{grid-template-columns:minmax(0,1fr) 130px;gap:10px 16px}
  .erow .track{grid-column:1/-1;grid-row:2}

  .brand{font-size:13px;letter-spacing:.14em}

  .week{grid-template-columns:repeat(5,minmax(104px,1fr));overflow-x:auto;padding-bottom:6px}
  .rcols,.rrow{grid-template-columns:24px 64px minmax(0,1fr) 84px;gap:10px}
  .rrow .cap,.rcols span:nth-child(4){display:none}
  .rrow .bar{height:22px}
  .pill{font-size:14px}
  .hrow{grid-template-columns:44px minmax(0,1fr);gap:6px 14px}

  .dots i{height:38px}
  .card{padding:22px 20px}
  .tlab{font-size:11px;letter-spacing:.06em}

}

  $('langBtn').innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>${lang.toUpperCase()}`;
  $('langMenu').innerHTML=LANGS.map(c=>`<button role="menuitemradio" aria-checked="${c===lang}" data-lang="${c}">${L[c].name}<span>${c}</span></button>`).join('');
  $('foot').innerHTML=`<p>${esc(t.foot)}</p><a class="handle" href="${TG}" target="_blank" rel="noopener">@stayhungryasi<br>https://t.me/stayhungryasi</a>`;
}
function renderAll(){rChrome();rToday();rEarn();rResearch();rRadar();rRank();rLab();rHub();rTerm();render(curShown);spy();}
function setLang(c){if(!LANGS.includes(c))return;if(window.SHA_PATHS&&c!==lang){store.set('sha-lang',c);location.href='../'+c+'/'+location.hash;return;}lang=c;store.set('sha-lang',c);renderAll();boot();}

let io;function spy(){try{if(io)io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.s===e.target.id));});},{rootMargin:'-40% 0px -55% 0px'});SECTIONS.forEach(s=>io.observe($(s)));}catch(e){}}

function closeMenu(){$('langMenu').hidden=true;$('langBtn').setAttribute('aria-expanded','false');}
$('langBtn').addEventListener('click',()=>{const m=$('langMenu');m.hidden=!m.hidden;$('langBtn').setAttribute('aria-expanded',String(!m.hidden));if(!m.hidden){const b=m.querySelector('[aria-checked="true"]');b&&b.focus();}});
document.addEventListener('click',e=>{const lb=e.target.closest('[data-lang]');if(lb){setLang(lb.dataset.lang);closeMenu();return;}if(!e.target.closest('#langMenu')&&!e.target.closest('#langBtn'))closeMenu();});

function bossOn(){const t=T(),mods=['core/ledger','core/forecast','reports/q3-budget','reports/headcount','utils/date','utils/currency','ui/table','ui/chart'];
  let h=`<div class="dimb">$ npm run build</div><div class="dimb">&gt; quarterly-report@3.4.1 build</div><div class="dimb">&gt; tsc --noEmit &amp;&amp; vite build</div><br>`;
  mods.forEach((x,j)=>{h+=`<div>transforming src/${x}.ts <span class="dimb">(${(12+j*7)%40+8}ms)</span></div>`;});
  h+=`<br><div class="ok">✓ 214 modules transformed.</div><div>dist/assets/index-4f9c2a.js   <span class="dimb">182.40 kB │ gzip: 58.31 kB</span></div><br><div class="ok">✓ ${esc(t.b_title)} in 3.18s</div><div class="dimb">$ <span class="cur"></span></div><div class="hint">${esc(t.b_ret)}</div>`;
  $('boss').innerHTML=h;$('boss').hidden=false;window._t=document.title;document.title='quarterly-report — build';}
function bossOff(){$('boss').hidden=true;if(window._t)document.title=window._t;}
$('boss').addEventListener('click',bossOff);$('bossBtn').addEventListener('click',bossOn);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('langMenu').hidden){closeMenu();$('langBtn').focus();return;}$('boss').hidden?bossOn():bossOff();return;}
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.key==='/'){e.preventDefault();$('terminal').scrollIntoView();$('tin').focus();}
});

function tprint(h){const d=document.createElement('div');d.innerHTML=h;$('tlog').appendChild(d);$('tout').scrollTop=$('tout').scrollHeight;}
function boot(){const t=T(),nx=nextEarn(Date.now());$('tlog').innerHTML='';tprint('<span style="color:var(--or)">$</span> npm run observe');
  tprint(`<span style="color:var(--mute)">[INFO]</span>  crisisTemp=38/100 status=STABLE <span class="tagS">${esc(t.sample)}</span>`);
  if(nx)tprint(`<span style="color:var(--mute)">[EARN]</span>  ${esc(fmt(t.t_next,{t:nx.t,d:erLabel(nx,t,Date.now())}))}`);
  tprint(`<span style="color:var(--gold)">[WARN]</span>  valuation: buffettIndex=205% &gt; 140%`);}
const alias={today:'today',home:'today',earnings:'earnings',earn:'earnings',research:'research',spacex:'research',radar:'radar',crisis:'radar',rank:'rank',market:'rank',lab:'lab',game:'lab',hub:'hub',projects:'hub',terminal:'terminal'};
$('tform').addEventListener('submit',e=>{e.preventDefault();const raw=$('tin').value.trim();$('tin').value='';if(!raw)return;
  tprint(`<span style="color:var(--or)">guest@stayhungry.asi:~$</span> ${esc(raw)}`);const [cmd,...a]=raw.split(/\s+/),arg=(a[0]||'').toLowerCase(),t=T();
  switch(cmd.toLowerCase()){
    case 'help':t.t_help.forEach(l=>tprint(esc(l)));break;
    case 'ls':tprint(SECTIONS.map(s=>`<span style="color:var(--blue)">${s}/</span>`).join('   '));break;
    case 'open':case 'cd':{const id=alias[arg];if(id){$(id).scrollIntoView();tprint(esc(fmt(t.t_open,{f:id})));}else tprint(`<span style="color:var(--red)">${esc(fmt(t.t_nofile,{f:arg||'?'}))}</span>`);break;}
    case 'earnings':{const nx=nextEarn(Date.now());tprint(esc(nx?fmt(t.t_next,{t:nx.t,d:erLabel(nx,t,Date.now())}):'—'));break;}
    case 'play':$('lab').scrollIntoView();tprint(esc(fmt(t.t_open,{f:'chart.test.ts'})));break;
    case 'lang':if(LANGS.includes(arg)){tprint(esc(L[arg].t_lang));setLang(arg);}else tprint('lang en | ko | es | ja');break;
    case 'boss':bossOn();break;
    case 'clear':$('tlog').innerHTML='';break;
    case 'whoami':tprint('guest · stay hungry, observe everything');break;
    case 'sudo':tprint('<span style="color:var(--gold)">nice try.</span>');break;
    default:tprint(`<span style="color:var(--red)">${esc(fmt(t.t_unknown,{c:cmd}))}</span>`);
  }});

const NS='http://www.w3.org/2000/svg',svg=$('candles'),R=10;
let score=0,streak=0,best=0,data=[],locked=false,curShown=7,lastV=null,results=[];
function rn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function gen(){let p=40+Math.random()*460,dr=(Math.random()-.5)*.012,vol=.012+Math.random()*.02;const o=[];for(let j=0;j<10;j++){if(j===7)dr=(Math.random()-.5)*.012;const op=p,cl=op*(1+dr+rn()*vol),h=Math.max(op,cl)*(1+Math.abs(rn())*vol*.5),l=Math.min(op,cl)*(1-Math.abs(rn())*vol*.5);o.push({o:op,c:cl,h,l});p=cl;}return o;}
function el(tag,at,txt){const e=document.createElementNS(NS,tag);for(const q in at)e.setAttribute(q,at[q]);if(txt!=null)e.textContent=txt;return e;}
function render(shown){curShown=shown;if(!data.length)return;svg.innerHTML='';const col=COL(),Lp=62,Rp=18,Tp=18,B=34,w=640-Lp-Rp,h=290-Tp-B,slot=w/10;
  const vis=data.slice(0,shown);let lo=Math.min(...vis.map(d=>d.l)),hi=Math.max(...vis.map(d=>d.h));const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;const y=v=>Tp+(hi-v)/(hi-lo)*h;
  for(let j=0;j<=4;j++){const v=lo+(hi-lo)*j/4,yy=y(v);svg.appendChild(el('line',{x1:Lp,x2:640-Rp,y1:yy,y2:yy,stroke:'#1D2330'}));svg.appendChild(el('text',{x:Lp-8,y:yy+4,fill:'#8D95A8','font-size':12,'text-anchor':'end','font-family':'IBM Plex Mono,monospace'},v.toFixed(2)));}
  const base=data[6].c;if(shown>7)svg.appendChild(el('line',{x1:Lp,x2:640-Rp,y1:y(base),y2:y(base),stroke:'#F26522','stroke-dasharray':'4 4'}));
  for(let j=0;j<10;j++){const cx=Lp+slot*j+slot/2;svg.appendChild(el('text',{x:cx,y:290-10,fill:j>=7?'#F26522':'#8D95A8','font-size':12,'text-anchor':'middle','font-family':'IBM Plex Mono,monospace'},j<7?`D-${6-j}`:`D+${j-6}`));
    if(j<shown){const d=data[j],cc=d.c>=d.o?col.up:col.down;svg.appendChild(el('line',{x1:cx,x2:cx,y1:y(d.h),y2:y(d.l),stroke:cc,'stroke-width':1.8}));svg.appendChild(el('rect',{x:cx-slot*.3,y:y(Math.max(d.o,d.c)),width:slot*.6,height:Math.max(2,Math.abs(y(d.o)-y(d.c))),fill:cc,rx:2}));}
    else{svg.appendChild(el('rect',{x:cx-slot*.34,y:Tp+6,width:slot*.68,height:h-12,fill:'rgba(242,101,34,.06)',stroke:'#F26522','stroke-dasharray':'4 4',rx:7}));svg.appendChild(el('text',{x:cx,y:Tp+h/2+8,fill:'#F26522','font-size':24,'font-weight':900,'text-anchor':'middle','font-family':'Noto Sans KR,sans-serif'},'?'));}}
  if(shown===10){const d=data[9],chg=(d.c/base-1)*100,ex=Lp+slot*9.5,ey=y(d.c);svg.appendChild(el('circle',{cx:ex,cy:ey,r:5,fill:'#EEF0F5'}));svg.appendChild(el('text',{x:ex-10,y:Math.max(ey-12,16),fill:chg>=0?col.up:col.down,'font-size':17,'font-weight':900,'text-anchor':'end','font-family':'Noto Sans KR,sans-serif'},pct(chg)));}}
function hud(){const t=T();$('gSum').textContent=fmt(t.gm_sum,{p:score,f:results.length-score,n:R});$('gK').textContent=streak;$('dots').innerHTML=Array.from({length:R},(_,j)=>{const r=results[j];return `<i class="${r==null?'':r?'ok':'no'}">${r==null?j+1:r?'✓':'✗'}</i>`;}).join('');}
function newRound(){data=gen();locked=false;lastV=null;render(7);$('bUp').disabled=$('bDown').disabled=false;$('verdict').textContent='';hud();}
function showV(){const t=T(),v=lastV;$('verdict').style.color=v.ok?'var(--green)':'var(--red)';$('verdict').textContent=fmt(v.ok?t.gm_pass:t.gm_fail,{c:pct(v.chg)});}
function answer(up){if(locked||results.length>=R)return;locked=true;$('bUp').disabled=$('bDown').disabled=true;const ok=(data[9].c>data[6].c)===up,red=matchMedia('(prefers-reduced-motion: reduce)').matches;let st=7;
  const tk=()=>{st++;render(st);if(st<10)setTimeout(tk,red?0:240);else fin();};tk();
  function fin(){results.push(ok);if(ok){score++;streak++;best=Math.max(best,streak);}else streak=0;lastV={ok,chg:(data[9].c/data[6].c-1)*100};showV();hud();setTimeout(()=>{if(results.length>=R)end();else newRound();},red?900:1400);}}
const tier=s=>T().tiers[s>=8?3:s>=6?2:s>=4?1:0];
function endText(){const t=T();$('rBig').innerHTML=`${score} / ${R}<em>${esc(tier(score))}</em>`;$('rText').textContent=fmt(t.gm_end,{b:best})+' '+(score>=6?t.gm_good:t.gm_norm);}
function end(){$('bUp').disabled=$('bDown').disabled=true;$('res').hidden=false;endText();$('hofForm').hidden=score<3;$('copied').textContent='';}
function hofRender(){const list=store.get('sha-hof',[]),ol=$('hofList');ol.innerHTML='';if(!list.length){const li=document.createElement('li');li.textContent=T().hof_empty;ol.appendChild(li);return;}
  list.forEach(r=>{const li=document.createElement('li'),b=document.createElement('b');b.textContent=r.name;li.appendChild(b);li.appendChild(document.createTextNode(` · ${r.score}/${R} · ${r.date}`));ol.appendChild(li);});}
$('hofSave').addEventListener('click',()=>{const nm=$('hofName').value.trim()||'anonymous',list=store.get('sha-hof',[]);list.push({name:nm,score,date:new Date().toISOString().slice(0,10)});list.sort((a,b)=>b.score-a.score);store.set('sha-hof',list.slice(0,5));hofRender();$('hofForm').hidden=true;});
$('share').addEventListener('click',()=>{const t=T(),txt=fmt(t.share,{s:score,t:tier(score)})+'@stayhungryasi · '+TG,done=()=>{$('copied').textContent=t.copied;};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){$('copied').textContent=txt;}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb();});
$('again').addEventListener('click',()=>{results=[];score=0;streak=0;best=0;$('res').hidden=true;newRound();});
$('bUp').addEventListener('click',()=>answer(true));$('bDown').addEventListener('click',()=>answer(false));

data=gen();renderAll();boot();newRound();
setInterval(tick,1000);
setInterval(rEarn,60000);
})();
</script>
