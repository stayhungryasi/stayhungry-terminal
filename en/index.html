<style>
/* Layout: the whole site is one floating code-editor window on a dark desk. Explorer = sitemap, tabs = pages, terminal = command line, Esc = boss key. Single dark look by design. */
:root{
  --desk:#080A13; --win:#0D111D; --side:#0F1322; --bar:#0A0D17; --line:#1E2440; --sel:#1C2240;
  --ink:#EEEBF3; --mute:#A9AECB; --cmt:#858CB2; --dim:#4A5078;
  --rose:#E9B7A2; --rose-d:#C88A72; --ice:#94BDE3; --gold:#F2C66D; --lav:#C3B2F2;
  --mint:#7FD1AE; --red:#F27D86; --blue:#76A2F2;
  --f-code:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,"Noto Sans Mono CJK JP","Hiragino Sans","Malgun Gothic",monospace;
  --f-ui:"IBM Plex Sans","IBM Plex Sans KR","Hiragino Sans","Noto Sans JP","PingFang TC","Microsoft JhengHei","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-logo:"Instrument Serif","Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
a{color:var(--ice)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
code,kbd{font-family:var(--f-code);font-size:.92em;background:var(--sel);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--rose)}

.app{height:100%;min-height:640px;max-width:1440px;margin:0 auto;display:grid;grid-template-rows:42px minmax(0,1fr) 28px;
  background:var(--win);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px -30px #000}

/* title bar */
.title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line);position:relative}
.tl{display:flex;align-items:center;gap:14px;min-width:0}
.dots{display:flex;gap:7px}
.dots i{width:12px;height:12px;border-radius:50%;background:#353B5A}
.logo{font-family:var(--f-logo);font-style:italic;font-size:21px;white-space:nowrap;color:var(--ink)}
.logo b{font-weight:400;color:var(--rose)}
.tcenter{position:absolute;left:50%;transform:translateX(-50%);font-size:12.5px;color:#8A90B0;white-space:nowrap;pointer-events:none}
.tr{display:flex;align-items:center;gap:10px}
.focus{display:flex;align-items:center;gap:7px;font-family:var(--f-code);font-size:11.5px;color:var(--rose);border:1px solid #5A4440;border-radius:4px;padding:2px 8px;white-space:nowrap}
.focus i{width:7px;height:7px;border-radius:50%;background:var(--rose);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.langbtn{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--side);cursor:pointer;font-family:var(--f-code);font-size:12px}
.langbtn:hover{border-color:var(--rose-d)}
.flag{display:block;width:24px;height:16px;border-radius:2px;overflow:hidden;flex:none;box-shadow:0 0 0 1px #ffffff22}
.menu{position:absolute;right:10px;top:40px;z-index:20;min-width:210px;background:var(--side);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 18px 40px -12px #000}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left;font-size:14px}
.menu button:hover{background:var(--sel)}
.menu button[aria-checked="true"]{background:var(--sel)}
.menu button span.code{margin-left:auto;font-family:var(--f-code);font-size:11px;color:var(--cmt)}
.menu button[aria-checked="true"] span.code{color:var(--rose)}

/* body */
.main{display:grid;grid-template-columns:50px 240px minmax(0,1fr);min-height:0}
.act{background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:14px}
.act button{background:none;border:0;padding:4px;cursor:pointer;border-radius:6px;color:var(--dim)}
.act button.on{color:var(--ink)}
.act button:hover{color:var(--ink)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side h4{margin:0;padding:14px 18px 8px;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--cmt)}
.tree{padding:0 8px;overflow:auto;font-size:13px}
.tree .dir{padding:3px 8px;color:var(--mute);white-space:nowrap}
.tree button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--mute);text-align:left;white-space:nowrap}
.tree button:hover{background:#161B33;color:var(--ink)}
.tree button.on{background:var(--sel);color:var(--ink)}
.fi{font-family:var(--f-code);font-size:9.5px;font-weight:600;width:22px;text-align:center;flex:none}
.fi.ts{color:var(--ice)} .fi.md{color:var(--gold)} .fi.tst{color:var(--mint)}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;font-size:12.5px;color:var(--cmt);line-height:1.6}
.sidefoot .logo{font-size:19px;display:block}

.center{display:grid;grid-template-rows:38px minmax(0,1fr) 220px;min-height:0;min-width:0}
.tabs{display:flex;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:6px;padding:0 16px;border:0;border-top:2px solid transparent;background:none;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--cmt)}
.tabs button.on{background:var(--win);border-top-color:var(--rose);color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.editor{overflow:auto;min-width:0;position:relative}
.view{padding:14px 0 28px}
.code{font-family:var(--f-code);font-size:14px;line-height:24px;white-space:pre;min-width:max-content}
.code .l{display:block;padding-right:24px}
.code .l:hover{background:#121733}
.ln{display:inline-block;width:52px;padding-right:18px;text-align:right;color:var(--dim);user-select:none}
.c{color:var(--cmt)} .k{color:var(--rose)} .s{color:var(--ice)} .n{color:var(--gold)} .p{color:var(--lav)} .i{color:var(--ink)} .m{color:var(--mute)}
.inlay{display:inline-block;vertical-align:middle;height:8px;border-radius:2px;margin:0 10px 2px 6px;opacity:.85}
.warnsq{text-decoration:underline wavy var(--gold);text-underline-offset:4px}
.cd{font-family:var(--f-code);font-size:11px;border-radius:3px;padding:1px 7px;margin:0 8px 0 6px;border:1px solid var(--line);color:var(--ink);background:#141936}
.cd.soon{border-color:var(--rose-d);color:var(--rose)} .cd.done{color:var(--cmt)}
.etl{margin:14px 28px 0;border:1px solid var(--line);border-radius:12px;background:var(--side);padding:14px 16px 10px;max-width:980px}
.etl h5{margin:0 0 4px;font-family:var(--f-code);font-size:11px;letter-spacing:.1em;color:var(--cmt);font-weight:400;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.etl .svgw{overflow-x:auto} .etl svg{display:block;width:100%;min-width:560px;height:auto}
.chipi{font-family:var(--f-code);font-size:11px;color:#2A1A14;background:var(--rose);border-radius:3px;padding:1px 6px;margin-left:8px}
.cursor{display:inline-block;width:8px;height:18px;background:var(--rose);vertical-align:-3px;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* doc views (markdown preview) */
.doc{max-width:760px;padding:28px 40px 40px;font-size:15.5px;line-height:1.75;color:var(--mute)}
.pill{display:inline-block;font-family:var(--f-code);font-size:11px;letter-spacing:.1em;color:var(--cmt);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.doc h1{font-family:var(--f-logo);font-style:italic;font-weight:400;font-size:clamp(44px,6vw,72px);line-height:1.05;color:var(--ink);margin:22px 0 10px;text-wrap:balance}
.doc h1 b{font-weight:400;color:var(--rose)}
.doc .tag{font-family:var(--f-code);color:var(--rose);font-size:16px;margin:0 0 18px}
.doc h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:32px 0 10px;font-weight:600}
.doc h2::before{content:"## ";color:var(--dim);font-family:var(--f-code)}
.doc p{margin:0 0 12px;max-width:62ch}
.doc ul{margin:0;padding-left:20px;display:grid;gap:6px}
.flist{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.flist button{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:baseline;padding:11px 16px;border:0;background:var(--side);text-align:left;cursor:pointer;font-size:14.5px;color:var(--mute)}
.flist button:hover{background:var(--sel);color:var(--ink)}
.flist button b{font-family:var(--f-code);font-weight:400;color:var(--ice);font-size:13.5px}
.doc blockquote{margin:28px 0 0;padding:12px 16px;border-left:2px solid var(--gold);background:#141832;color:var(--mute);font-size:14px}
.check{display:grid;gap:4px;font-family:var(--f-code);font-size:14px}
.check div{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.check .box{color:var(--cmt)} .check .box.x{color:var(--mint)} .check .box.h{color:var(--gold)}
.check .txt{font-family:var(--f-ui);font-size:15px;color:var(--ink);flex:1;min-width:200px}
.st{font-family:var(--f-code);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid}
.st.on{color:var(--mint);border-color:#3D6656} .st.rd{color:var(--gold);border-color:#6E5A30} .st.nx{color:var(--cmt);border-color:var(--line)}
.git{font-family:var(--f-code);font-size:14px;line-height:1.75;padding:20px 28px 30px;max-width:880px}
.git .cm{padding-bottom:18px}
.git .h{color:var(--gold)} .git .h em{font-style:normal;color:var(--rose)}
.git .d{color:var(--cmt)}
.git .sub{color:var(--ink);padding-left:4ch;margin-top:6px}
.git .body{font-family:var(--f-ui);color:var(--mute);padding-left:4ch;font-size:14.5px;max-width:70ch}

/* test runner */
.runner{margin:8px 28px 0;border:1px solid var(--line);border-radius:12px;background:var(--side);padding:18px;max-width:860px}
.runner .desc{color:var(--mute);margin:0 0 12px;font-size:14.5px}
.rtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-family:var(--f-code);font-size:12.5px;color:var(--cmt)}
.rtop b{color:var(--ink);font-size:15px;margin-left:5px}
.cbox{background:var(--win);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.cbox svg{display:block;width:100%;min-width:440px;height:auto}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.guess button{display:grid;gap:2px;justify-items:center;padding:12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--win);font-family:var(--f-code);font-size:13px;color:var(--mute)}
.guess button b{font-family:var(--f-ui);font-size:17px;color:var(--ink)}
.guess button:hover{background:var(--sel)}
.guess button:disabled{opacity:.45;cursor:default}
.verdict{min-height:24px;margin-top:10px;font-family:var(--f-code);font-size:13.5px}
.res{margin-top:12px;border-top:1px dashed var(--line);padding-top:14px}
.res .big{font-family:var(--f-code);font-size:18px;color:var(--ink)}
.res .big em{font-style:normal;color:var(--rose)}
.res p{color:var(--mute);margin:6px 0 0;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.row input{flex:1;min-width:140px;font:14px var(--f-ui);padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--win);color:var(--ink)}
.btn{font:500 13px var(--f-ui);border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--win)}
.btn:hover{border-color:var(--rose-d)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#2A1A14}
.hof{margin-top:14px;font-size:13.5px}
.hof h5{margin:0;font-family:var(--f-code);font-size:11px;letter-spacing:.08em;color:var(--cmt);font-weight:400}
.hof ol{margin:6px 0 0;padding-left:22px;color:var(--mute)}
.small{font-size:12.5px;color:var(--cmt);margin-top:10px;line-height:1.6}

/* terminal */
.term{border-top:1px solid var(--line);background:var(--bar);display:grid;grid-template-rows:34px minmax(0,1fr);min-height:0}
.ttabs{display:flex;gap:20px;padding:0 18px;align-items:center;font-size:11.5px;letter-spacing:.08em;color:var(--cmt)}
.ttabs .on{color:var(--ink);border-bottom:1px solid var(--rose);padding-bottom:6px;margin-top:7px}
.tout{overflow:auto;padding:4px 18px 10px;font-family:var(--f-code);font-size:13px;line-height:21px;color:#C8CCE0}
.tout div{white-space:pre-wrap;word-break:break-word}
.tform{display:flex;gap:8px;align-items:center}
.tform label{color:var(--rose);white-space:nowrap}
.tform input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink);font:13px var(--f-code);caret-color:var(--rose)}
.tform input:focus-visible{outline:none}
.tform:focus-within label{text-decoration:underline;text-underline-offset:3px}

/* status bar */
.status{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:0 12px;background:var(--sel);font-family:var(--f-code);font-size:11.5px;color:#C8CCE0;overflow:hidden;white-space:nowrap}
.status div{display:flex;gap:16px;align-items:center}
.status button{background:none;border:0;padding:0 2px;cursor:pointer;font:inherit;color:inherit}
.status button:hover{color:var(--ink);text-decoration:underline}
.status .warn{color:var(--gold)}

/* boss overlay */
.boss{position:fixed;inset:0;z-index:50;background:#0B0D12;color:#B8C0B0;font-family:var(--f-code);font-size:13px;line-height:22px;cursor:pointer;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));overflow:auto}
.boss .ok{color:#8FC58F} .boss .dimb{color:#5E6670}
.boss .hint{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));color:#3E454E;font-size:11px}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .act,.side{display:none}
  .tcenter{display:none}
  .center{grid-template-rows:38px minmax(0,1fr) 180px}
  .doc{padding:22px 18px 32px}
  .runner,.etl{margin:8px 14px 0}
  .git{padding:18px 16px 26px}
  .flist button{grid-template-columns:1fr;gap:2px}
}
@media (max-width:520px){
  body{padding-block:10px}
  .app{min-height:560px;border-radius:10px}
  .focus span{display:none}
  .logo{font-size:19px}
  .dots{display:none}
  .code{font-size:12.5px;line-height:22px}
  .ln{width:38px;padding-right:12px}
  .status .opt{display:none}
}
@media (prefers-reduced-motion:reduce){.focus i,.cursor{animation:none}}
</style>

<div class="app" id="app">
  <header class="title">
    <div class="tl"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><span class="logo">✨Stayhungry<b>.ASI</b></span></div>
    <div class="tcenter" id="tcenter"></div>
    <div class="tr">
      <div class="focus" title="focus session"><i></i><span id="focusLbl"></span>&nbsp;<b id="timer" style="font-weight:400">00:00:00</b></div>
      <button class="langbtn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language"></button>
    </div>
    <div class="menu" id="langMenu" role="menu" hidden></div>
  </header>

  <div class="main">
    <nav class="act" aria-label="Views">
      <button class="on" data-open="readme" aria-label="Explorer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6"/></svg></button>
      <button data-open="market" aria-label="market.ts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/></svg></button>
      <button data-open="earn" aria-label="earnings.ts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
      <button data-open="radar" aria-label="crisis-radar.ts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 12l5-5"/></svg></button>
      <button data-open="game" aria-label="chart.test.ts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 10h14L14 9V3"/></svg></button>
      <button data-open="log" aria-label="CHANGELOG.md"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 8v8M18 11c0 4-6 3-10 6"/></svg></button>
    </nav>
    <aside class="side">
      <h4 id="explorerLbl"></h4>
      <div class="tree" id="tree"></div>
      <div class="sidefoot"><span class="logo">Stayhungry<b>.ASI</b></span><span id="sideTag"></span></div>
    </aside>
    <section class="center">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="editor" id="editor">
        <div class="view" id="v-readme"></div>
        <div class="view" id="v-market" hidden></div>
        <div class="view" id="v-earn" hidden></div>
        <div class="view" id="v-radar" hidden></div>
        <div class="view" id="v-game" hidden>
          <div id="gameHead"></div>
          <div class="runner">
            <p class="desc" id="gDesc"></p>
            <div class="rtop"><span id="gSum"></span><span>streak<b id="gK">0</b></span></div>
            <div class="cbox"><svg id="candles" viewBox="0 0 640 270" role="img" aria-label="chart"></svg></div>

/* ================= chart.test.ts game ================= */
const NS='http://www.w3.org/2000/svg', svg=$('candles'), ROUNDS=10;
let round=1,score=0,streak=0,best=0,data=[],locked=false,curShown=7,lastVerdict=null;
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function gen(){ let pr=40+Math.random()*460, dr=(Math.random()-.5)*.012, vol=.012+Math.random()*.02; const out=[];
  for(let j=0;j<10;j++){ if(j===7) dr=(Math.random()-.5)*.012; const o=pr,cl=o*(1+dr+randn()*vol),h=Math.max(o,cl)*(1+Math.abs(randn())*vol*.5),l=Math.min(o,cl)*(1-Math.abs(randn())*vol*.5); out.push({o,c:cl,h,l}); pr=cl; } return out; }
function el(tag,at,txt){const e=document.createElementNS(NS,tag);for(const q in at)e.setAttribute(q,at[q]);if(txt!=null)e.textContent=txt;return e;}
function render(shown){
  curShown=shown; if(!data.length) return; svg.innerHTML=''; const col=colors();
  const Lp=58,R=18,Tp=16,B=30,w=640-Lp-R,h=270-Tp-B,slot=w/10;
  const vis=data.slice(0,shown); let lo=Math.min(...vis.map(d=>d.l)),hi=Math.max(...vis.map(d=>d.h)); const pad=(hi-lo)*.12||1; lo-=pad; hi+=pad;
  const y=v=>Tp+(hi-v)/(hi-lo)*h;
  for(let j=0;j<=4;j++){const v=lo+(hi-lo)*j/4,yy=y(v); svg.appendChild(el('line',{x1:Lp,x2:640-R,y1:yy,y2:yy,stroke:'#1E2440'})); svg.appendChild(el('text',{x:Lp-8,y:yy+4,fill:'#858CB2','font-size':11,'text-anchor':'end','font-family':'JetBrains Mono,monospace'},v.toFixed(2)));}
  const base=data[6].c; if(shown>7) svg.appendChild(el('line',{x1:Lp,x2:640-R,y1:y(base),y2:y(base),stroke:'#E9B7A2','stroke-dasharray':'4 4',opacity:.8}));
  for(let j=0;j<10;j++){ const cx=Lp+slot*j+slot/2;
    svg.appendChild(el('text',{x:cx,y:270-10,fill:j>=7?'#E9B7A2':'#858CB2','font-size':11,'text-anchor':'middle','font-family':'JetBrains Mono,monospace'},j<7?`D-${6-j}`:`D+${j-6}`));
    if(j<shown){ const d=data[j],up=d.c>=d.o,cc=up?col.up:col.down;
      svg.appendChild(el('line',{x1:cx,x2:cx,y1:y(d.h),y2:y(d.l),stroke:cc,'stroke-width':1.4}));
      svg.appendChild(el('rect',{x:cx-slot*.28,y:y(Math.max(d.o,d.c)),width:slot*.56,height:Math.max(1.5,Math.abs(y(d.o)-y(d.c))),fill:cc,rx:1.5}));
    } else { svg.appendChild(el('rect',{x:cx-slot*.32,y:Tp+6,width:slot*.64,height:h-12,fill:'none',stroke:'#C88A72','stroke-dasharray':'3 4',rx:6,opacity:.7}));
      svg.appendChild(el('text',{x:cx,y:Tp+h/2+6,fill:'#E9B7A2','font-size':18,'text-anchor':'middle','font-family':'JetBrains Mono,monospace'},'?')); } }
  if(shown===10){ const d=data[9],chg=(d.c/base-1)*100,ex=Lp+slot*9.5,ey=y(d.c);
    svg.appendChild(el('circle',{cx:ex,cy:ey,r:4,fill:'#EEEBF3'}));
    svg.appendChild(el('text',{x:ex-10,y:Math.max(ey-10,14),fill:chg>=0?col.up:col.down,'font-size':13,'font-weight':600,'text-anchor':'end','font-family':'JetBrains Mono,monospace'},(chg>=0?'+':'')+chg.toFixed(2)+'%')); }
}
function gameHud(){ const t=T(), done=round-1+(locked?1:0); $('gSum').textContent=fmt(t.gm_sum,{p:score,f:Math.max(0,Math.min(done,ROUNDS)-score),n:ROUNDS})+`  ·  #${Math.min(round,ROUNDS)}`; $('gK').textContent=streak; }
function newRound(){ data=gen(); locked=false; lastVerdict=null; render(7); $('bUp').disabled=$('bDown').disabled=false; $('verdict').textContent=''; gameHud(); }
function showVerdict(){ const t=T(), v=lastVerdict, cs=(v.chg>0?'+':'')+v.chg.toFixed(2)+'%';
  $('verdict').style.color=v.ok?'#7FD1AE':'#F27D86'; $('verdict').textContent=fmt(v.ok?t.gm_pass:t.gm_fail,{c:cs}); }
function answer(isUp){
  if(locked||round>ROUNDS||!$('res').hidden) return; locked=true; $('bUp').disabled=$('bDown').disabled=true;
  const real=data[9].c>data[6].c, ok=real===isUp, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let st=7;
  const tick=()=>{ st++; render(st); if(st<10) setTimeout(tick,reduce?0:240); else fin(); }; tick();
  function fin(){ if(ok){score++;streak++;best=Math.max(best,streak);} else streak=0;
    lastVerdict={ok,chg:(data[9].c/data[6].c-1)*100}; showVerdict(); gameHud();
    setTimeout(()=>{ if(round>=ROUNDS) end(); else { round++; newRound(); } },reduce?900:1400); }
}
const tierOf=sc=>T().tiers[sc>=8?3:sc>=6?2:sc>=4?1:0];

  $('rText').textContent=fmt(t.gm_end,{b:best})+' '+(score>=6?t.gm_end_good:t.gm_end_norm); }
function end(){ round=ROUNDS+1; $('bUp').disabled=$('bDown').disabled=true; $('res').hidden=false; endText(); $('hofForm').hidden=score<3; $('copied').textContent=''; }
function hofRender(){ const list=store.get('sha-hof',[]),ol=$('hofList'); ol.innerHTML='';
  if(!list.length){ const li=document.createElement('li'); li.textContent=T().hof_empty; ol.appendChild(li); return; }

$('hofSave').addEventListener('click',()=>{ const nm=$('hofName').value.trim()||'anonymous'; const d=new Date(); const list=store.get('sha-hof',[]);
  list.push({name:nm,score,date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}); list.sort((a,b)=>b.score-a.score); store.set('sha-hof',list.slice(0,5)); hofRender(); $('hofForm').hidden=true; });
$('share').addEventListener('click',()=>{ const t=T(), txt=fmt(t.share,{s:score,t:tierOf(score)}); const done=()=>{$('copied').textContent=t.copied;};
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){$('copied').textContent=txt;} ta.remove(); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,fb); else fb(); });
$('again').addEventListener('click',()=>{ round=1;score=0;streak=0;best=0; $('res').hidden=true; newRound(); });
$('bUp').addEventListener('click',()=>answer(true)); $('bDown').addEventListener('click',()=>answer(false));

/* boot */
data=gen(); renderAll(); open('readme'); boot(); newRound();
})();
