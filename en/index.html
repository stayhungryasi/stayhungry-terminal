<style>
/* Layout: an 11-page card-news deck; each LOG page fills one screen and snaps. Esc flips the same data into a code-editor view with an AI pair chat, quick open (Ctrl+P), vim keys and an open data API at /data. */
:root{
  --bg:#0A0C10; --card:#12161E; --card2:#171C26; --line:#1D2330; --line2:#2A3142; --grid:rgba(255,255,255,.028);
  --ink:#EEF0F5; --ink2:#C7CCD8; --mute:#8D95A8; --dim:#5E6679;
  --or:#F26522; --or2:#FF8A4C; --orbg:#2A1509;
  --blue:#2F8FDD; --green:#2EA87A; --red:#FF4438; --gold:#F2B33D;
  --sans:"Noto Sans KR","Noto Sans JP","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,"Noto Sans KR",monospace;
  --top:64px;
  color-scheme:dark;
}
html[lang="ko"] body{word-break:keep-all;overflow-wrap:anywhere}
html[lang="ja"]{--sans:"Noto Sans JP","Noto Sans KR","Hiragino Sans",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:var(--top);scroll-snap-type:y proximity}
@media (min-width:981px) and (min-height:620px){html{scroll-snap-type:y mandatory}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.devon{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
b,strong{color:var(--ink);font-weight:700}
.wrap{max-width:1180px;margin:0 auto}
.tab{font-variant-numeric:tabular-nums}
main{overflow-x:clip}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));background:rgba(10,12,16,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{height:var(--top);display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.2em;white-space:nowrap;text-decoration:none}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--or);box-shadow:0 0 12px 2px rgba(242,101,34,.7)}
.brand span{color:var(--mute);font-weight:400}
.nav{display:flex;gap:0;min-width:0;overflow:hidden}
.nav a{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--mute);text-decoration:none;padding:8px 5px;border-radius:6px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--or)}
.tr{display:flex;gap:8px;align-items:center;position:relative}
.chipbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;white-space:nowrap}
.chipbtn:hover{border-color:var(--or)}
.chipbtn.devchip{border-color:#5A3420;color:var(--or2)}
.chipbtn kbd{font-family:var(--mono);font-size:10.5px;color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.menu{position:absolute;right:0;top:46px;min-width:190px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 20px 40px -12px #000;z-index:40}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:15px;text-align:left}
.menu button:hover,.menu button[aria-checked="true"]{background:var(--card2)}
.menu button span{font-family:var(--mono);font-size:12px;color:var(--mute)}
.menu button[aria-checked="true"] span{color:var(--or)}

/* pages */
.page{min-height:calc(100dvh - var(--top));display:flex;flex-direction:column;padding-block:30px 22px;scroll-snap-align:start;scroll-snap-stop:always;position:relative}
.page+.page{border-top:1px solid var(--line2)}
.loghead{display:flex;justify-content:space-between;align-items:center;gap:16px;font-family:var(--mono);font-size:13px;letter-spacing:.26em;color:var(--mute);padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.loghead .l{display:flex;align-items:center;gap:12px;color:var(--ink);font-weight:600;min-width:0}
.loghead .l i{width:8px;height:8px;border-radius:50%;background:var(--or);flex:none}
.loghead .n b{color:var(--or);font-weight:600}
.eb{font-family:var(--mono);font-size:clamp(13px,1.4vw,15px);letter-spacing:.24em;color:var(--or);margin:0 0 14px;text-transform:uppercase}
h2,h3{margin:0;font-weight:900;letter-spacing:-.035em;line-height:1.08;text-wrap:balance}
.h{font-size:clamp(34px,min(5.4vw,7.6vh),76px)}
.pin{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.h .o{color:var(--or);display:block}
.h .w{display:block}
.sub{margin:16px 0 0;font-size:clamp(16px,1.7vw,20px);color:var(--ink2);max-width:66ch;line-height:1.55}
.spacer{flex:1 0 32px}
.src{padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
.src p{margin:0;font-size:13px;color:var(--dim);max-width:72ch;line-height:1.6}
.handle{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--mute);text-align:right;text-decoration:none;line-height:1.7}
.handle:hover{color:var(--or)}
.hset{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.handle.hm{color:var(--ink2)}
.cts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.ct{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px}
a.ct:hover{border-color:var(--or)}
.ct small{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--or)}
.ct b{font-family:var(--mono);font-size:clamp(14px,1.3vw,16px);color:var(--ink);overflow-wrap:anywhere}
.tagS{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);border:1px solid #5C4618;border-radius:5px;padding:1px 7px;vertical-align:middle}
.next{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dim);background:none;border:0;cursor:pointer;padding:4px 10px}
.next:hover{color:var(--or)}

/* pager */
.pager{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:6px}
.pager button{width:30px;height:22px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;padding:0}
.pager button i{display:block;width:12px;height:3px;border-radius:2px;background:#39415A;transition:width .2s,background .2s}
.pager button.on i{width:26px;background:var(--or)}
.pager button:hover i{background:var(--ink2)}
.pgnum{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;font-family:var(--mono);font-size:12px;letter-spacing:.14em;background:rgba(18,22,30,.92);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;color:var(--mute)}
.pgnum b{color:var(--or)}

/* cards */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;min-width:0}
.card .k{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;color:var(--mute);display:flex;justify-content:space-between;gap:10px;align-items:center}
.card .v{font-size:clamp(38px,4.2vw,56px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:10px}
.card .m{font-size:15.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.card.hot{border-color:#4A2416;background:linear-gradient(160deg,#1C130F 0%,var(--card) 60%)}
.glow{isolation:isolate}
.glow::after{content:"";position:absolute;right:0;top:10%;width:min(620px,80%);aspect-ratio:1;background:radial-gradient(circle,rgba(242,101,34,.17) 0%,rgba(242,101,34,0) 62%);pointer-events:none;z-index:-1}

.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:24px;max-width:880px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 6px 12px;text-align:center;min-width:0}
.cd strong{display:block;font-size:clamp(40px,min(7.4vw,10vh),96px);font-weight:900;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cd div:last-child strong{color:var(--or)}
.cd small{display:block;margin-top:8px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--mute)}
.when{margin-top:14px;font-size:clamp(15px,1.7vw,19px);color:var(--ink2);line-height:1.7}

.summary{margin-top:30px;background:var(--card);border-left:4px solid var(--or);border-radius:0 14px 14px 0;padding:28px 32px}
.summary ol{margin:0;padding:0;list-style:none;display:grid;gap:18px;counter-reset:s}
.summary li{counter-increment:s;font-size:clamp(19px,2.3vw,27px);font-weight:700;line-height:1.45;display:grid;grid-template-columns:40px minmax(0,1fr)}
.summary li::before{content:counter(s) ".";color:var(--or);font-weight:900}
.summary li a{text-decoration:none;border-bottom:1px solid var(--line2)}
.summary li a:hover{border-color:var(--or)}
.lbl{font-family:var(--mono);font-size:12.5px;letter-spacing:.24em;color:var(--mute);margin:32px 0 0}
.cps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:14px}
.cps .d{font-size:clamp(22px,2.4vw,28px);font-weight:900;color:var(--or)}
.cps .x{font-size:18px;font-weight:700;margin-top:6px}
.cps .y{font-size:15px;color:var(--ink2);margin-top:2px}
.utl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.utl>div{background:var(--card);border-radius:12px;padding:14px 16px;border-top:3px solid var(--line2)}
.utl>div.on{border-top-color:var(--or)}
.utl .d{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--mute)}
.utl .x{font-size:clamp(16px,1.6vw,19px);font-weight:800;margin-top:4px}
.utl>div.on .x{color:var(--or)}
.utl .y{font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.4}
.giant .uvcta{margin:0 0 8px auto;align-self:flex-end}
#univertrix .giant .num{font-size:clamp(84px,min(14vw,18vh),180px)}
@media (min-width:981px) and (max-height:820px){#univertrix .utl .y{display:none}#univertrix .utl>div{padding:12px 14px}}
.nav a:lang(es){padding:8px 3px;letter-spacing:.04em}

.erows{margin-top:24px;border-top:1px solid var(--line)}
.erow{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr) 130px;gap:22px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.erow>div:first-child{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.erow .tk{font-size:clamp(20px,2.1vw,25px);font-weight:900;letter-spacing:-.02em;line-height:1.15}
.erow .dt{font-size:13.5px;color:var(--mute)}
.track{height:22px;border-radius:6px;background:#141925;overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--or)}
.fill.est{background:repeating-linear-gradient(135deg,var(--or) 0 2px,rgba(242,101,34,.14) 2px 11px);box-shadow:inset 0 0 0 1.5px var(--or)}
.fill.done{background:#2A3142}
.erow .t{font-size:clamp(17px,1.9vw,22px);font-weight:900;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.erow.est .t{color:var(--gold)}

.giant{display:flex;align-items:flex-end;gap:clamp(18px,3vw,40px);flex-wrap:wrap;margin-top:22px}
.giant .num{font-size:clamp(84px,min(15vw,21vh),200px);font-weight:900;line-height:.82;letter-spacing:-.05em;color:var(--or);font-variant-numeric:tabular-nums}
.giant .side{font-size:clamp(18px,2.1vw,26px);color:var(--ink2);line-height:1.4;padding-bottom:8px}
.giant .side b{display:block;font-size:clamp(22px,2.5vw,32px);color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;font-size:17px;font-weight:700;color:var(--or);text-decoration:none;border:1.5px solid var(--or);border-radius:12px;padding:12px 18px;align-self:flex-start}
.cta:hover{background:var(--orbg)}

.mix{display:grid;gap:12px;margin-top:20px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:clamp(19px,2.1vw,26px);font-weight:900;margin-bottom:8px}
.mh span:last-child{color:var(--ink2)}
.mbar{display:flex;gap:4px;height:clamp(58px,min(8.5vw,10vh),100px)}
.seg{border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden}
.seg b{color:#0A0C10;font-size:clamp(12px,1.5vw,19px);font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg strong{color:#0A0C10;font-size:clamp(19px,3vw,38px);font-weight:900;line-height:1;letter-spacing:-.02em}
.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:15.5px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:8px;vertical-align:-1px}

.score{margin-top:20px;display:grid;gap:2px}
.srow{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:center;padding:3px 0}
.srow .n{font-size:clamp(19px,2.1vw,24px);font-weight:900;line-height:1.2}
.srow .c{font-size:14px;color:var(--mute)}
.schart{position:relative;height:42px}
.schart .zero{position:absolute;top:-6px;bottom:-6px;width:2px;background:#3A4256}
.schart .bar{position:absolute;top:6px;height:30px;border-radius:5px;background:var(--ink)}
.schart .bar.miss{background:var(--red)}
.schart .val{position:absolute;top:1px;font-size:clamp(17px,2.2vw,27px);font-weight:900;white-space:nowrap;line-height:40px}
.axis{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px}
.ticks{position:relative;height:22px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.ticks span{position:absolute;transform:translateX(-50%)}
.nrow{display:flex;gap:16px;align-items:center;margin-top:14px}
.nrow .note,.nrow .cta{margin:0}
.nrow .cta{flex:none}
.note{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 24px;font-size:clamp(15px,1.7vw,19px);color:var(--ink2);line-height:1.6}

.checks{margin-top:22px;border-top:1px solid var(--line)}
.chk{display:grid;grid-template-columns:52px minmax(0,1fr) 190px;gap:20px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ico{width:38px;height:38px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#0A0C10}
.ico.ok{border-radius:50%;background:var(--green)}
.ico.fail svg{display:block;width:40px;height:36px}
.chk .n{font-size:clamp(19px,2.1vw,25px);font-weight:900;line-height:1.2}
.chk .m{font-size:15.5px;color:var(--ink2);margin-top:2px}
.chk .v{font-size:clamp(28px,3.4vw,42px);font-weight:900;text-align:right;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chk.bad .v{color:var(--red)}
.rbot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:end;margin-top:26px}
.tbar{position:relative;height:20px;border-radius:10px;background:linear-gradient(90deg,var(--green) 0 40%,var(--gold) 40% 70%,var(--red) 70% 100%);margin-top:48px}
.mk{position:absolute;top:-9px;width:6px;height:38px;margin-left:-3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 4px var(--bg)}
.mk span{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:900;white-space:nowrap}
.tlab{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:92px;min-width:0}
.wd .dn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--mute)}
.wd .dd{font-size:26px;font-weight:900;line-height:1}
.wd.today{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}
.wd.today .dn{color:var(--or)}
.ev{font-size:12.5px;font-weight:700;border-radius:6px;padding:4px 7px;background:#1B2130;line-height:1.3}
.ev.e{background:var(--orbg);color:var(--or2)}

.rcols,.rrow{display:grid;grid-template-columns:44px 110px minmax(0,1fr) 90px 120px;gap:18px;align-items:center}
.rcols{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--dim);margin-top:26px}
.rcols span:nth-child(4){text-align:right}
.rcols span:nth-child(5){text-align:center}
.rank{margin-top:10px;display:grid;gap:10px}
.rrow .r{font-family:var(--mono);font-size:15px;color:var(--mute)}
.rrow .tk{font-size:clamp(19px,2.1vw,24px);font-weight:900}
.rrow .bar{height:28px;border-radius:5px;background:var(--ink)}
.rrow:first-child .bar{background:var(--or)}
.rrow .cap{font-size:19px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

const BRAINS={"engines": {"buffett": {"name": {"en": "Buffett·Munger Engine", "ko": "버핏·멍거 엔진", "es": "Motor Buffett·Munger", "ja": "バフェット・マンガー・エンジン"}, "tag": {"en": "What to buy · how not to be stupid", "ko": "무엇을 살까 · 어떻게 틀리지 않을까", "es": "Qué comprar · cómo no equivocarse", "ja": "何を買うか・どう間違えないか"}, "report": "buffett-brain"}, "jensen": {"name": {"en": "Jensen Engine", "ko": "젠슨 엔진", "es": "Motor Jensen", "ja": "ジェンスン・エンジン"}, "tag": {"en": "Fear-driven optimism · build before the market", "ko": "공포로 움직이는 낙관 · 시장보다 먼저", "es": "Optimismo impulsado por el miedo · construir antes del mercado", "ja": "恐怖で動く楽観・市場より先に"}, "report": "jensen-brain"}}, "qa": [{"id": "b1", "e": "buffett", "q": {"en": "A stock I like fell 50%. Is it cheap now?", "ko": "좋아하던 주식이 50% 빠졌어요. 이제 싼 건가요?", "es": "Una acción que me gusta cayó 50%. ¿Ya está barata?", "ja": "好きな株が50%下がりました。もう割安ですか?"}, "a": {"en": "Buffett's lens: the price you remember is not the yardstick. The yardstick is intrinsic value, the cash the business will produce for the rest of its life. Munger called this contrast misreaction: \"down 50%\" feels cheap only because you anchored to the top. Ask instead: did the moat or the management change? Munger would invert it: what would have to be true for this to fall another 50%? Verdict: study the business, not the chart.", "ko": "버핏의 관점: 기억 속 가격은 잣대가 아닙니다. 잣대는 내재가치, 즉 이 회사가 남은 생애 동안 벌어들일 현금입니다. 멍거는 이것을 '대비 오인'이라고 불렀습니다. 고점에 기준을 박아두었기 때문에 50% 하락이 싸 보이는 것입니다. 대신 이렇게 물으세요. 해자나 경영진이 바뀌었나? 멍거식 뒤집기: 여기서 50%가 더 빠지려면 무엇이 사실이어야 하나? 결론: 차트가 아니라 사업을 공부하세요.", "es": "La lente de Buffett: el precio que recuerdas no es la vara de medir. La vara es el valor intrínseco, el efectivo que el negocio producirá durante el resto de su vida. Munger lo llamaba reacción por contraste: \"bajó 50%\" parece barato solo porque te anclaste al máximo. Pregunta mejor: ¿cambió la ventaja competitiva o la gerencia? Munger lo invertiría: ¿qué tendría que pasar para que cayera otro 50%? Veredicto: estudia el negocio, no el gráfico.", "ja": "バフェットの視点:覚えている株価は物差しではありません。物差しは本質的価値、つまりその事業が今後生み出す現金です。マンガーはこれを「対比による誤認」と呼びました。高値に基準を置いたから50%下落が安く見えるだけです。代わりに問うべきは、堀や経営陣が変わったかどうか。マンガー流の逆転:ここからさらに50%下がるには何が起きる必要があるか。結論:チャートではなく事業を研究すること。"}}, {"id": "b2", "e": "buffett", "q": {"en": "How do I tell if a company has a moat?", "ko": "회사에 해자가 있는지 어떻게 알아요?", "es": "¿Cómo sé si una empresa tiene un foso competitivo?", "ja": "会社に堀があるかどうか、どう見分けますか?"}, "a": {"en": "Start with one test Buffett ranked above all others: pricing power. Can the company raise prices without losing customers? Then name the moat: brand, low cost, switching costs, network effects, or a license. If you cannot name it in one word, it may not exist. Finally check the scars: high returns on capital for years without needing much new capital, like See's Candies. Munger's warning: every moat is under attack, so ask what erodes it.", "ko": "버핏이 가장 중요하다고 꼽은 시험 하나부터 하세요. 가격결정력입니다. 손님을 잃지 않고 값을 올릴 수 있나요? 그다음 해자에 이름을 붙이세요. 브랜드, 원가 우위, 전환비용, 네트워크 효과, 인허가 중 무엇인가요? 한 단어로 말할 수 없으면 없을 가능성이 큽니다. 마지막으로 흔적을 봅니다. 씨즈캔디처럼 새 자본을 많이 쓰지 않고도 오랫동안 높은 자본수익률을 냈나요? 멍거의 경고: 모든 해자는 공격받습니다. 무엇이 그것을 허무는지 물으세요.", "es": "Empieza por la prueba que Buffett puso por encima de todas: el poder de fijar precios. ¿Puede subir precios sin perder clientes? Luego nombra la ventaja: marca, bajo costo, costos de cambio, efectos de red o una licencia. Si no puedes nombrarla en una palabra, quizá no exista. Por último, mira las huellas: altos retornos sobre el capital durante años sin necesitar mucho capital nuevo, como See's Candies. Advertencia de Munger: todo foso está bajo ataque; pregunta qué lo erosiona.", "ja": "バフェットが最重要とした試験から始めます。価格決定力です。顧客を失わずに値上げできるか。次に堀に名前を付けます。ブランド、低コスト、乗り換えコスト、ネットワーク効果、許認可のどれか。一語で言えなければ、存在しない可能性が高い。最後に痕跡を確認します。シーズ・キャンディのように、新たな資本をあまり使わずに長年高い資本利益率を出しているか。マンガーの警告:すべての堀は攻撃を受けている。何がそれを崩すかを問うこと。"}}, {"id": "b3", "e": "buffett", "q": {"en": "Is the market about to crash?", "ko": "시장이 곧 폭락할까요?", "es": "¿Se va a desplomar el mercado?", "ja": "市場はもうすぐ暴落しますか?"}, "a": {"en": "This engine does not forecast markets, because Buffett and Munger never did. Buffett said forecasts tell you more about the forecaster than the future. What they did instead: compare price to value, keep cash when nothing is cheap, and act when others panic, \"be fearful when others are greedy.\" Munger's inversion: the sure way to get hurt in a crash is leverage, so remove it first. Verdict: no forecast, only preparation.", "ko": "이 엔진은 시장을 예측하지 않습니다. 버핏과 멍거가 그러지 않았기 때문입니다. 버핏은 예측이 미래보다 예측하는 사람에 대해 더 많이 알려준다고 했습니다. 그들이 대신 한 일은 가격과 가치를 비교하고, 살 게 없으면 현금을 쌓고, 남들이 공포에 질릴 때 움직이는 것이었습니다. \"남들이 탐욕스러울 때 두려워하라.\" 멍거식 뒤집기: 폭락에서 확실히 다치는 방법은 빚입니다. 그것부터 없애세요. 결론: 예측은 없고 준비만 있습니다.", "es": "Este motor no pronostica mercados, porque Buffett y Munger nunca lo hicieron. Buffett decía que los pronósticos dicen más del pronosticador que del futuro. Lo que hacían en cambio: comparar precio con valor, guardar efectivo cuando nada está barato y actuar cuando otros entran en pánico, \"ten miedo cuando otros son codiciosos\". La inversión de Munger: la forma segura de salir herido en un desplome es el apalancamiento, así que elimínalo primero. Veredicto: sin pronóstico, solo preparación.", "ja": "このエンジンは相場を予測しません。バフェットとマンガーがそうしなかったからです。バフェットは、予測は未来よりも予測する人について多くを語ると言いました。彼らが代わりにしたのは、価格と価値を比べ、買うものがなければ現金を積み、他人がパニックの時に動くことでした。「他人が強欲な時に恐れよ」。マンガー流の逆転:暴落で確実に傷つく方法はレバレッジ。まずそれを取り除くこと。結論:予測はなく、準備だけ。"}}, {"id": "b4", "e": "buffett", "q": {"en": "Is AI a bubble?", "ko": "AI는 거품인가요?", "es": "¿La IA es una burbuja?", "ja": "AIはバブルですか?"}, "a": {"en": "Both things can be true: a technology can change the world and still make most investors lose money. Buffett's reminder from autos and airlines: transformative industries often destroy shareholder value because competition eats the profits. So the question becomes which companies keep pricing power after everyone builds the same thing. Buffett compared AI to a genie out of the bottle, and Munger was skeptical of the hype. Inversion: what must go right for today's prices to work? If the list is long, it is in the too-hard pile.", "ko": "둘 다 사실일 수 있습니다. 세상을 바꾸는 기술이면서도 대부분의 투자자에게 손실을 안길 수 있다는 것입니다. 버핏이 자동차와 항공 산업에서 얻은 교훈: 혁신적인 산업은 경쟁이 이익을 먹어치워 주주 가치를 자주 파괴합니다. 그래서 질문은 이렇게 바뀝니다. 모두가 같은 것을 만든 뒤에도 가격결정력을 지키는 회사는 어디인가? 버핏은 AI를 병에서 나온 지니에 비유했고, 멍거는 과열에 회의적이었습니다. 뒤집기: 지금 가격이 정당하려면 무엇이 맞아떨어져야 하나? 목록이 길면 '너무 어려움' 상자입니다.", "es": "Ambas cosas pueden ser ciertas: una tecnología puede cambiar el mundo y aun así hacer perder dinero a la mayoría de los inversores. El recordatorio de Buffett con los autos y las aerolíneas: las industrias transformadoras suelen destruir valor porque la competencia se come las ganancias. Entonces la pregunta es qué empresas conservan poder de precios cuando todos construyen lo mismo. Buffett comparó la IA con un genio fuera de la botella y Munger desconfiaba del entusiasmo. Inversión: ¿qué tiene que salir bien para justificar los precios de hoy? Si la lista es larga, va al montón de \"demasiado difícil\".", "ja": "どちらも真実になり得ます。世界を変える技術でありながら、多くの投資家に損をさせることもあるのです。自動車と航空業界からのバフェットの教訓:変革的な産業は競争が利益を食い尽くし、株主価値を壊すことが多い。だから問いはこう変わります。誰もが同じものを作った後も価格決定力を保つ会社はどこか。バフェットはAIを瓶から出たジーニーに例え、マンガーは過熱に懐疑的でした。逆転:今の価格が正当化されるには何がうまくいく必要があるか。リストが長ければ「難しすぎる」箱行きです。"}}, {"id": "b5", "e": "buffett", "q": {"en": "What about Bitcoin?", "ko": "비트코인은 어때요?", "es": "¿Y Bitcoin?", "ja": "ビットコインはどうですか?"}, "a": {"en": "Through this lens the answer is consistent and blunt: both men rejected it. Their test for any asset is what it produces. A farm grows crops, a business earns cash; Bitcoin, like gold, produces nothing, so its price depends only on what the next buyer pays. Munger criticized it far more harshly than Buffett. This engine will not tell you what to do with your money, but it will tell you the lens: if you cannot value it from cash flows, it sits outside the circle of competence.", "ko": "이 관점의 답은 일관되고 직설적입니다. 두 사람 모두 거부했습니다. 그들이 모든 자산에 대는 시험은 '무엇을 생산하는가'입니다. 농장은 작물을 키우고 사업은 현금을 법니다. 비트코인은 금처럼 아무것도 생산하지 않으니, 가격은 다음 사람이 얼마를 내느냐에만 달려 있습니다. 멍거는 버핏보다 훨씬 거칠게 비판했습니다. 이 엔진은 대표님 돈으로 무엇을 하라고 말하지 않습니다. 다만 관점은 분명합니다. 현금흐름으로 가치를 매길 수 없다면 능력범위 밖입니다.", "es": "Con esta lente la respuesta es coherente y directa: ambos lo rechazaron. Su prueba para cualquier activo es qué produce. Una granja da cosechas, un negocio genera efectivo; Bitcoin, como el oro, no produce nada, así que su precio depende solo de lo que pague el siguiente comprador. Munger lo criticó con mucha más dureza que Buffett. Este motor no te dirá qué hacer con tu dinero, pero sí cuál es la lente: si no puedes valorarlo por flujos de caja, queda fuera del círculo de competencia.", "ja": "この視点の答えは一貫していて率直です。二人とも否定しました。どんな資産にも当てる試験は「何を生み出すか」。農場は作物を、事業は現金を生みます。ビットコインは金と同じく何も生み出さないので、価格は次の買い手が払う額だけで決まります。マンガーはバフェットよりはるかに厳しく批判しました。このエンジンはあなたのお金の使い道を指示しません。ただ視点は明確です。キャッシュフローで価値を測れないなら、能力の輪の外です。"}}, {"id": "b6", "e": "buffett", "q": {"en": "How many stocks should I own?", "ko": "주식을 몇 종목이나 가져가야 하나요?", "es": "¿Cuántas acciones debería tener?", "ja": "何銘柄くらい持つべきですか?"}, "a": {"en": "Buffett's answer depends on you. Diversification is protection against ignorance. If you do not have the time or skill to value businesses, he has long said a low-cost index fund is the sensible choice. If you truly understand a few businesses, concentrate in them, because good ideas are rare. Munger was even more concentrated. Inversion: the fastest way to fail is to own 40 stocks you cannot explain. Checkpoint: can you write one paragraph on why you own each one?", "ko": "버핏의 답은 대표님에게 달려 있습니다. 분산은 무지에 대한 보호입니다. 사업 가치를 매길 시간이나 실력이 없다면, 그는 오래전부터 저비용 인덱스펀드가 합리적이라고 말해왔습니다. 몇몇 사업을 정말 잘 안다면 거기에 집중하세요. 좋은 아이디어는 드물기 때문입니다. 멍거는 더 극단적으로 집중했습니다. 뒤집기: 가장 빨리 실패하는 길은 설명할 수 없는 종목 40개를 들고 있는 것입니다. 체크포인트: 각 종목을 왜 갖고 있는지 한 문단으로 쓸 수 있나요?", "es": "La respuesta de Buffett depende de ti. La diversificación es protección contra la ignorancia. Si no tienes tiempo o habilidad para valorar negocios, él lleva años diciendo que un fondo indexado de bajo costo es lo sensato. Si de verdad entiendes unos pocos negocios, concéntrate en ellos, porque las buenas ideas son escasas. Munger era aún más concentrado. Inversión: la forma más rápida de fracasar es tener 40 acciones que no puedes explicar. Control: ¿puedes escribir un párrafo de por qué tienes cada una?", "ja": "バフェットの答えはあなた次第です。分散は無知に対する保護です。事業価値を測る時間や力がなければ、低コストのインデックスファンドが賢明だと彼は長く言ってきました。いくつかの事業を本当に理解しているなら、そこに集中する。良いアイデアは稀だからです。マンガーはさらに集中していました。逆転:最も早く失敗する道は、説明できない40銘柄を持つこと。チェック:各銘柄を持つ理由を一段落で書けますか?"}}, {"id": "b7", "e": "buffett", "q": {"en": "When should I sell?", "ko": "언제 팔아야 하나요?", "es": "¿Cuándo debería vender?", "ja": "いつ売るべきですか?"}, "a": {"en": "Buffett's favorite holding period is forever, but forever has exits. This engine sees four: the moat is breaking, you can no longer trust management, you found something clearly better, or the price has become absurd. Note what is missing: \"it went down\" and \"it went up.\" His own record includes selling airlines in 2020 and trimming Apple in 2024. Munger's inversion: never sell a great business just to buy a mediocre one that looks cheaper.", "ko": "버핏이 가장 좋아하는 보유 기간은 '영원히'지만, 영원에도 출구는 있습니다. 이 엔진은 네 가지를 봅니다. 해자가 무너질 때, 경영진을 더 이상 믿을 수 없을 때, 확실히 더 나은 기회를 찾았을 때, 가격이 터무니없어졌을 때입니다. 빠진 것에 주목하세요. '떨어져서'와 '올라서'는 없습니다. 실제로 그는 2020년 항공주를 팔았고 2024년 애플을 줄였습니다. 멍거식 뒤집기: 싸 보이는 평범한 회사를 사려고 훌륭한 회사를 팔지 마세요.", "es": "El periodo de tenencia favorito de Buffett es para siempre, pero hasta \"siempre\" tiene salidas. Este motor ve cuatro: el foso se rompe, ya no puedes confiar en la gerencia, encontraste algo claramente mejor o el precio se volvió absurdo. Fíjate en lo que falta: \"bajó\" y \"subió\". Su propio historial incluye vender aerolíneas en 2020 y recortar Apple en 2024. Inversión de Munger: nunca vendas un gran negocio solo para comprar uno mediocre que parece más barato.", "ja": "バフェットのお気に入りの保有期間は「永遠」ですが、永遠にも出口があります。このエンジンは四つを見ます。堀が崩れる時、経営陣を信頼できなくなった時、明らかに良い機会を見つけた時、価格が馬鹿げた水準になった時。抜けているものに注目してください。「下がったから」「上がったから」はありません。実際に彼は2020年に航空株を売り、2024年にアップルを減らしました。マンガー流の逆転:安く見える平凡な会社を買うために、偉大な会社を売るな。"}}, {"id": "b8", "e": "buffett", "q": {"en": "What makes a successful life?", "ko": "성공한 인생이란 뭘까요?", "es": "¿Qué hace exitosa una vida?", "ja": "成功した人生とは何でしょう?"}, "a": {"en": "Buffett's measure was not money: it is whether the people you hope love you actually do. He also kept an inner scorecard, judging himself by his own standards rather than applause. Munger added: to get what you want, deserve what you want; keep expectations low; and drop envy, resentment and self-pity. Both read most of the day and chose to spend time with people better than themselves. Inversion: the sure way to a miserable life is unreliability. Be the person others can count on.", "ko": "버핏의 잣대는 돈이 아니었습니다. 사랑받고 싶은 사람들에게 실제로 사랑받고 있는가입니다. 그는 박수가 아니라 자기 기준으로 스스로를 평가하는 '내면의 점수표'를 지켰습니다. 멍거는 이렇게 덧붙였습니다. 원하는 것을 얻으려면 그것을 가질 자격을 갖추라. 기대치는 낮게. 질투·원망·자기연민은 버려라. 두 사람 모두 하루 대부분을 읽는 데 썼고, 자기보다 나은 사람과 어울렸습니다. 뒤집기: 비참한 삶으로 가는 확실한 길은 믿을 수 없는 사람이 되는 것입니다. 남들이 기댈 수 있는 사람이 되세요.", "es": "La medida de Buffett no era el dinero: es si las personas que esperas que te quieran realmente te quieren. También llevaba un marcador interno, juzgándose por sus propios estándares y no por el aplauso. Munger añadía: para obtener lo que quieres, merécelo; mantén bajas las expectativas; y deja la envidia, el resentimiento y la autocompasión. Ambos leían casi todo el día y eligieron rodearse de gente mejor que ellos. Inversión: el camino seguro a una vida miserable es no ser confiable. Sé alguien con quien los demás puedan contar.", "ja": "バフェットの物差しはお金ではありませんでした。愛されたい人に実際に愛されているかどうかです。彼は拍手ではなく自分の基準で自らを評価する「内なるスコアカード」を守りました。マンガーはこう加えました。欲しいものを得るには、それに値する人になれ。期待は低く。嫉妬・恨み・自己憐憫は捨てよ。二人とも一日の大半を読書に使い、自分より優れた人と付き合いました。逆転:惨めな人生への確実な道は、信頼できない人になること。頼られる人になりましょう。"}}, {"id": "j1", "e": "jensen", "q": {"en": "Is AI a bubble?", "ko": "AI는 거품인가요?", "es": "¿La IA es una burbuja?", "ja": "AIはバブルですか?"}, "a": {"en": "Jensen's lens lifts the question a level: this is not a gadget cycle, it is the largest infrastructure build-out in history, a five-layer cake of energy, chips, data centers, models and apps. In his frame, data centers are AI factories and the output, tokens, is revenue, so demand is measured in power and usage, not hype. Reality check: he leads the company that benefits most from that spending, so read his optimism as both analysis and position talk. Counterpoint: if the apps on top do not earn enough, the layers below get overbuilt.", "ko": "젠슨의 관점은 질문을 한 단계 끌어올립니다. 이건 기기 유행이 아니라 역사상 가장 큰 인프라 건설, 즉 에너지·칩·데이터센터·모델·앱의 5층 케이크라는 것입니다. 그의 틀에서 데이터센터는 AI 공장이고 그 산출물인 토큰이 곧 매출이라, 수요는 분위기가 아니라 전력과 사용량으로 잽니다. 현실 체크: 그는 그 투자에서 가장 큰 혜택을 보는 회사의 CEO입니다. 그의 낙관은 분석이자 동시에 포지션 토크로 읽어야 합니다. 반대 시각: 맨 위 앱들이 충분히 벌지 못하면 아래층이 과잉 투자가 됩니다.", "es": "La lente de Jensen sube la pregunta un nivel: no es un ciclo de aparatos, es la mayor construcción de infraestructura de la historia, un pastel de cinco capas: energía, chips, centros de datos, modelos y aplicaciones. En su marco, los centros de datos son fábricas de IA y su producto, los tokens, es ingreso, así que la demanda se mide en energía y uso, no en entusiasmo. Control de realidad: dirige la empresa que más se beneficia de ese gasto; lee su optimismo como análisis y como discurso interesado. Contrapunto: si las aplicaciones de arriba no ganan lo suficiente, las capas de abajo quedan sobreconstruidas.", "ja": "ジェンスンの視点は問いを一段引き上げます。これはガジェットの流行ではなく、史上最大のインフラ建設、つまりエネルギー・チップ・データセンター・モデル・アプリの5層ケーキだというのです。彼の枠組みではデータセンターはAI工場で、その産出物であるトークンが売上なので、需要は雰囲気ではなく電力と利用量で測ります。現実チェック:彼はその投資で最も恩恵を受ける会社のCEOです。楽観は分析であると同時にポジショントークとして読むべきです。反対意見:最上層のアプリが十分に稼げなければ、下の層が過剰投資になります。"}}, {"id": "j2", "e": "jensen", "q": {"en": "Will AI take my job?", "ko": "AI가 제 일자리를 빼앗을까요?", "es": "¿La IA me quitará el trabajo?", "ja": "AIに仕事を奪われますか?"}, "a": {"en": "Jensen's lens splits the question in two: the purpose of your job and the tasks you do to get there are related, not the same. AI changes tasks; the purpose stays. His line on this is well known: you are more likely to lose your job to someone who uses AI than to AI itself. He often cites radiology, where AI arrived and demand for radiologists still grew. Reality check: that is one profession, and transitions can hurt even when totals rise. Checkpoint: list your top five tasks and automate one this month.", "ko": "젠슨의 관점은 질문을 둘로 나눕니다. 직업의 목적과 그 목적을 위해 하는 작업은 연결돼 있지만 같지 않다는 것입니다. AI는 작업을 바꾸고 목적은 남깁니다. 이 주제의 유명한 한 줄은 이렇습니다. AI 자체보다 AI를 쓰는 사람에게 일자리를 잃을 가능성이 더 크다. 그는 AI가 들어온 뒤에도 영상의학과 의사 수요가 늘었다는 사례를 자주 듭니다. 현실 체크: 그건 한 직종의 사례이고, 전체가 늘어도 전환기는 아플 수 있습니다. 체크포인트: 내 핵심 작업 5개를 적고 이번 달에 하나를 자동화해 보세요.", "es": "La lente de Jensen divide la pregunta en dos: el propósito de tu trabajo y las tareas que haces para lograrlo están relacionados, pero no son lo mismo. La IA cambia las tareas; el propósito se queda. Su frase al respecto es conocida: es más probable perder tu trabajo ante alguien que usa IA que ante la IA misma. Suele citar la radiología, donde llegó la IA y aun así creció la demanda de radiólogos. Control de realidad: es una sola profesión y las transiciones duelen aunque el total suba. Acción: anota tus cinco tareas principales y automatiza una este mes.", "ja": "ジェンスンの視点は問いを二つに分けます。仕事の目的と、そのためにこなす作業はつながっているが同じではない。AIは作業を変え、目的は残ります。この話題での有名な一言はこうです。AIそのものより、AIを使う人に仕事を奪われる可能性の方が高い。彼はAI導入後も放射線科医の需要が増えた例をよく挙げます。現実チェック:それは一つの職種の例で、全体が増えても移行期は痛みを伴います。チェック:自分の主要作業を5つ書き出し、今月一つを自動化してみましょう。"}}, {"id": "j3", "e": "jensen", "q": {"en": "Why not just buy the cheaper chip?", "ko": "더 싼 칩을 사면 되지 않나요?", "es": "¿Por qué no comprar el chip más barato?", "ja": "安いチップを買えばいいのでは?"}, "a": {"en": "Jensen's lens reframes price as total cost of ownership. A chip sits inside a building with fixed power, land and cooling; what matters is how many tokens you get per watt and how fully the factory runs. That is why he argued a rival's chip could be free and still not be cheap enough. The real competition is the whole stack: systems, networking and software that developers already use. Counterpoint: custom chips from the biggest cloud companies are improving, and buyers want a second supplier.", "ko": "젠슨의 관점은 가격을 총소유비용으로 바꿔 봅니다. 칩은 전력·부지·냉각이 정해진 건물 안에 들어갑니다. 중요한 건 와트당 토큰을 얼마나 뽑느냐와 공장이 얼마나 꽉 돌아가느냐입니다. 그래서 그는 경쟁사 칩이 공짜여도 충분히 싸지 않을 수 있다고 주장했습니다. 진짜 경쟁은 칩 하나가 아니라 시스템·네트워크·개발자가 이미 쓰는 소프트웨어까지 포함한 전체 스택입니다. 반대 시각: 대형 클라우드 회사의 자체 칩이 좋아지고 있고, 고객은 두 번째 공급자를 원합니다.", "es": "La lente de Jensen convierte el precio en costo total de propiedad. Un chip vive dentro de un edificio con energía, terreno y refrigeración fijos; lo que importa es cuántos tokens obtienes por vatio y qué tan llena opera la fábrica. Por eso argumentó que el chip de un rival podría ser gratis y aun así no ser lo bastante barato. La competencia real es toda la pila: sistemas, redes y el software que los desarrolladores ya usan. Contrapunto: los chips propios de las grandes nubes mejoran y los compradores quieren un segundo proveedor.", "ja": "ジェンスンの視点は価格を総保有コストに置き換えます。チップは電力・土地・冷却が決まった建物の中に入ります。重要なのはワットあたり何トークン出せるか、工場がどれだけフル稼働するかです。だから彼は、競合のチップが無料でも十分に安くないことがあると主張しました。本当の競争はチップ単体ではなく、システム・ネットワーク・開発者が既に使うソフトウェアを含むスタック全体です。反対意見:大手クラウドの自社チップは進化しており、顧客は二社目の供給元を求めています。"}}, {"id": "j4", "e": "jensen", "q": {"en": "What comes after chatbots?", "ko": "챗봇 다음은 뭔가요?", "es": "¿Qué viene después de los chatbots?", "ja": "チャットボットの次は何ですか?"}, "a": {"en": "Jensen's lens points to markets that have close to zero revenue today, because that is where he likes to arrive early. Three recur in his talks: agents that do work rather than answer questions, physical AI such as robots and self-driving systems trained in simulation, and sovereign AI, where countries build their own intelligence infrastructure. His logic: create the market and the ecosystem becomes the moat. Reality check: these are long bets; timelines in robotics have slipped many times before.", "ko": "젠슨의 관점은 오늘 매출이 거의 0인 시장을 가리킵니다. 그는 그런 곳에 먼저 도착하는 걸 좋아하기 때문입니다. 그의 강연에 반복해서 나오는 세 가지가 있습니다. 질문에 답하는 대신 일을 해내는 에이전트, 시뮬레이션으로 훈련한 로봇과 자율주행 같은 피지컬 AI, 그리고 나라마다 자기 지능 인프라를 갖는 소버린 AI입니다. 그의 논리는 시장을 만들면 생태계가 해자가 된다는 것입니다. 현실 체크: 모두 긴 베팅이고, 로보틱스의 일정은 과거에 여러 번 밀렸습니다.", "es": "La lente de Jensen apunta a mercados que hoy tienen casi cero ingresos, porque ahí le gusta llegar primero. Tres temas se repiten en sus charlas: agentes que hacen trabajo en vez de responder preguntas, IA física como robots y sistemas autónomos entrenados en simulación, e IA soberana, donde los países construyen su propia infraestructura de inteligencia. Su lógica: crea el mercado y el ecosistema se vuelve el foso. Control de realidad: son apuestas largas; los plazos de la robótica se han retrasado muchas veces.", "ja": "ジェンスンの視点は、今日の売上がほぼゼロの市場を指します。彼はそういう場所に先に着くのが好きだからです。講演で繰り返し出る三つがあります。質問に答える代わりに仕事をこなすエージェント、シミュレーションで訓練したロボットや自動運転などのフィジカルAI、そして国ごとに自前の知能インフラを持つソブリンAIです。彼の論理は、市場を作れば生態系が堀になるというもの。現実チェック:どれも長期の賭けで、ロボティクスの時間軸は過去に何度も遅れています。"}}, {"id": "j5", "e": "jensen", "q": {"en": "How should I run my team?", "ko": "팀을 어떻게 운영해야 하나요?", "es": "¿Cómo debería dirigir mi equipo?", "ja": "チームをどう運営すべきですか?"}, "a": {"en": "Jensen's lens is radical flatness. He has described having around sixty direct reports and skipping routine one-on-ones, so information reaches many people at once and layers do not slow it down. Staff send short notes on their top five priorities, and he reasons through problems in front of the group so everyone learns from one answer. Reality check: biographers also describe public, sharp criticism, which is transparency to some and humiliation to others. Try one piece first: a weekly top-five note from everyone.", "ko": "젠슨의 관점은 극단적으로 평평한 조직입니다. 그는 직속 보고자가 60명 안팎이고 정기 1:1을 하지 않는다고 말해 왔습니다. 정보가 여러 사람에게 동시에 닿고 계층이 속도를 늦추지 않게 하려는 것입니다. 직원들은 가장 중요한 다섯 가지를 짧게 보내고, 그는 여러 사람 앞에서 문제를 풀어 보이며 한 번의 답으로 모두가 배우게 합니다. 현실 체크: 전기 작가들은 공개적이고 날카로운 질책도 묘사하는데, 누군가에겐 투명성이고 누군가에겐 모욕입니다. 하나만 먼저 해보세요. 매주 모두가 'Top 5' 메모를 보내는 것.", "es": "La lente de Jensen es la horizontalidad radical. Ha contado que tiene unos sesenta reportes directos y que evita las reuniones uno a uno de rutina, para que la información llegue a muchos a la vez y las capas no la frenen. El equipo envía notas breves con sus cinco prioridades, y él razona los problemas frente al grupo para que todos aprendan de una sola respuesta. Control de realidad: sus biógrafos también describen críticas públicas y duras, transparencia para unos y humillación para otros. Empieza por una pieza: una nota semanal de cinco prioridades de cada persona.", "ja": "ジェンスンの視点は徹底的にフラットな組織です。彼は直属の部下が60人ほどで、定例の1on1はしないと語ってきました。情報が多くの人に同時に届き、階層が速度を落とさないようにするためです。社員は最重要の5項目を短く送り、彼は皆の前で問題を解いてみせ、一つの答えから全員が学べるようにします。現実チェック:伝記作家は公開の厳しい叱責も描いており、ある人には透明性、別の人には屈辱です。まず一つだけ試しましょう。毎週全員が「トップ5」メモを送ること。"}}, {"id": "j6", "e": "jensen", "q": {"en": "How do I get over a big failure?", "ko": "큰 실패를 어떻게 이겨내나요?", "es": "¿Cómo supero un gran fracaso?", "ja": "大きな失敗をどう乗り越えますか?"}, "a": {"en": "Jensen's lens treats pain as fuel. He has said he wished students ample doses of pain and suffering, because people with very high expectations tend to have low resilience. His method for dark periods: forget yesterday, the way an athlete stops replaying the last point and plays the next one. He has also described running the company as if it were always about thirty days from going out of business. Reality check: fear is a strong motor but a costly one to run for decades. Checkpoint: write the lesson in one line, then close the file.", "ko": "젠슨의 관점은 고통을 연료로 봅니다. 그는 학생들에게 충분한 고통과 시련을 기원한다고 말한 적이 있습니다. 기대치가 너무 높은 사람은 회복력이 낮기 때문이라는 이유였습니다. 어두운 시기를 버티는 그의 방법은 '어제를 잊는 것'입니다. 운동선수가 지난 점수를 곱씹지 않고 다음 점수를 뛰는 것처럼요. 그는 회사를 늘 30일 뒤 망할 수 있는 것처럼 운영한다고도 말했습니다. 현실 체크: 공포는 강한 엔진이지만 수십 년 돌리기엔 비용이 큽니다. 체크포인트: 교훈을 한 줄로 적고, 그 파일은 닫으세요.", "es": "La lente de Jensen trata el dolor como combustible. Ha dicho que deseaba a los estudiantes buenas dosis de dolor y sufrimiento, porque la gente con expectativas muy altas suele tener poca resiliencia. Su método para las épocas oscuras: olvidar el ayer, como un atleta que deja de repasar el último punto y juega el siguiente. También ha descrito dirigir la empresa como si siempre estuviera a unos treinta días de quebrar. Control de realidad: el miedo es un motor potente pero caro de mantener durante décadas. Acción: escribe la lección en una línea y cierra el archivo.", "ja": "ジェンスンの視点は痛みを燃料と見なします。彼は学生たちに十分な痛みと苦しみを願うと語ったことがあります。期待が高すぎる人は回復力が低いからだという理由でした。暗い時期を耐える彼の方法は「昨日を忘れる」こと。アスリートが前のポイントを反芻せず次のポイントに集中するように。会社を常に30日後に潰れるかのように経営しているとも語っています。現実チェック:恐怖は強力なエンジンですが、何十年も回すにはコストが大きい。チェック:教訓を一行で書き、そのファイルは閉じましょう。"}}, {"id": "j7", "e": "jensen", "q": {"en": "What does Korea mean for AI?", "ko": "AI에서 한국은 어떤 의미인가요?", "es": "¿Qué significa Corea para la IA?", "ja": "AIにとって韓国とは?"}, "a": {"en": "Through Jensen's lens Korea is three layers at once. First, memory: much of the high-bandwidth memory that sits next to AI chips comes from Korean suppliers. Second, manufacturing: a country of factories is a natural home for robots and physical AI. Third, culture: he has credited PC gaming and Korea's PC bang and esports scene with helping build the company's early base. Reality check: supplier relationships shift with each product generation, so being a key partner today is not a guarantee tomorrow.", "ko": "젠슨의 관점에서 한국은 세 겹의 의미를 동시에 가집니다. 첫째, 메모리: AI 칩 옆에 붙는 고대역폭메모리(HBM)의 상당 부분을 한국 공급사가 만듭니다. 둘째, 제조: 공장이 많은 나라는 로봇과 피지컬 AI의 자연스러운 무대입니다. 셋째, 문화: 그는 PC 게임과 한국의 PC방·e스포츠가 회사의 초기 기반을 키웠다고 말해 왔습니다. 현실 체크: 공급사 관계는 제품 세대마다 바뀌므로, 오늘 핵심 파트너라는 것이 내일을 보장하지는 않습니다.", "es": "Con la lente de Jensen, Corea son tres capas a la vez. Primero, la memoria: buena parte de la memoria de alto ancho de banda que acompaña a los chips de IA viene de proveedores coreanos. Segundo, la manufactura: un país de fábricas es el hogar natural de robots e IA física. Tercero, la cultura: ha reconocido que los juegos de PC, los PC bang y los esports de Corea ayudaron a construir la base inicial de la empresa. Control de realidad: las relaciones con proveedores cambian en cada generación de producto; ser socio clave hoy no garantiza mañana.", "ja": "ジェンスンの視点では、韓国は三層の意味を同時に持ちます。第一にメモリ:AIチップの隣に載る広帯域メモリ(HBM)の多くを韓国企業が供給しています。第二に製造:工場の多い国はロボットとフィジカルAIの自然な舞台です。第三に文化:彼はPCゲームと韓国のPCバン・eスポーツが会社の初期基盤を育てたと語ってきました。現実チェック:サプライヤーとの関係は製品世代ごとに変わるので、今日の主要パートナーが明日も保証されるわけではありません。"}}, {"id": "j8", "e": "jensen", "q": {"en": "Should I start a company?", "ko": "창업해도 될까요?", "es": "¿Debería fundar una empresa?", "ja": "起業すべきですか?"}, "a": {"en": "Jensen's lens gives a two-part answer, and he keeps the parts separate. Part one: knowing the pain, he has said he would not start a company again, and that nobody in their right mind would. Part two: he loves what the company became and what it gave the world. His explanation for why founders start anyway is the question \"how hard can it be?\", a useful ignorance of the difficulty. Checkpoint: be honest about which pain you are signing up for, and make sure the problem is worth that much.", "ko": "젠슨의 관점은 두 부분으로 답하고, 그 둘을 섞지 않습니다. 첫째, 고통을 알기에 다시는 창업하지 않겠다고, 제정신이라면 아무도 안 할 거라고 말했습니다. 둘째, 회사가 이룬 것과 세상에 준 것은 사랑한다고 했습니다. 그래도 창업자들이 시작하는 이유를 그는 '얼마나 어렵겠어?'라는 질문, 즉 어려움을 모르는 유용한 무지로 설명합니다. 체크포인트: 어떤 고통에 서명하는지 솔직하게 보고, 그 문제가 그만한 가치가 있는지 확인하세요.", "es": "La lente de Jensen responde en dos partes y no las mezcla. Primera: conociendo el dolor, ha dicho que no volvería a fundar una empresa y que nadie en su sano juicio lo haría. Segunda: ama lo que la empresa llegó a ser y lo que dio al mundo. Su explicación de por qué los fundadores empiezan de todos modos es la pregunta \"¿qué tan difícil puede ser?\", una ignorancia útil sobre la dificultad. Acción: sé honesto sobre qué dolor estás firmando y asegúrate de que el problema lo valga.", "ja": "ジェンスンの視点は二つに分けて答え、混ぜません。一つ目、痛みを知っているから二度と起業しない、正気なら誰もしないと語りました。二つ目、会社が成し遂げたことと世界に与えたものは愛していると。それでも創業者が始める理由を、彼は「どれほど難しいというのか?」という問い、つまり困難を知らない有益な無知で説明します。チェック:どんな痛みにサインするのかを正直に見て、その問題にそれだけの価値があるか確かめましょう。"}}, {"id": "d1", "e": "duel", "q": {"en": "Is AI a bubble?", "ko": "AI는 거품인가?", "es": "¿La IA es una burbuja?", "ja": "AIはバブルか?"}, "a": {"buffett": {"en": "World-changing and money-losing can both be true. Ask who keeps pricing power after everyone builds the same thing. Verdict: too hard at today's prices, unless you can name the moat.", "ko": "세상을 바꾸면서 돈을 잃게 할 수도 있습니다. 모두가 같은 걸 만든 뒤에도 가격결정력을 지킬 회사가 누구인지 물으세요. 결론: 해자를 말할 수 없다면 지금 가격에선 '너무 어려움'.", "es": "Cambiar el mundo y perder dinero pueden ser ciertos a la vez. Pregunta quién conserva poder de precios cuando todos construyen lo mismo. Veredicto: demasiado difícil a precios de hoy, salvo que puedas nombrar el foso.", "ja": "世界を変えつつ損をさせることもあり得ます。誰もが同じものを作った後も価格決定力を保つのは誰かを問うこと。結論:堀を言えないなら、今の価格では「難しすぎる」。"}, "jensen": {"en": "Not a cycle but the largest infrastructure build-out in history; tokens are revenue. Counterpoint he must face: he sells the shovels, and the top layer still has to earn.", "ko": "유행이 아니라 역사상 가장 큰 인프라 건설이고, 토큰이 곧 매출입니다. 그가 마주해야 할 반론: 그는 삽을 파는 사람이고, 맨 위 앱층이 결국 벌어야 합니다.", "es": "No es un ciclo, sino la mayor construcción de infraestructura de la historia; los tokens son ingreso. El contrapunto que debe enfrentar: él vende las palas, y la capa de arriba aún tiene que ganar.", "ja": "流行ではなく史上最大のインフラ建設で、トークンが売上です。彼が向き合うべき反論:彼はシャベルを売る側で、最上層がいずれ稼がなければならない。"}}}, {"id": "d2", "e": "duel", "q": {"en": "Speed or patience?", "ko": "속도인가, 인내인가?", "es": "¿Velocidad o paciencia?", "ja": "スピードか、忍耐か?"}, "a": {"buffett": {"en": "Patience. Big money is made by waiting, like a punch card with only twenty investments for life. Swing only at fat pitches.", "ko": "인내입니다. 큰돈은 기다림에서 나옵니다. 평생 20번만 쓸 수 있는 펀치카드처럼 투자하고, 좋은 공에만 휘두르세요.", "es": "Paciencia. El dinero grande se gana esperando, como una tarjeta con solo veinte inversiones en la vida. Batea solo los lanzamientos fáciles.", "ja": "忍耐です。大きなお金は待つことから生まれます。生涯20回しか使えないパンチカードのように投資し、甘い球だけを振ること。"}, "jensen": {"en": "Speed. Ship every year so rivals are always a generation behind, but never launch a product that is not ready. Fast is a strategy; sloppy is not.", "ko": "속도입니다. 매년 새 세대를 내서 경쟁자가 늘 한 세대 뒤처지게 하되, 준비 안 된 제품은 절대 내지 않습니다. 빠른 건 전략이고, 엉성한 건 전략이 아닙니다.", "es": "Velocidad. Lanza cada año para que los rivales vayan siempre una generación atrás, pero nunca lances un producto que no esté listo. Rápido es estrategia; descuidado no.", "ja": "スピードです。毎年新世代を出して競合を常に一世代遅れにする。ただし準備不足の製品は決して出さない。速いのは戦略、雑なのは戦略ではない。"}}}, {"id": "d3", "e": "duel", "q": {"en": "Moat or momentum?", "ko": "해자인가, 추진력인가?", "es": "¿Foso o impulso?", "ja": "堀か、勢いか?"}, "a": {"buffett": {"en": "Moat. A durable advantage you can name in one word, proven by years of high returns. Momentum without a moat is a rented lead.", "ko": "해자입니다. 한 단어로 말할 수 있고 수년간 높은 수익률로 증명된 오래가는 우위. 해자 없는 추진력은 빌린 선두일 뿐입니다.", "es": "Foso. Una ventaja duradera que puedas nombrar en una palabra, probada con años de altos retornos. El impulso sin foso es una ventaja alquilada.", "ja": "堀です。一語で言え、長年の高い利益率で証明された持続的な優位。堀のない勢いは借り物のリードにすぎない。"}, "jensen": {"en": "Build the market before it exists and the ecosystem becomes the moat. Developers who already build on your stack are the advantage, not the chip.", "ko": "시장이 생기기 전에 만들면 생태계가 해자가 됩니다. 이미 내 스택 위에서 개발하는 개발자들이 우위지, 칩 자체가 아닙니다.", "es": "Construye el mercado antes de que exista y el ecosistema se vuelve el foso. La ventaja son los desarrolladores que ya construyen sobre tu pila, no el chip.", "ja": "市場ができる前に作れば、生態系が堀になる。優位は既に自社スタックで開発している開発者たちであって、チップそのものではない。"}}}, {"id": "d4", "e": "duel", "q": {"en": "Advice for a 25-year-old?", "ko": "25살에게 해줄 조언은?", "es": "¿Consejo para alguien de 25 años?", "ja": "25歳へのアドバイスは?"}, "a": {"buffett": {"en": "Invest in yourself first, read every day, avoid debt, and hang out with people better than you. Compounding works on knowledge and reputation too.", "ko": "먼저 자기 자신에게 투자하고, 매일 읽고, 빚을 피하고, 나보다 나은 사람과 어울리세요. 복리는 지식과 평판에도 작동합니다.", "es": "Invierte primero en ti, lee cada día, evita las deudas y rodéate de gente mejor que tú. El interés compuesto también funciona con el conocimiento y la reputación.", "ja": "まず自分に投資し、毎日読み、借金を避け、自分より優れた人と付き合うこと。複利は知識と評判にも働きます。"}, "jensen": {"en": "Expect pain and get good at it; resilience beats expectations. Learn to use AI now, because the threat is the person who uses it better than you.", "ko": "고통을 예상하고 거기에 익숙해지세요. 회복력이 기대치를 이깁니다. 지금 AI를 쓰는 법을 배우세요. 위협은 AI를 나보다 잘 쓰는 사람입니다.", "es": "Espera dolor y aprende a manejarlo; la resiliencia vence a las expectativas. Aprende a usar la IA ahora, porque la amenaza es quien la usa mejor que tú.", "ja": "痛みを予期し、それに慣れること。回復力は期待に勝ちます。今AIの使い方を学びましょう。脅威はAIを自分より上手に使う人です。"}}}]};

function span(ms){const mn=Math.max(0,Math.floor(ms/60000)),d=Math.floor(mn/1440),h=Math.floor(mn%1440/60),mi=mn%60;return d?`${d}d ${String(h).padStart(2,'0')}h`:h?`${h}h ${String(mi).padStart(2,'0')}m`:`${mi}m`;}

const etD=()=>new Intl.DateTimeFormat(T().loc,{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric'});

function rToday(){
  const t=T(),now=Date.now(),nx=nextEarn(now);
  const loc=new Intl.DateTimeFormat(t.loc,{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

     <div class="card hot"><div class="k"><span>${esc(t.k_buf)}</span><span class="tagS">${esc(t.sample)}</span></div><div class="v tab" style="color:var(--or)">205%</div><div class="m">${esc(t.m_buf)}</div></div>

function rEarn(){
  const t=T(),now=Date.now(),horizon=60*86400000;
  const rows=ER.map(e=>{const s=erState(e,now),w=s.k==='in'?Math.max(4,100-s.ms/horizon*100):100,cls=s.k==='done'?'done':e.st==='e'?'est':'';
    return `<div class="erow ${e.st==='e'?'est':''}"><div><div class="tk">${e.t}${e.st==='e'?' <span style="color:var(--gold);font-size:.7em">⚠</span>':''}</div><div class="dt">${esc(etD().format(new Date(e.utc)))} · ${e.st==='e'?'~':''}${esc(etT().format(new Date(e.utc)))} ET · ${esc(e.st==='e'?t.est:t.conf)}</div></div>

function weekHTML(){
  const t=T(),now=new Date(),mon=new Date(now);mon.setHours(0,0,0,0);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const dn=new Intl.DateTimeFormat(t.loc,{weekday:'short'});let wk='';
  for(let x=0;x<5;x++){const d=new Date(mon);d.setDate(mon.getDate()+x);const wd=d.getDay(),isT=d.toDateString()===now.toDateString(),ev=[];

const NS='http://www.w3.org/2000/svg',svg=$('candles'),R=10;
let score=0,streak=0,best=0,data=[],locked=false,curShown=7,lastV=null,results=[];
function rn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function gen(){let p=40+Math.random()*460,dr=(Math.random()-.5)*.012,vol=.012+Math.random()*.02;const o=[];for(let j=0;j<10;j++){if(j===7)dr=(Math.random()-.5)*.012;const op=p,cl=op*(1+dr+rn()*vol),h=Math.max(op,cl)*(1+Math.abs(rn())*vol*.5),l=Math.min(op,cl)*(1-Math.abs(rn())*vol*.5);o.push({o:op,c:cl,h,l});p=cl;}return o;}
function el(tag,at,txt){const e=document.createElementNS(NS,tag);for(const q in at)e.setAttribute(q,at[q]);if(txt!=null)e.textContent=txt;return e;}
function render(shown){curShown=shown;if(!data.length)return;svg.innerHTML='';const col=COL(),Lp=62,Rp=18,Tp=16,B=32,w=640-Lp-Rp,h=270-Tp-B,slot=w/10;
  const vis=data.slice(0,shown);let lo=Math.min(...vis.map(d=>d.l)),hi=Math.max(...vis.map(d=>d.h));const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;const y=v=>Tp+(hi-v)/(hi-lo)*h;
  for(let j=0;j<=4;j++){const v=lo+(hi-lo)*j/4,yy=y(v);svg.appendChild(el('line',{x1:Lp,x2:640-Rp,y1:yy,y2:yy,stroke:'#1D2330'}));svg.appendChild(el('text',{x:Lp-8,y:yy+4,fill:'#8D95A8','font-size':12,'text-anchor':'end','font-family':'IBM Plex Mono,monospace'},v.toFixed(2)));}
  const base=data[6].c;if(shown>7)svg.appendChild(el('line',{x1:Lp,x2:640-Rp,y1:y(base),y2:y(base),stroke:'#F26522','stroke-dasharray':'4 4'}));
  for(let j=0;j<10;j++){const cx=Lp+slot*j+slot/2;svg.appendChild(el('text',{x:cx,y:270-10,fill:j>=7?'#F26522':'#8D95A8','font-size':12,'text-anchor':'middle','font-family':'IBM Plex Mono,monospace'},j<7?`D-${6-j}`:`D+${j-6}`));
    if(j<shown){const d=data[j],cc=d.c>=d.o?col.up:col.down;svg.appendChild(el('line',{x1:cx,x2:cx,y1:y(d.h),y2:y(d.l),stroke:cc,'stroke-width':1.8}));svg.appendChild(el('rect',{x:cx-slot*.3,y:y(Math.max(d.o,d.c)),width:slot*.6,height:Math.max(2,Math.abs(y(d.o)-y(d.c))),fill:cc,rx:2}));}
    else{svg.appendChild(el('rect',{x:cx-slot*.34,y:Tp+6,width:slot*.68,height:h-12,fill:'rgba(242,101,34,.06)',stroke:'#F26522','stroke-dasharray':'4 4',rx:7}));svg.appendChild(el('text',{x:cx,y:Tp+h/2+8,fill:'#F26522','font-size':24,'font-weight':900,'text-anchor':'middle','font-family':'Noto Sans KR,sans-serif'},'?'));}}
  if(shown===10){const d=data[9],chg=(d.c/base-1)*100,ex=Lp+slot*9.5,ey=y(d.c);svg.appendChild(el('circle',{cx:ex,cy:ey,r:5,fill:'#EEF0F5'}));svg.appendChild(el('text',{x:ex-10,y:Math.max(ey-12,16),fill:chg>=0?col.up:col.down,'font-size':17,'font-weight':900,'text-anchor':'end','font-family':'Noto Sans KR,sans-serif'},pct(chg)));}}
function hud(){const t=T();$('gSum').textContent=fmt(t.gm_sum,{p:score,f:results.length-score,n:R});$('gK').textContent=streak;$('dots').innerHTML=Array.from({length:R},(_,j)=>{const r=results[j];return `<i class="${r==null?'':r?'ok':'no'}">${r==null?j+1:r?'✓':'✗'}</i>`;}).join('');}
function newRound(){data=gen();locked=false;lastV=null;render(7);$('bUp').disabled=$('bDown').disabled=false;$('verdict').textContent='';hud();}
function showV(){const t=T(),v=lastV;$('verdict').style.color=v.ok?'var(--green)':'var(--red)';$('verdict').textContent=fmt(v.ok?t.gm_pass:t.gm_fail,{c:pct(v.chg)});}
function answer(up){if(locked||results.length>=R)return;locked=true;$('bUp').disabled=$('bDown').disabled=true;const ok=(data[9].c>data[6].c)===up,red=matchMedia('(prefers-reduced-motion: reduce)').matches;let st=7;
  const tk=()=>{st++;render(st);if(st<10)setTimeout(tk,red?0:240);else fin();};tk();
  function fin(){results.push(ok);if(ok){score++;streak++;best=Math.max(best,streak);}else streak=0;lastV={ok,chg:(data[9].c/data[6].c-1)*100};showV();hud();setTimeout(()=>{if(results.length>=R)end();else newRound();},red?900:1400);}}
const tier=s=>T().tiers[s>=8?3:s>=6?2:s>=4?1:0];
function endText(){const t=T();$('rBig').innerHTML=`${score} / ${R}<em>${esc(tier(score))}</em>`;$('rText').textContent=fmt(t.gm_end,{b:best})+' '+(score>=6?t.gm_good:t.gm_norm);}
function end(){$('bUp').disabled=$('bDown').disabled=true;$('res').hidden=false;endText();$('hofForm').hidden=score<3;$('copied').textContent='';}
function hofRender(){const list=store.get('sha-hof',[]),ol=$('hofList');ol.innerHTML='';if(!list.length){const li=document.createElement('li');li.textContent=T().hof_empty;ol.appendChild(li);return;}
  list.forEach(r=>{const li=document.createElement('li'),b=document.createElement('b');b.textContent=r.name;li.appendChild(b);li.appendChild(document.createTextNode(` · ${r.score}/${R} · ${r.date}`));ol.appendChild(li);});}
$('hofSave').addEventListener('click',()=>{const nm=$('hofName').value.trim()||'anonymous',list=store.get('sha-hof',[]);list.push({name:nm,score,date:new Date().toISOString().slice(0,10)});list.sort((a,b)=>b.score-a.score);store.set('sha-hof',list.slice(0,5));hofRender();$('hofForm').hidden=true;});
$('share').addEventListener('click',()=>{const t=T(),txt=fmt(t.share,{s:score,t:tier(score)})+'@stayhungryasi · '+TG,done=()=>{$('copied').textContent=t.copied;};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){$('copied').textContent=txt;}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb();});
$('again').addEventListener('click',()=>{results=[];score=0;streak=0;best=0;$('res').hidden=true;newRound();});
$('bUp').addEventListener('click',()=>answer(true));$('bDown').addEventListener('click',()=>answer(false));

data=gen();renderAll();boot();newRound();
if(location.hash==='#dev'||store.get('sha-mode','reader')==='dev')setDev(true,true);
setInterval(tick,1000);
setInterval(()=>{rEarn();wrapPins();fit();if(devOn()){rCode();tick();vtyPaint();}},60000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
