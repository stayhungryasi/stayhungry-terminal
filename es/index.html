@media (max-width:620px){.crg .tlab em{display:none}.crcols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.crimgs{grid-template-columns:repeat(2,minmax(0,1fr))}.crl{grid-template-columns:minmax(0,1fr) 90px 40px}}

.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}

.rcols,.rrow{display:grid;grid-template-columns:44px 110px minmax(0,1fr) 90px 120px;gap:18px;align-items:center}

.dots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dots i{height:42px;border-radius:9px;background:#0E1219;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:15px;color:var(--dim)}
.dots i.ok{background:#12301F;border-color:#245B3D;color:var(--green);font-size:20px;font-weight:700}
.dots i.no{background:#331616;border-color:#6A2A2A;color:var(--red);font-size:20px;font-weight:700}
.res{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.res .big{font-size:clamp(28px,3vw,40px);font-weight:900;line-height:1.15}
.res .big em{font-style:normal;color:var(--or);display:block;font-size:.62em}
.res p{color:var(--ink2);margin:8px 0 0;font-size:15.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}

.small{font-size:15px;color:var(--mute);line-height:1.6}

.stp.on{color:var(--green);border:1.5px solid var(--green)}
.stp.rd{color:var(--gold);border:1.5px dashed var(--gold)}
.stp.nx{color:var(--mute);border:1.5px solid var(--line2)}
.chans{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

const BRAINS={"engines": {"buffett": {"name": {"en": "Buffett·Munger Engine", "ko": "버핏·멍거 엔진", "es": "Motor Buffett·Munger", "ja": "バフェット・マンガー・エンジン"}, "tag": {"en": "What to buy · how not to be stupid", "ko": "무엇을 살까 · 어떻게 틀리지 않을까", "es": "Qué comprar · cómo no equivocarse", "ja": "何を買うか・どう間違えないか"}, "report": "buffett-brain"}, "jensen": {"name": {"en": "Jensen Engine", "ko": "젠슨 엔진", "es": "Motor Jensen", "ja": "ジェンスン・エンジン"}, "tag": {"en": "Fear-driven optimism · build before the market", "ko": "공포로 움직이는 낙관 · 시장보다 먼저", "es": "Optimismo impulsado por el miedo · construir antes del mercado", "ja": "恐怖で動く楽観・市場より先に"}, "report": "jensen-brain"}, "musk": {"name": {"en": "Musk Engine", "ko": "머스크 엔진", "es": "Motor Musk", "ja": "マスク・エンジン"}, "tag": {"en": "First principles · delete, then 10x", "ko": "제1원칙 · 지우고, 10배로", "es": "Primeros principios · borrar y luego 10x", "ja": "第一原理・削って、10倍に"}, "report": "musk-brain"}}, "qa": [{"id": "b1", "e": "buffett", "q": {"en": "A stock I like fell 50%. Is it cheap now?", "ko": "좋아하던 주식이 50% 빠졌어요. 이제 싼 건가요?", "es": "Una acción que me gusta cayó 50%. ¿Ya está barata?", "ja": "好きな株が50%下がりました。もう割安ですか?"}, "a": {"en": "Buffett's lens: the price you remember is not the yardstick. The yardstick is intrinsic value, the cash the business will produce for the rest of its life. Munger called this contrast misreaction: \"down 50%\" feels cheap only because you anchored to the top. Ask instead: did the moat or the management change? Munger would invert it: what would have to be true for this to fall another 50%? Verdict: study the business, not the chart.", "ko": "버핏의 관점: 기억 속 가격은 잣대가 아닙니다. 잣대는 내재가치, 즉 이 회사가 남은 생애 동안 벌어들일 현금입니다. 멍거는 이것을 '대비 오인'이라고 불렀습니다. 고점에 기준을 박아두었기 때문에 50% 하락이 싸 보이는 것입니다. 대신 이렇게 물으세요. 해자나 경영진이 바뀌었나? 멍거식 뒤집기: 여기서 50%가 더 빠지려면 무엇이 사실이어야 하나? 결론: 차트가 아니라 사업을 공부하세요.", "es": "La lente de Buffett: el precio que recuerdas no es la vara de medir. La vara es el valor intrínseco, el efectivo que el negocio producirá durante el resto de su vida. Munger lo llamaba reacción por contraste: \"bajó 50%\" parece barato solo porque te anclaste al máximo. Pregunta mejor: ¿cambió la ventaja competitiva o la gerencia? Munger lo invertiría: ¿qué tendría que pasar para que cayera otro 50%? Veredicto: estudia el negocio, no el gráfico.", "ja": "バフェットの視点:覚えている株価は物差しではありません。物差しは本質的価値、つまりその事業が今後生み出す現金です。マンガーはこれを「対比による誤認」と呼びました。高値に基準を置いたから50%下落が安く見えるだけです。代わりに問うべきは、堀や経営陣が変わったかどうか。マンガー流の逆転:ここからさらに50%下がるには何が起きる必要があるか。結論:チャートではなく事業を研究すること。"}}, {"id": "b2", "e": "buffett", "q": {"en": "How do I tell if a company has a moat?", "ko": "회사에 해자가 있는지 어떻게 알아요?", "es": "¿Cómo sé si una empresa tiene un foso competitivo?", "ja": "会社に堀があるかどうか、どう見分けますか?"}, "a": {"en": "Start with one test Buffett ranked above all others: pricing power. Can the company raise prices without losing customers? Then name the moat: brand, low cost, switching costs, network effects, or a license. If you cannot name it in one word, it may not exist. Finally check the scars: high returns on capital for years without needing much new capital, like See's Candies. Munger's warning: every moat is under attack, so ask what erodes it.", "ko": "버핏이 가장 중요하다고 꼽은 시험 하나부터 하세요. 가격결정력입니다. 손님을 잃지 않고 값을 올릴 수 있나요? 그다음 해자에 이름을 붙이세요. 브랜드, 원가 우위, 전환비용, 네트워크 효과, 인허가 중 무엇인가요? 한 단어로 말할 수 없으면 없을 가능성이 큽니다. 마지막으로 흔적을 봅니다. 씨즈캔디처럼 새 자본을 많이 쓰지 않고도 오랫동안 높은 자본수익률을 냈나요? 멍거의 경고: 모든 해자는 공격받습니다. 무엇이 그것을 허무는지 물으세요.", "es": "Empieza por la prueba que Buffett puso por encima de todas: el poder de fijar precios. ¿Puede subir precios sin perder clientes? Luego nombra la ventaja: marca, bajo costo, costos de cambio, efectos de red o una licencia. Si no puedes nombrarla en una palabra, quizá no exista. Por último, mira las huellas: altos retornos sobre el capital durante años sin necesitar mucho capital nuevo, como See's Candies. Advertencia de Munger: todo foso está bajo ataque; pregunta qué lo erosiona.", "ja": "バフェットが最重要とした試験から始めます。価格決定力です。顧客を失わずに値上げできるか。次に堀に名前を付けます。ブランド、低コスト、乗り換えコスト、ネットワーク効果、許認可のどれか。一語で言えなければ、存在しない可能性が高い。最後に痕跡を確認します。シーズ・キャンディのように、新たな資本をあまり使わずに長年高い資本利益率を出しているか。マンガーの警告:すべての堀は攻撃を受けている。何がそれを崩すかを問うこと。"}}, {"id": "b3", "e": "buffett", "q": {"en": "Is the market about to crash?", "ko": "시장이 곧 폭락할까요?", "es": "¿Se va a desplomar el mercado?", "ja": "市場はもうすぐ暴落しますか?"}, "a": {"en": "This engine does not forecast markets, because Buffett and Munger never did. Buffett said forecasts tell you more about the forecaster than the future. What they did instead: compare price to value, keep cash when nothing is cheap, and act when others panic, \"be fearful when others are greedy.\" Munger's inversion: the sure way to get hurt in a crash is leverage, so remove it first. Verdict: no forecast, only preparation.", "ko": "이 엔진은 시장을 예측하지 않습니다. 버핏과 멍거가 그러지 않았기 때문입니다. 버핏은 예측이 미래보다 예측하는 사람에 대해 더 많이 알려준다고 했습니다. 그들이 대신 한 일은 가격과 가치를 비교하고, 살 게 없으면 현금을 쌓고, 남들이 공포에 질릴 때 움직이는 것이었습니다. \"남들이 탐욕스러울 때 두려워하라.\" 멍거식 뒤집기: 폭락에서 확실히 다치는 방법은 빚입니다. 그것부터 없애세요. 결론: 예측은 없고 준비만 있습니다.", "es": "Este motor no pronostica mercados, porque Buffett y Munger nunca lo hicieron. Buffett decía que los pronósticos dicen más del pronosticador que del futuro. Lo que hacían en cambio: comparar precio con valor, guardar efectivo cuando nada está barato y actuar cuando otros entran en pánico, \"ten miedo cuando otros son codiciosos\". La inversión de Munger: la forma segura de salir herido en un desplome es el apalancamiento, así que elimínalo primero. Veredicto: sin pronóstico, solo preparación.", "ja": "このエンジンは相場を予測しません。バフェットとマンガーがそうしなかったからです。バフェットは、予測は未来よりも予測する人について多くを語ると言いました。彼らが代わりにしたのは、価格と価値を比べ、買うものがなければ現金を積み、他人がパニックの時に動くことでした。「他人が強欲な時に恐れよ」。マンガー流の逆転:暴落で確実に傷つく方法はレバレッジ。まずそれを取り除くこと。結論:予測はなく、準備だけ。"}}, {"id": "b4", "e": "buffett", "q": {"en": "Is AI a bubble?", "ko": "AI는 거품인가요?", "es": "¿La IA es una burbuja?", "ja": "AIはバブルですか?"}, "a": {"en": "Both things can be true: a technology can change the world and still make most investors lose money. Buffett's reminder from autos and airlines: transformative industries often destroy shareholder value because competition eats the profits. So the question becomes which companies keep pricing power after everyone builds the same thing. Buffett compared AI to a genie out of the bottle, and Munger was skeptical of the hype. Inversion: what must go right for today's prices to work? If the list is long, it is in the too-hard pile.", "ko": "둘 다 사실일 수 있습니다. 세상을 바꾸는 기술이면서도 대부분의 투자자에게 손실을 안길 수 있다는 것입니다. 버핏이 자동차와 항공 산업에서 얻은 교훈: 혁신적인 산업은 경쟁이 이익을 먹어치워 주주 가치를 자주 파괴합니다. 그래서 질문은 이렇게 바뀝니다. 모두가 같은 것을 만든 뒤에도 가격결정력을 지키는 회사는 어디인가? 버핏은 AI를 병에서 나온 지니에 비유했고, 멍거는 과열에 회의적이었습니다. 뒤집기: 지금 가격이 정당하려면 무엇이 맞아떨어져야 하나? 목록이 길면 '너무 어려움' 상자입니다.", "es": "Ambas cosas pueden ser ciertas: una tecnología puede cambiar el mundo y aun así hacer perder dinero a la mayoría de los inversores. El recordatorio de Buffett con los autos y las aerolíneas: las industrias transformadoras suelen destruir valor porque la competencia se come las ganancias. Entonces la pregunta es qué empresas conservan poder de precios cuando todos construyen lo mismo. Buffett comparó la IA con un genio fuera de la botella y Munger desconfiaba del entusiasmo. Inversión: ¿qué tiene que salir bien para justificar los precios de hoy? Si la lista es larga, va al montón de \"demasiado difícil\".", "ja": "どちらも真実になり得ます。世界を変える技術でありながら、多くの投資家に損をさせることもあるのです。自動車と航空業界からのバフェットの教訓:変革的な産業は競争が利益を食い尽くし、株主価値を壊すことが多い。だから問いはこう変わります。誰もが同じものを作った後も価格決定力を保つ会社はどこか。バフェットはAIを瓶から出たジーニーに例え、マンガーは過熱に懐疑的でした。逆転:今の価格が正当化されるには何がうまくいく必要があるか。リストが長ければ「難しすぎる」箱行きです。"}}, {"id": "b5", "e": "buffett", "q": {"en": "What about Bitcoin?", "ko": "비트코인은 어때요?", "es": "¿Y Bitcoin?", "ja": "ビットコインはどうですか?"}, "a": {"en": "Through this lens the answer is consistent and blunt: both men rejected it. Their test for any asset is what it produces. A farm grows crops, a business earns cash; Bitcoin, like gold, produces nothing, so its price depends only on what the next buyer pays. Munger criticized it far more harshly than Buffett. This engine will not tell you what to do with your money, but it will tell you the lens: if you cannot value it from cash flows, it sits outside the circle of competence.", "ko": "이 관점의 답은 일관되고 직설적입니다. 두 사람 모두 거부했습니다. 그들이 모든 자산에 대는 시험은 '무엇을 생산하는가'입니다. 농장은 작물을 키우고 사업은 현금을 법니다. 비트코인은 금처럼 아무것도 생산하지 않으니, 가격은 다음 사람이 얼마를 내느냐에만 달려 있습니다. 멍거는 버핏보다 훨씬 거칠게 비판했습니다. 이 엔진은 대표님 돈으로 무엇을 하라고 말하지 않습니다. 다만 관점은 분명합니다. 현금흐름으로 가치를 매길 수 없다면 능력범위 밖입니다.", "es": "Con esta lente la respuesta es coherente y directa: ambos lo rechazaron. Su prueba para cualquier activo es qué produce. Una granja da cosechas, un negocio genera efectivo; Bitcoin, como el oro, no produce nada, así que su precio depende solo de lo que pague el siguiente comprador. Munger lo criticó con mucha más dureza que Buffett. Este motor no te dirá qué hacer con tu dinero, pero sí cuál es la lente: si no puedes valorarlo por flujos de caja, queda fuera del círculo de competencia.", "ja": "この視点の答えは一貫していて率直です。二人とも否定しました。どんな資産にも当てる試験は「何を生み出すか」。農場は作物を、事業は現金を生みます。ビットコインは金と同じく何も生み出さないので、価格は次の買い手が払う額だけで決まります。マンガーはバフェットよりはるかに厳しく批判しました。このエンジンはあなたのお金の使い道を指示しません。ただ視点は明確です。キャッシュフローで価値を測れないなら、能力の輪の外です。"}}, {"id": "b6", "e": "buffett", "q": {"en": "How many stocks should I own?", "ko": "주식을 몇 종목이나 가져가야 하나요?", "es": "¿Cuántas acciones debería tener?", "ja": "何銘柄くらい持つべきですか?"}, "a": {"en": "Buffett's answer depends on you. Diversification is protection against ignorance. If you do not have the time or skill to value businesses, he has long said a low-cost index fund is the sensible choice. If you truly understand a few businesses, concentrate in them, because good ideas are rare. Munger was even more concentrated. Inversion: the fastest way to fail is to own 40 stocks you cannot explain. Checkpoint: can you write one paragraph on why you own each one?", "ko": "버핏의 답은 대표님에게 달려 있습니다. 분산은 무지에 대한 보호입니다. 사업 가치를 매길 시간이나 실력이 없다면, 그는 오래전부터 저비용 인덱스펀드가 합리적이라고 말해왔습니다. 몇몇 사업을 정말 잘 안다면 거기에 집중하세요. 좋은 아이디어는 드물기 때문입니다. 멍거는 더 극단적으로 집중했습니다. 뒤집기: 가장 빨리 실패하는 길은 설명할 수 없는 종목 40개를 들고 있는 것입니다. 체크포인트: 각 종목을 왜 갖고 있는지 한 문단으로 쓸 수 있나요?", "es": "La respuesta de Buffett depende de ti. La diversificación es protección contra la ignorancia. Si no tienes tiempo o habilidad para valorar negocios, él lleva años diciendo que un fondo indexado de bajo costo es lo sensato. Si de verdad entiendes unos pocos negocios, concéntrate en ellos, porque las buenas ideas son escasas. Munger era aún más concentrado. Inversión: la forma más rápida de fracasar es tener 40 acciones que no puedes explicar. Control: ¿puedes escribir un párrafo de por qué tienes cada una?", "ja": "バフェットの答えはあなた次第です。分散は無知に対する保護です。事業価値を測る時間や力がなければ、低コストのインデックスファンドが賢明だと彼は長く言ってきました。いくつかの事業を本当に理解しているなら、そこに集中する。良いアイデアは稀だからです。マンガーはさらに集中していました。逆転:最も早く失敗する道は、説明できない40銘柄を持つこと。チェック:各銘柄を持つ理由を一段落で書けますか?"}}, {"id": "b7", "e": "buffett", "q": {"en": "When should I sell?", "ko": "언제 팔아야 하나요?", "es": "¿Cuándo debería vender?", "ja": "いつ売るべきですか?"}, "a": {"en": "Buffett's favorite holding period is forever, but forever has exits. This engine sees four: the moat is breaking, you can no longer trust management, you found something clearly better, or the price has become absurd. Note what is missing: \"it went down\" and \"it went up.\" His own record includes selling airlines in 2020 and trimming Apple in 2024. Munger's inversion: never sell a great business just to buy a mediocre one that looks cheaper.", "ko": "버핏이 가장 좋아하는 보유 기간은 '영원히'지만, 영원에도 출구는 있습니다. 이 엔진은 네 가지를 봅니다. 해자가 무너질 때, 경영진을 더 이상 믿을 수 없을 때, 확실히 더 나은 기회를 찾았을 때, 가격이 터무니없어졌을 때입니다. 빠진 것에 주목하세요. '떨어져서'와 '올라서'는 없습니다. 실제로 그는 2020년 항공주를 팔았고 2024년 애플을 줄였습니다. 멍거식 뒤집기: 싸 보이는 평범한 회사를 사려고 훌륭한 회사를 팔지 마세요.", "es": "El periodo de tenencia favorito de Buffett es para siempre, pero hasta \"siempre\" tiene salidas. Este motor ve cuatro: el foso se rompe, ya no puedes confiar en la gerencia, encontraste algo claramente mejor o el precio se volvió absurdo. Fíjate en lo que falta: \"bajó\" y \"subió\". Su propio historial incluye vender aerolíneas en 2020 y recortar Apple en 2024. Inversión de Munger: nunca vendas un gran negocio solo para comprar uno mediocre que parece más barato.", "ja": "バフェットのお気に入りの保有期間は「永遠」ですが、永遠にも出口があります。このエンジンは四つを見ます。堀が崩れる時、経営陣を信頼できなくなった時、明らかに良い機会を見つけた時、価格が馬鹿げた水準になった時。抜けているものに注目してください。「下がったから」「上がったから」はありません。実際に彼は2020年に航空株を売り、2024年にアップルを減らしました。マンガー流の逆転:安く見える平凡な会社を買うために、偉大な会社を売るな。"}}, {"id": "b8", "e": "buffett", "q": {"en": "What makes a successful life?", "ko": "성공한 인생이란 뭘까요?", "es": "¿Qué hace exitosa una vida?", "ja": "成功した人生とは何でしょう?"}, "a": {"en": "Buffett's measure was not money: it is whether the people you hope love you actually do. He also kept an inner scorecard, judging himself by his own standards rather than applause. Munger added: to get what you want, deserve what you want; keep expectations low; and drop envy, resentment and self-pity. Both read most of the day and chose to spend time with people better than themselves. Inversion: the sure way to a miserable life is unreliability. Be the person others can count on.", "ko": "버핏의 잣대는 돈이 아니었습니다. 사랑받고 싶은 사람들에게 실제로 사랑받고 있는가입니다. 그는 박수가 아니라 자기 기준으로 스스로를 평가하는 '내면의 점수표'를 지켰습니다. 멍거는 이렇게 덧붙였습니다. 원하는 것을 얻으려면 그것을 가질 자격을 갖추라. 기대치는 낮게. 질투·원망·자기연민은 버려라. 두 사람 모두 하루 대부분을 읽는 데 썼고, 자기보다 나은 사람과 어울렸습니다. 뒤집기: 비참한 삶으로 가는 확실한 길은 믿을 수 없는 사람이 되는 것입니다. 남들이 기댈 수 있는 사람이 되세요.", "es": "La medida de Buffett no era el dinero: es si las personas que esperas que te quieran realmente te quieren. También llevaba un marcador interno, juzgándose por sus propios estándares y no por el aplauso. Munger añadía: para obtener lo que quieres, merécelo; mantén bajas las expectativas; y deja la envidia, el resentimiento y la autocompasión. Ambos leían casi todo el día y eligieron rodearse de gente mejor que ellos. Inversión: el camino seguro a una vida miserable es no ser confiable. Sé alguien con quien los demás puedan contar.", "ja": "バフェットの物差しはお金ではありませんでした。愛されたい人に実際に愛されているかどうかです。彼は拍手ではなく自分の基準で自らを評価する「内なるスコアカード」を守りました。マンガーはこう加えました。欲しいものを得るには、それに値する人になれ。期待は低く。嫉妬・恨み・自己憐憫は捨てよ。二人とも一日の大半を読書に使い、自分より優れた人と付き合いました。逆転:惨めな人生への確実な道は、信頼できない人になること。頼られる人になりましょう。"}}, {"id": "j1", "e": "jensen", "q": {"en": "Is AI a bubble?", "ko": "AI는 거품인가요?", "es": "¿La IA es una burbuja?", "ja": "AIはバブルですか?"}, "a": {"en": "Jensen's lens lifts the question a level: this is not a gadget cycle, it is the largest infrastructure build-out in history, a five-layer cake of energy, chips, data centers, models and apps. In his frame, data centers are AI factories and the output, tokens, is revenue, so demand is measured in power and usage, not hype. Reality check: he leads the company that benefits most from that spending, so read his optimism as both analysis and position talk. Counterpoint: if the apps on top do not earn enough, the layers below get overbuilt.", "ko": "젠슨의 관점은 질문을 한 단계 끌어올립니다. 이건 기기 유행이 아니라 역사상 가장 큰 인프라 건설, 즉 에너지·칩·데이터센터·모델·앱의 5층 케이크라는 것입니다. 그의 틀에서 데이터센터는 AI 공장이고 그 산출물인 토큰이 곧 매출이라, 수요는 분위기가 아니라 전력과 사용량으로 잽니다. 현실 체크: 그는 그 투자에서 가장 큰 혜택을 보는 회사의 CEO입니다. 그의 낙관은 분석이자 동시에 포지션 토크로 읽어야 합니다. 반대 시각: 맨 위 앱들이 충분히 벌지 못하면 아래층이 과잉 투자가 됩니다.", "es": "La lente de Jensen sube la pregunta un nivel: no es un ciclo de aparatos, es la mayor construcción de infraestructura de la historia, un pastel de cinco capas: energía, chips, centros de datos, modelos y aplicaciones. En su marco, los centros de datos son fábricas de IA y su producto, los tokens, es ingreso, así que la demanda se mide en energía y uso, no en entusiasmo. Control de realidad: dirige la empresa que más se beneficia de ese gasto; lee su optimismo como análisis y como discurso interesado. Contrapunto: si las aplicaciones de arriba no ganan lo suficiente, las capas de abajo quedan sobreconstruidas.", "ja": "ジェンスンの視点は問いを一段引き上げます。これはガジェットの流行ではなく、史上最大のインフラ建設、つまりエネルギー・チップ・データセンター・モデル・アプリの5層ケーキだというのです。彼の枠組みではデータセンターはAI工場で、その産出物であるトークンが売上なので、需要は雰囲気ではなく電力と利用量で測ります。現実チェック:彼はその投資で最も恩恵を受ける会社のCEOです。楽観は分析であると同時にポジショントークとして読むべきです。反対意見:最上層のアプリが十分に稼げなければ、下の層が過剰投資になります。"}}, {"id": "j2", "e": "jensen", "q": {"en": "Will AI take my job?", "ko": "AI가 제 일자리를 빼앗을까요?", "es": "¿La IA me quitará el trabajo?", "ja": "AIに仕事を奪われますか?"}, "a": {"en": "Jensen's lens splits the question in two: the purpose of your job and the tasks you do to get there are related, not the same. AI changes tasks; the purpose stays. His line on this is well known: you are more likely to lose your job to someone who uses AI than to AI itself. He often cites radiology, where AI arrived and demand for radiologists still grew. Reality check: that is one profession, and transitions can hurt even when totals rise. Checkpoint: list your top five tasks and automate one this month.", "ko": "젠슨의 관점은 질문을 둘로 나눕니다. 직업의 목적과 그 목적을 위해 하는 작업은 연결돼 있지만 같지 않다는 것입니다. AI는 작업을 바꾸고 목적은 남깁니다. 이 주제의 유명한 한 줄은 이렇습니다. AI 자체보다 AI를 쓰는 사람에게 일자리를 잃을 가능성이 더 크다. 그는 AI가 들어온 뒤에도 영상의학과 의사 수요가 늘었다는 사례를 자주 듭니다. 현실 체크: 그건 한 직종의 사례이고, 전체가 늘어도 전환기는 아플 수 있습니다. 체크포인트: 내 핵심 작업 5개를 적고 이번 달에 하나를 자동화해 보세요.", "es": "La lente de Jensen divide la pregunta en dos: el propósito de tu trabajo y las tareas que haces para lograrlo están relacionados, pero no son lo mismo. La IA cambia las tareas; el propósito se queda. Su frase al respecto es conocida: es más probable perder tu trabajo ante alguien que usa IA que ante la IA misma. Suele citar la radiología, donde llegó la IA y aun así creció la demanda de radiólogos. Control de realidad: es una sola profesión y las transiciones duelen aunque el total suba. Acción: anota tus cinco tareas principales y automatiza una este mes.", "ja": "ジェンスンの視点は問いを二つに分けます。仕事の目的と、そのためにこなす作業はつながっているが同じではない。AIは作業を変え、目的は残ります。この話題での有名な一言はこうです。AIそのものより、AIを使う人に仕事を奪われる可能性の方が高い。彼はAI導入後も放射線科医の需要が増えた例をよく挙げます。現実チェック:それは一つの職種の例で、全体が増えても移行期は痛みを伴います。チェック:自分の主要作業を5つ書き出し、今月一つを自動化してみましょう。"}}, {"id": "j3", "e": "jensen", "q": {"en": "Why not just buy the cheaper chip?", "ko": "더 싼 칩을 사면 되지 않나요?", "es": "¿Por qué no comprar el chip más barato?", "ja": "安いチップを買えばいいのでは?"}, "a": {"en": "Jensen's lens reframes price as total cost of ownership. A chip sits inside a building with fixed power, land and cooling; what matters is how many tokens you get per watt and how fully the factory runs. That is why he argued a rival's chip could be free and still not be cheap enough. The real competition is the whole stack: systems, networking and software that developers already use. Counterpoint: custom chips from the biggest cloud companies are improving, and buyers want a second supplier.", "ko": "젠슨의 관점은 가격을 총소유비용으로 바꿔 봅니다. 칩은 전력·부지·냉각이 정해진 건물 안에 들어갑니다. 중요한 건 와트당 토큰을 얼마나 뽑느냐와 공장이 얼마나 꽉 돌아가느냐입니다. 그래서 그는 경쟁사 칩이 공짜여도 충분히 싸지 않을 수 있다고 주장했습니다. 진짜 경쟁은 칩 하나가 아니라 시스템·네트워크·개발자가 이미 쓰는 소프트웨어까지 포함한 전체 스택입니다. 반대 시각: 대형 클라우드 회사의 자체 칩이 좋아지고 있고, 고객은 두 번째 공급자를 원합니다.", "es": "La lente de Jensen convierte el precio en costo total de propiedad. Un chip vive dentro de un edificio con energía, terreno y refrigeración fijos; lo que importa es cuántos tokens obtienes por vatio y qué tan llena opera la fábrica. Por eso argumentó que el chip de un rival podría ser gratis y aun así no ser lo bastante barato. La competencia real es toda la pila: sistemas, redes y el software que los desarrolladores ya usan. Contrapunto: los chips propios de las grandes nubes mejoran y los compradores quieren un segundo proveedor.", "ja": "ジェンスンの視点は価格を総保有コストに置き換えます。チップは電力・土地・冷却が決まった建物の中に入ります。重要なのはワットあたり何トークン出せるか、工場がどれだけフル稼働するかです。だから彼は、競合のチップが無料でも十分に安くないことがあると主張しました。本当の競争はチップ単体ではなく、システム・ネットワーク・開発者が既に使うソフトウェアを含むスタック全体です。反対意見:大手クラウドの自社チップは進化しており、顧客は二社目の供給元を求めています。"}}, {"id": "j4", "e": "jensen", "q": {"en": "What comes after chatbots?", "ko": "챗봇 다음은 뭔가요?", "es": "¿Qué viene después de los chatbots?", "ja": "チャットボットの次は何ですか?"}, "a": {"en": "Jensen's lens points to markets that have close to zero revenue today, because that is where he likes to arrive early. Three recur in his talks: agents that do work rather than answer questions, physical AI such as robots and self-driving systems trained in simulation, and sovereign AI, where countries build their own intelligence infrastructure. His logic: create the market and the ecosystem becomes the moat. Reality check: these are long bets; timelines in robotics have slipped many times before.", "ko": "젠슨의 관점은 오늘 매출이 거의 0인 시장을 가리킵니다. 그는 그런 곳에 먼저 도착하는 걸 좋아하기 때문입니다. 그의 강연에 반복해서 나오는 세 가지가 있습니다. 질문에 답하는 대신 일을 해내는 에이전트, 시뮬레이션으로 훈련한 로봇과 자율주행 같은 피지컬 AI, 그리고 나라마다 자기 지능 인프라를 갖는 소버린 AI입니다. 그의 논리는 시장을 만들면 생태계가 해자가 된다는 것입니다. 현실 체크: 모두 긴 베팅이고, 로보틱스의 일정은 과거에 여러 번 밀렸습니다.", "es": "La lente de Jensen apunta a mercados que hoy tienen casi cero ingresos, porque ahí le gusta llegar primero. Tres temas se repiten en sus charlas: agentes que hacen trabajo en vez de responder preguntas, IA física como robots y sistemas autónomos entrenados en simulación, e IA soberana, donde los países construyen su propia infraestructura de inteligencia. Su lógica: crea el mercado y el ecosistema se vuelve el foso. Control de realidad: son apuestas largas; los plazos de la robótica se han retrasado muchas veces.", "ja": "ジェンスンの視点は、今日の売上がほぼゼロの市場を指します。彼はそういう場所に先に着くのが好きだからです。講演で繰り返し出る三つがあります。質問に答える代わりに仕事をこなすエージェント、シミュレーションで訓練したロボットや自動運転などのフィジカルAI、そして国ごとに自前の知能インフラを持つソブリンAIです。彼の論理は、市場を作れば生態系が堀になるというもの。現実チェック:どれも長期の賭けで、ロボティクスの時間軸は過去に何度も遅れています。"}}, {"id": "j5", "e": "jensen", "q": {"en": "How should I run my team?", "ko": "팀을 어떻게 운영해야 하나요?", "es": "¿Cómo debería dirigir mi equipo?", "ja": "チームをどう運営すべきですか?"}, "a": {"en": "Jensen's lens is radical flatness. He has described having around sixty direct reports and skipping routine one-on-ones, so information reaches many people at once and layers do not slow it down. Staff send short notes on their top five priorities, and he reasons through problems in front of the group so everyone learns from one answer. Reality check: biographers also describe public, sharp criticism, which is transparency to some and humiliation to others. Try one piece first: a weekly top-five note from everyone.", "ko": "젠슨의 관점은 극단적으로 평평한 조직입니다. 그는 직속 보고자가 60명 안팎이고 정기 1:1을 하지 않는다고 말해 왔습니다. 정보가 여러 사람에게 동시에 닿고 계층이 속도를 늦추지 않게 하려는 것입니다. 직원들은 가장 중요한 다섯 가지를 짧게 보내고, 그는 여러 사람 앞에서 문제를 풀어 보이며 한 번의 답으로 모두가 배우게 합니다. 현실 체크: 전기 작가들은 공개적이고 날카로운 질책도 묘사하는데, 누군가에겐 투명성이고 누군가에겐 모욕입니다. 하나만 먼저 해보세요. 매주 모두가 'Top 5' 메모를 보내는 것.", "es": "La lente de Jensen es la horizontalidad radical. Ha contado que tiene unos sesenta reportes directos y que evita las reuniones uno a uno de rutina, para que la información llegue a muchos a la vez y las capas no la frenen. El equipo envía notas breves con sus cinco prioridades, y él razona los problemas frente al grupo para que todos aprendan de una sola respuesta. Control de realidad: sus biógrafos también describen críticas públicas y duras, transparencia para unos y humillación para otros. Empieza por una pieza: una nota semanal de cinco prioridades de cada persona.", "ja": "ジェンスンの視点は徹底的にフラットな組織です。彼は直属の部下が60人ほどで、定例の1on1はしないと語ってきました。情報が多くの人に同時に届き、階層が速度を落とさないようにするためです。社員は最重要の5項目を短く送り、彼は皆の前で問題を解いてみせ、一つの答えから全員が学べるようにします。現実チェック:伝記作家は公開の厳しい叱責も描いており、ある人には透明性、別の人には屈辱です。まず一つだけ試しましょう。毎週全員が「トップ5」メモを送ること。"}}, {"id": "j6", "e": "jensen", "q": {"en": "How do I get over a big failure?", "ko": "큰 실패를 어떻게 이겨내나요?", "es": "¿Cómo supero un gran fracaso?", "ja": "大きな失敗をどう乗り越えますか?"}, "a": {"en": "Jensen's lens treats pain as fuel. He has said he wished students ample doses of pain and suffering, because people with very high expectations tend to have low resilience. His method for dark periods: forget yesterday, the way an athlete stops replaying the last point and plays the next one. He has also described running the company as if it were always about thirty days from going out of business. Reality check: fear is a strong motor but a costly one to run for decades. Checkpoint: write the lesson in one line, then close the file.", "ko": "젠슨의 관점은 고통을 연료로 봅니다. 그는 학생들에게 충분한 고통과 시련을 기원한다고 말한 적이 있습니다. 기대치가 너무 높은 사람은 회복력이 낮기 때문이라는 이유였습니다. 어두운 시기를 버티는 그의 방법은 '어제를 잊는 것'입니다. 운동선수가 지난 점수를 곱씹지 않고 다음 점수를 뛰는 것처럼요. 그는 회사를 늘 30일 뒤 망할 수 있는 것처럼 운영한다고도 말했습니다. 현실 체크: 공포는 강한 엔진이지만 수십 년 돌리기엔 비용이 큽니다. 체크포인트: 교훈을 한 줄로 적고, 그 파일은 닫으세요.", "es": "La lente de Jensen trata el dolor como combustible. Ha dicho que deseaba a los estudiantes buenas dosis de dolor y sufrimiento, porque la gente con expectativas muy altas suele tener poca resiliencia. Su método para las épocas oscuras: olvidar el ayer, como un atleta que deja de repasar el último punto y juega el siguiente. También ha descrito dirigir la empresa como si siempre estuviera a unos treinta días de quebrar. Control de realidad: el miedo es un motor potente pero caro de mantener durante décadas. Acción: escribe la lección en una línea y cierra el archivo.", "ja": "ジェンスンの視点は痛みを燃料と見なします。彼は学生たちに十分な痛みと苦しみを願うと語ったことがあります。期待が高すぎる人は回復力が低いからだという理由でした。暗い時期を耐える彼の方法は「昨日を忘れる」こと。アスリートが前のポイントを反芻せず次のポイントに集中するように。会社を常に30日後に潰れるかのように経営しているとも語っています。現実チェック:恐怖は強力なエンジンですが、何十年も回すにはコストが大きい。チェック:教訓を一行で書き、そのファイルは閉じましょう。"}}, {"id": "j7", "e": "jensen", "q": {"en": "What does Korea mean for AI?", "ko": "AI에서 한국은 어떤 의미인가요?", "es": "¿Qué significa Corea para la IA?", "ja": "AIにとって韓国とは?"}, "a": {"en": "Through Jensen's lens Korea is three layers at once. First, memory: much of the high-bandwidth memory that sits next to AI chips comes from Korean suppliers. Second, manufacturing: a country of factories is a natural home for robots and physical AI. Third, culture: he has credited PC gaming and Korea's PC bang and esports scene with helping build the company's early base. Reality check: supplier relationships shift with each product generation, so being a key partner today is not a guarantee tomorrow.", "ko": "젠슨의 관점에서 한국은 세 겹의 의미를 동시에 가집니다. 첫째, 메모리: AI 칩 옆에 붙는 고대역폭메모리(HBM)의 상당 부분을 한국 공급사가 만듭니다. 둘째, 제조: 공장이 많은 나라는 로봇과 피지컬 AI의 자연스러운 무대입니다. 셋째, 문화: 그는 PC 게임과 한국의 PC방·e스포츠가 회사의 초기 기반을 키웠다고 말해 왔습니다. 현실 체크: 공급사 관계는 제품 세대마다 바뀌므로, 오늘 핵심 파트너라는 것이 내일을 보장하지는 않습니다.", "es": "Con la lente de Jensen, Corea son tres capas a la vez. Primero, la memoria: buena parte de la memoria de alto ancho de banda que acompaña a los chips de IA viene de proveedores coreanos. Segundo, la manufactura: un país de fábricas es el hogar natural de robots e IA física. Tercero, la cultura: ha reconocido que los juegos de PC, los PC bang y los esports de Corea ayudaron a construir la base inicial de la empresa. Control de realidad: las relaciones con proveedores cambian en cada generación de producto; ser socio clave hoy no garantiza mañana.", "ja": "ジェンスンの視点では、韓国は三層の意味を同時に持ちます。第一にメモリ:AIチップの隣に載る広帯域メモリ(HBM)の多くを韓国企業が供給しています。第二に製造:工場の多い国はロボットとフィジカルAIの自然な舞台です。第三に文化:彼はPCゲームと韓国のPCバン・eスポーツが会社の初期基盤を育てたと語ってきました。現実チェック:サプライヤーとの関係は製品世代ごとに変わるので、今日の主要パートナーが明日も保証されるわけではありません。"}}, {"id": "j8", "e": "jensen", "q": {"en": "Should I start a company?", "ko": "창업해도 될까요?", "es": "¿Debería fundar una empresa?", "ja": "起業すべきですか?"}, "a": {"en": "Jensen's lens gives a two-part answer, and he keeps the parts separate. Part one: knowing the pain, he has said he would not start a company again, and that nobody in their right mind would. Part two: he loves what the company became and what it gave the world. His explanation for why founders start anyway is the question \"how hard can it be?\", a useful ignorance of the difficulty. Checkpoint: be honest about which pain you are signing up for, and make sure the problem is worth that much.", "ko": "젠슨의 관점은 두 부분으로 답하고, 그 둘을 섞지 않습니다. 첫째, 고통을 알기에 다시는 창업하지 않겠다고, 제정신이라면 아무도 안 할 거라고 말했습니다. 둘째, 회사가 이룬 것과 세상에 준 것은 사랑한다고 했습니다. 그래도 창업자들이 시작하는 이유를 그는 '얼마나 어렵겠어?'라는 질문, 즉 어려움을 모르는 유용한 무지로 설명합니다. 체크포인트: 어떤 고통에 서명하는지 솔직하게 보고, 그 문제가 그만한 가치가 있는지 확인하세요.", "es": "La lente de Jensen responde en dos partes y no las mezcla. Primera: conociendo el dolor, ha dicho que no volvería a fundar una empresa y que nadie en su sano juicio lo haría. Segunda: ama lo que la empresa llegó a ser y lo que dio al mundo. Su explicación de por qué los fundadores empiezan de todos modos es la pregunta \"¿qué tan difícil puede ser?\", una ignorancia útil sobre la dificultad. Acción: sé honesto sobre qué dolor estás firmando y asegúrate de que el problema lo valga.", "ja": "ジェンスンの視点は二つに分けて答え、混ぜません。一つ目、痛みを知っているから二度と起業しない、正気なら誰もしないと語りました。二つ目、会社が成し遂げたことと世界に与えたものは愛していると。それでも創業者が始める理由を、彼は「どれほど難しいというのか?」という問い、つまり困難を知らない有益な無知で説明します。チェック:どんな痛みにサインするのかを正直に見て、その問題にそれだけの価値があるか確かめましょう。"}}, {"id": "m1", "e": "musk", "q": {"en": "How do I cut my company's costs by 10x?", "ko": "회사 비용을 10분의 1로 줄이려면?", "es": "¿Cómo reduzco 10 veces los costos de mi empresa?", "ja": "会社のコストを10分の1にするには?"}, "a": {"en": "Musk's lens: stop benchmarking against competitors and price everything from raw materials up. He showed in 2012 that batteries sold for about $600 per kWh while their materials cost about $80. Compute an idiot index for each big line item: finished cost divided by material cost. Then run his algorithm in order: give every requirement a named owner, delete before you optimize, automate last. The 10x comes from deleting, not squeezing. Reality check: 10x is a direction, not a promise; most savings come from the first two steps.", "ko": "머스크의 관점: 경쟁사와 비교하지 말고 모든 비용을 원재료부터 다시 계산하세요. 그는 2012년, kWh당 약 600달러에 팔리던 배터리의 원재료 값이 약 80달러라는 것을 보여줬습니다. 큰 비용 항목마다 바보 지수(idiot index), 즉 완성품 원가 ÷ 원재료 원가를 구하세요. 그다음 알고리즘을 순서대로: 모든 요구사항에 책임자 이름을 붙이고, 최적화 전에 삭제하고, 자동화는 맨 마지막에. 10배는 쥐어짜기가 아니라 삭제에서 나옵니다. 현실 점검: 10배는 방향이지 약속이 아닙니다. 절감의 대부분은 처음 두 단계에서 나옵니다.", "es": "La lente de Musk: deja de compararte con la competencia y calcula cada costo desde las materias primas. En 2012 mostró que las baterías se vendían a unos 600 dólares por kWh mientras sus materiales costaban unos 80. Calcula un índice idiota (idiot index) para cada partida grande: costo final dividido entre costo de materiales. Luego aplica su algoritmo en orden: cada requisito con un responsable con nombre, borrar antes de optimizar, automatizar al final. El 10x sale de borrar, no de exprimir. Prueba de realidad: 10x es una dirección, no una promesa; casi todo el ahorro sale de los dos primeros pasos.", "ja": "マスクの視点:競合と比べるのをやめ、すべてのコストを原材料から計算し直すこと。彼は2012年、kWhあたり約600ドルで売られていた電池の原材料費が約80ドルだと示しました。大きな費目ごとにバカ指数(idiot index)、つまり完成品コスト÷原材料コストを出します。次にアルゴリズムを順番どおりに:すべての要件に責任者の名前を付け、最適化の前に削除し、自動化は最後に。10倍は絞り込みではなく削除から生まれます。現実チェック:10倍は方向であって約束ではありません。節約の大半は最初の二段階から生まれます。"}}, {"id": "m2", "e": "musk", "q": {"en": "What happens when AI surpasses humanity?", "ko": "AI가 인류를 넘어서면 어떻게 되나요?", "es": "¿Qué pasa cuando la IA supere a la humanidad?", "ja": "AIが人類を超えたらどうなりますか?"}, "a": {"en": "Musk's lens: treat it as a probability distribution, not a yes or no. In 2026 he predicted AI smarter than any single human by 2026 or 2027 and smarter than all humans combined around 2030 to 2031, and said humans may not stay in control within ten years. He puts the chance of catastrophe at 10 to 20%, yet calls abundance for all the most likely outcome. His fix is not a pause but transparency: leading labs checking each other's models before release. Reality check: his AI timelines are among the most aggressive anywhere, and he runs an AI company.", "ko": "머스크의 관점: 예·아니오가 아니라 확률 분포로 보세요. 그는 2026년, AI가 2026~2027년에 어떤 개인보다 똑똑해지고 2030~2031년경 인류 전체보다 똑똑해지며, 10년 안에 인간이 통제권을 유지하지 못할 수 있다고 전망했습니다. 파국 가능성은 10~20%로 보면서도, 가장 가능성 높은 결말은 '모두를 위한 풍요'라고 봅니다. 해법은 멈춤이 아니라 투명성, 즉 선두 연구소들이 출시 전에 서로의 모델을 점검하는 것입니다. 현실 점검: 그의 AI 시간표는 업계에서 가장 공격적인 편이고, 그 자신이 AI 회사를 운영합니다.", "es": "La lente de Musk: trátalo como una distribución de probabilidades, no como un sí o un no. En 2026 predijo una IA más lista que cualquier persona para 2026 o 2027 y más lista que toda la humanidad junta hacia 2030 o 2031, y dijo que quizá los humanos no mantengan el control dentro de diez años. Pone la probabilidad de catástrofe en 10 a 20%, pero considera la abundancia para todos como el resultado más probable. Su solución no es una pausa, sino transparencia: que los laboratorios líderes revisen los modelos de los demás antes de lanzarlos. Prueba de realidad: sus plazos de IA están entre los más agresivos, y él dirige una empresa de IA.", "ja": "マスクの視点:イエスかノーではなく確率分布で考えること。彼は2026年、AIが2026〜2027年にどの個人より賢くなり、2030〜2031年頃に人類全体より賢くなり、10年以内に人間が主導権を保てない可能性があると予測しました。破局の確率は10〜20%としつつ、最も可能性の高い結末は「すべての人にとっての豊かさ」だと見ています。解決策は停止ではなく透明性、つまり主要な研究所が公開前に互いのモデルを点検することです。現実チェック:彼のAIの時間軸は業界でも最も強気な部類で、彼自身がAI企業を経営しています。"}}, {"id": "m3", "e": "musk", "q": {"en": "What investing principle fits the AI era?", "ko": "AI 시대에 어떤 투자 원칙을 가져야 하나요?", "es": "¿Qué principio de inversión sirve en la era de la IA?", "ja": "AI時代にはどんな投資原則を持つべきですか?"}, "a": {"en": "Musk's lens: own products, not tickers. His 2022 advice was to buy companies whose products you believe in, sell only if those products are trending worse, and not panic when the market does. In first-principles terms, ask two questions: is the product getting better every year, and is its cost curve moving toward the physical limit? He called moats lame in 2018 because the speed of improvement matters more. This is a lens, not a buy or sell call. Reality check: loving a product can blind you to the price you pay.", "ko": "머스크의 관점: 종목 코드가 아니라 제품을 소유하세요. 그의 2022년 조언은 믿는 제품을 만드는 기업을 사고, 그 제품이 나빠지는 추세일 때만 팔며, 시장이 패닉일 때 따라 패닉하지 말라는 것이었습니다. 제1원칙으로 바꾸면 두 가지 질문입니다. 제품이 매년 좋아지고 있는가, 원가 곡선이 물리 한계로 다가가고 있는가? 그는 2018년 개선 속도가 더 중요하다며 해자(moat)를 '시시하다'고 했습니다. 매수·매도 판단이 아니라 렌즈입니다. 현실 점검: 제품에 대한 애정은 지불하는 가격을 못 보게 만들 수 있습니다.", "es": "La lente de Musk: sé dueño de productos, no de tickers. Su consejo de 2022 fue comprar empresas cuyos productos te convencen, vender solo si esos productos van a peor y no entrar en pánico cuando el mercado lo hace. En primeros principios son dos preguntas: ¿el producto mejora cada año? ¿su curva de costos se acerca al límite físico? En 2018 llamó aburridos a los fosos (moats) porque importa más la velocidad de mejora. Es una lente, no una señal de compra o venta. Prueba de realidad: amar un producto puede impedirte ver el precio que pagas.", "ja": "マスクの視点:ティッカーではなく製品を持つこと。彼の2022年の助言は、信じる製品を作る企業を買い、その製品が悪化傾向のときだけ売り、市場がパニックのときに一緒にパニックにならないことでした。第一原理で言えば二つの問いです。製品は毎年良くなっているか、コスト曲線は物理的限界に近づいているか。彼は2018年、改善の速さの方が重要だとして堀(moat)を「つまらない」と言いました。売買判断ではなくレンズです。現実チェック:製品への愛着は、支払う価格を見えなくすることがあります。"}}, {"id": "m4", "e": "musk", "q": {"en": "I'm afraid of failing.", "ko": "실패가 두려워요.", "es": "Tengo miedo de fracasar.", "ja": "失敗するのが怖いです。"}, "a": {"en": "Musk's lens: separate experiments you can afford to blow up from bets you cannot. He has said that if things are not failing, you are not innovating enough, and SpaceX tests rockets until they break, but never with crew on board. He also puts numbers on his own odds, like 50-50 for Mars in 2026. So write down your odds, then make each failure smaller: cheaper prototypes, faster loops, more attempts. Reality check: survivorship bias is real; many people took similar odds and lost.", "ko": "머스크의 관점: 터져도 되는 실험과 터지면 안 되는 베팅을 나누세요. 그는 일이 실패하지 않는다면 충분히 혁신하지 않는 것이라고 말했고, 스페이스X는 로켓이 부서질 때까지 시험합니다. 단, 사람이 탄 비행에서는 절대 아닙니다. 그는 자기 베팅에도 '2026년 화성 50-50'처럼 확률을 붙입니다. 그러니 내 확률을 적어 보고, 실패 하나하나를 작게 만드세요. 더 싼 시제품, 더 빠른 반복, 더 많은 시도. 현실 점검: 생존자 편향은 실재합니다. 비슷한 확률에 걸었다가 진 사람도 많습니다.", "es": "La lente de Musk: separa los experimentos que puedes permitirte reventar de las apuestas que no. Ha dicho que si las cosas no fallan, no estás innovando lo suficiente, y SpaceX prueba cohetes hasta romperlos, pero nunca con tripulación. También pone números a sus propias probabilidades, como 50-50 para Marte en 2026. Así que escribe tus probabilidades y haz cada fracaso más pequeño: prototipos más baratos, ciclos más rápidos, más intentos. Prueba de realidad: el sesgo de supervivencia existe; muchos tomaron probabilidades parecidas y perdieron.", "ja": "マスクの視点:壊れてもいい実験と、壊れてはいけない賭けを分けること。彼は、失敗が起きていないなら革新が足りないと言い、SpaceXはロケットが壊れるまで試験します。ただし人が乗る飛行では決してしません。彼は自分の賭けにも「2026年の火星は五分五分」のように確率を付けます。だから自分の確率を書き出し、失敗の一つ一つを小さくすること。より安い試作、より速い反復、より多い試行。現実チェック:生存者バイアスは実在します。似た確率に賭けて負けた人も大勢います。"}}, {"id": "m5", "e": "musk", "q": {"en": "Why the Moon before Mars?", "ko": "왜 화성보다 달이 먼저인가요?", "es": "¿Por qué la Luna antes que Marte?", "ja": "なぜ火星より先に月なのですか?"}, "a": {"en": "Musk's lens: cycle time. Mars launch windows open about every 26 months and the trip takes about six months; the Moon is about two days away. In February 2026 he moved SpaceX's focus to a self-growing city on the Moon within ten years, with a Mars city starting in five to seven years. Faster loops mean faster learning, which is step four of his algorithm. The goal, securing the future of civilization, did not change; the route did. Reality check: in 2025 he gave an uncrewed Mars ship in 2026 a 50-50 chance, and that date has moved.", "ko": "머스크의 관점: 사이클 타임(cycle time)입니다. 화성 발사창은 약 26개월마다 열리고 가는 데 약 6개월이 걸리지만, 달은 약 이틀 거리입니다. 그는 2026년 2월 스페이스X의 초점을 10년 안에 달에 '스스로 자라는 도시'를 짓는 쪽으로 옮겼고, 화성 도시는 5~7년 뒤 시작한다고 밝혔습니다. 반복이 빠를수록 학습이 빠르고, 이것이 알고리즘 4단계입니다. 목표인 '문명의 미래 확보'는 그대로이고 경로만 바뀌었습니다. 현실 점검: 그는 2025년 '2026년 무인 화성선'에 50-50을 걸었고, 그 날짜는 이미 밀렸습니다.", "es": "La lente de Musk: tiempo de ciclo (cycle time). Las ventanas de lanzamiento a Marte se abren cada 26 meses aproximadamente y el viaje dura unos seis meses; la Luna está a unos dos días. En febrero de 2026 cambió el foco de SpaceX a una ciudad autosuficiente en la Luna en menos de diez años, con una ciudad en Marte a partir de cinco a siete años. Ciclos más rápidos significan aprendizaje más rápido: el paso cuatro de su algoritmo. La meta, asegurar el futuro de la civilización, no cambió; cambió la ruta. Prueba de realidad: en 2025 dio un 50-50 a una nave sin tripulación a Marte en 2026, y esa fecha ya se movió.", "ja": "マスクの視点:サイクルタイム(cycle time)です。火星への打ち上げ窓は約26か月ごとに開き、移動に約6か月かかりますが、月は約2日の距離です。彼は2026年2月、SpaceXの焦点を10年以内に月に「自ら成長する都市」を造る方向へ移し、火星の都市は5〜7年後に始めると述べました。反復が速いほど学習も速く、これがアルゴリズムの第4段階です。「文明の未来を守る」という目標は変わらず、経路だけが変わりました。現実チェック:彼は2025年に「2026年の無人火星船」を五分五分としましたが、その日付はすでにずれています。"}}, {"id": "m6", "e": "musk", "q": {"en": "If jobs disappear, what will we do?", "ko": "일자리가 사라지면 우리는 무엇을 하나요?", "es": "Si desaparecen los empleos, ¿qué haremos?", "ja": "仕事がなくなったら、私たちは何をするのですか?"}, "a": {"en": "Musk's lens: in 2024 he said probably none of us will need a job, work will become optional like a hobby, and that world will need universal high income, not basic income. In 2026 he called abundance for all the most likely outcome, around 2036. The harder question he raises himself is meaning: if machines do everything better, what is a human life for? His recurring answer is to expand consciousness and learn which questions to ask. Reality check: how that income is funded and shared is unsolved, and he has not spelled it out.", "ko": "머스크의 관점: 그는 2024년, 아마 누구도 직업이 필요 없어지고 일은 취미처럼 선택이 되며, 그 세상엔 기본소득이 아니라 '보편적 고소득'이 필요하다고 말했습니다. 2026년에는 2036년경 '모두를 위한 풍요'를 가장 가능성 높은 결말로 꼽았습니다. 그가 스스로 던지는 더 어려운 질문은 의미입니다. 기계가 모든 걸 더 잘하면 인간의 삶은 무엇을 위한 것인가? 그의 반복되는 답은 의식을 확장하고, 무엇을 물어야 할지 배우는 것입니다. 현실 점검: 그 소득을 어떻게 마련하고 나눌지는 풀리지 않았고, 그도 구체적으로 설명하지 않았습니다.", "es": "La lente de Musk: en 2024 dijo que probablemente nadie necesitará un empleo, que el trabajo será opcional como un pasatiempo y que ese mundo necesitará un ingreso alto universal, no uno básico. En 2026 llamó a la abundancia para todos el resultado más probable, hacia 2036. La pregunta más difícil la plantea él mismo: si las máquinas lo hacen todo mejor, ¿para qué es una vida humana? Su respuesta recurrente es expandir la conciencia y aprender qué preguntas hacer. Prueba de realidad: cómo se financia y reparte ese ingreso está sin resolver, y él no lo ha detallado.", "ja": "マスクの視点:彼は2024年、おそらく誰も仕事を必要としなくなり、仕事は趣味のような選択になり、その世界にはベーシックインカムではなく「ユニバーサル・ハイインカム」が必要だと語りました。2026年には2036年頃の「すべての人にとっての豊かさ」を最も可能性の高い結末としました。彼自身が投げかけるより難しい問いは意味です。機械が何でもうまくこなすなら、人間の人生は何のためにあるのか。彼の繰り返しの答えは、意識を広げ、何を問うべきかを学ぶことです。現実チェック:その所得をどう賄い分配するかは未解決で、彼も具体的に説明していません。"}}, {"id": "m7", "e": "musk", "q": {"en": "We have too many meetings and reports.", "ko": "회의와 보고가 너무 많아요.", "es": "Tenemos demasiadas reuniones e informes.", "ja": "会議と報告が多すぎます。"}, "a": {"en": "Musk's lens: a meeting is a requirement, so it needs a named owner and it can be deleted. His 2018 Tesla email said to walk out of a meeting when you are not adding value and to communicate by the shortest path, not the org chart. Apply step two of his algorithm: cut the recurring meetings and reports, then add back only the ones people truly miss; if you restore less than 10%, you did not cut enough. Reality check: deleting without a feedback channel can hide problems, so give people direct access to the work instead.", "ko": "머스크의 관점: 회의도 요구사항입니다. 그러니 책임자 이름이 있어야 하고, 지울 수 있습니다. 그의 2018년 테슬라 이메일은 기여하지 않는 회의에서는 나가고, 조직도가 아니라 가장 짧은 경로로 소통하라고 했습니다. 알고리즘 2단계를 적용하세요. 정기 회의와 보고를 지운 뒤, 사람들이 정말 아쉬워하는 것만 되살립니다. 10%도 안 되살렸다면 덜 지운 것입니다. 현실 점검: 피드백 통로 없이 지우면 문제가 숨을 수 있습니다. 대신 현장 작업을 직접 볼 수 있게 하세요.", "es": "La lente de Musk: una reunión es un requisito, así que necesita un responsable con nombre y se puede borrar. Su correo de 2018 en Tesla decía salir de una reunión cuando no aportas y comunicarse por el camino más corto, no por el organigrama. Aplica el paso dos de su algoritmo: elimina reuniones e informes recurrentes y recupera solo los que de verdad se echan de menos; si recuperas menos del 10%, no recortaste lo suficiente. Prueba de realidad: borrar sin un canal de retroalimentación puede ocultar problemas; da acceso directo al trabajo.", "ja": "マスクの視点:会議も要件です。だから責任者の名前が必要で、削除できます。彼の2018年のテスラ社内メールは、貢献していない会議からは退出し、組織図ではなく最短経路で連絡せよと書いていました。アルゴリズムの第2段階を適用すること。定例の会議と報告を削り、本当に惜しまれるものだけを戻します。戻したのが10%未満なら削り足りません。現実チェック:フィードバックの経路なしに削ると問題が隠れることがあります。代わりに現場の仕事を直接見られるようにしましょう。"}}, {"id": "m8", "e": "musk", "q": {"en": "Can you trust Musk's predictions?", "ko": "머스크의 예측은 믿을 만한가요?", "es": "¿Se puede confiar en las predicciones de Musk?", "ja": "マスクの予測は信頼できますか?"}, "a": {"en": "Musk's lens on his own record: the direction is often right, the dates are often late. Reusable rockets and satellite internet went from mocked to dominant, and SpaceX listed in June 2026 at about $1.77 trillion. But self-driving has been promised since 2015, robotaxis were promised for 2020, and the Cybertruck arrived about a year and a half late. A practical rule: take the direction seriously and stretch the date two to three times. Reality check: that rule is this site's judgment, not his.", "ko": "그의 기록에 머스크 렌즈를 대면: 방향은 자주 맞고, 날짜는 자주 늦습니다. 재사용 로켓과 위성 인터넷은 조롱받다가 시장을 지배했고, 스페이스X는 2026년 6월 약 1조 7,700억 달러 가치로 상장했습니다. 하지만 자율주행은 2015년부터 약속됐고, 로보택시는 2020년을 약속했으며, 사이버트럭은 약 1년 반 늦게 나왔습니다. 실전 규칙: 방향은 진지하게, 날짜는 2~3배로 늘려 읽으세요. 현실 점검: 이 규칙은 머스크가 아니라 이 사이트의 판단입니다.", "es": "La lente de Musk aplicada a su propio historial: la dirección suele acertar, las fechas suelen retrasarse. Los cohetes reutilizables y el internet satelital pasaron de la burla al dominio, y SpaceX salió a bolsa en junio de 2026 valorada en unos 1,77 billones de dólares. Pero la conducción autónoma se promete desde 2015, los robotaxis se prometieron para 2020 y el Cybertruck llegó con un año y medio de retraso. Regla práctica: toma en serio la dirección y estira la fecha dos o tres veces. Prueba de realidad: esa regla es criterio de este sitio, no de él.", "ja": "彼自身の実績にマスクのレンズを当てると:方向はよく当たり、日付はよく遅れます。再利用ロケットと衛星インターネットは嘲笑から市場支配へと変わり、SpaceXは2026年6月に約1.77兆ドルの評価で上場しました。しかし自動運転は2015年から約束され、ロボタクシーは2020年を約束し、サイバートラックは約1年半遅れました。実践ルール:方向は真剣に受け止め、日付は2〜3倍に延ばして読むこと。現実チェック:このルールはマスクではなく、このサイトの判断です。"}}, {"id": "d1", "e": "duel", "q": {"en": "Is AI a bubble?", "ko": "AI는 거품인가?", "es": "¿La IA es una burbuja?", "ja": "AIはバブルか?"}, "a": {"buffett": {"en": "World-changing and money-losing can both be true. Ask who keeps pricing power after everyone builds the same thing. Verdict: too hard at today's prices, unless you can name the moat.", "ko": "세상을 바꾸면서 돈을 잃게 할 수도 있습니다. 모두가 같은 걸 만든 뒤에도 가격결정력을 지킬 회사가 누구인지 물으세요. 결론: 해자를 말할 수 없다면 지금 가격에선 '너무 어려움'.", "es": "Cambiar el mundo y perder dinero pueden ser ciertos a la vez. Pregunta quién conserva poder de precios cuando todos construyen lo mismo. Veredicto: demasiado difícil a precios de hoy, salvo que puedas nombrar el foso.", "ja": "世界を変えつつ損をさせることもあり得ます。誰もが同じものを作った後も価格決定力を保つのは誰かを問うこと。結論:堀を言えないなら、今の価格では「難しすぎる」。"}, "jensen": {"en": "Not a cycle but the largest infrastructure build-out in history; tokens are revenue. Counterpoint he must face: he sells the shovels, and the top layer still has to earn.", "ko": "유행이 아니라 역사상 가장 큰 인프라 건설이고, 토큰이 곧 매출입니다. 그가 마주해야 할 반론: 그는 삽을 파는 사람이고, 맨 위 앱층이 결국 벌어야 합니다.", "es": "No es un ciclo, sino la mayor construcción de infraestructura de la historia; los tokens son ingreso. El contrapunto que debe enfrentar: él vende las palas, y la capa de arriba aún tiene que ganar.", "ja": "流行ではなく史上最大のインフラ建設で、トークンが売上です。彼が向き合うべき反論:彼はシャベルを売る側で、最上層がいずれ稼がなければならない。"}, "musk": {"en": "Not a bubble in his view but a power problem: chips will soon outrun the electricity to run them, so he is moving compute to solar-powered orbit. Reality check: he owns the AI company that gains from that story.", "ko": "그가 보기엔 거품이 아니라 전력 문제입니다. 곧 칩이 그 칩을 돌릴 전기보다 많아지니, 컴퓨팅을 태양광 궤도로 옮깁니다. 현실 점검: 그는 그 이야기로 이득을 보는 AI 회사의 주인입니다.", "es": "Para él no es una burbuja, sino un problema de energía: pronto habrá más chips que electricidad para hacerlos funcionar, así que lleva la computación a la órbita solar. Prueba de realidad: es dueño de la empresa de IA que gana con ese relato.", "ja": "彼の見方ではバブルではなく電力の問題です。まもなくチップがそれを動かす電力を上回るので、計算をソーラー駆動の軌道へ移します。現実チェック:彼はその物語で得をするAI企業のオーナーです。"}}}, {"id": "d2", "e": "duel", "q": {"en": "Speed or patience?", "ko": "속도인가, 인내인가?", "es": "¿Velocidad o paciencia?", "ja": "スピードか、忍耐か?"}, "a": {"buffett": {"en": "Patience. Big money is made by waiting, like a punch card with only twenty investments for life. Swing only at fat pitches.", "ko": "인내입니다. 큰돈은 기다림에서 나옵니다. 평생 20번만 쓸 수 있는 펀치카드처럼 투자하고, 좋은 공에만 휘두르세요.", "es": "Paciencia. El dinero grande se gana esperando, como una tarjeta con solo veinte inversiones en la vida. Batea solo los lanzamientos fáciles.", "ja": "忍耐です。大きなお金は待つことから生まれます。生涯20回しか使えないパンチカードのように投資し、甘い球だけを振ること。"}, "jensen": {"en": "Speed. Ship every year so rivals are always a generation behind, but never launch a product that is not ready. Fast is a strategy; sloppy is not.", "ko": "속도입니다. 매년 새 세대를 내서 경쟁자가 늘 한 세대 뒤처지게 하되, 준비 안 된 제품은 절대 내지 않습니다. 빠른 건 전략이고, 엉성한 건 전략이 아닙니다.", "es": "Velocidad. Lanza cada año para que los rivales vayan siempre una generación atrás, pero nunca lances un producto que no esté listo. Rápido es estrategia; descuidado no.", "ja": "スピードです。毎年新世代を出して競合を常に一世代遅れにする。ただし準備不足の製品は決して出さない。速いのは戦略、雑なのは戦略ではない。"}, "musk": {"en": "Speed, but in order: delete first, then accelerate. Speeding up a process that should not exist is his textbook mistake. Reality check: his speed often shows up as late dates.", "ko": "속도입니다. 단, 순서대로: 먼저 지우고, 그다음 가속. 존재하지 말아야 할 공정을 빠르게 만드는 것이 그가 꼽는 대표적 실수입니다. 현실 점검: 그의 속도는 자주 늦은 날짜로 나타납니다.", "es": "Velocidad, pero en orden: primero borrar, luego acelerar. Acelerar un proceso que no debería existir es su error de manual. Prueba de realidad: su velocidad a menudo se traduce en fechas tardías.", "ja": "速さです。ただし順番どおりに:まず削り、それから加速。存在すべきでない工程を速くするのが、彼の挙げる典型的な失敗です。現実チェック:彼の速さはしばしば遅れた日付として現れます。"}}}, {"id": "d3", "e": "duel", "q": {"en": "Moat or momentum?", "ko": "해자인가, 추진력인가?", "es": "¿Foso o impulso?", "ja": "堀か、勢いか?"}, "a": {"buffett": {"en": "Moat. A durable advantage you can name in one word, proven by years of high returns. Momentum without a moat is a rented lead.", "ko": "해자입니다. 한 단어로 말할 수 있고 수년간 높은 수익률로 증명된 오래가는 우위. 해자 없는 추진력은 빌린 선두일 뿐입니다.", "es": "Foso. Una ventaja duradera que puedas nombrar en una palabra, probada con años de altos retornos. El impulso sin foso es una ventaja alquilada.", "ja": "堀です。一語で言え、長年の高い利益率で証明された持続的な優位。堀のない勢いは借り物のリードにすぎない。"}, "jensen": {"en": "Build the market before it exists and the ecosystem becomes the moat. Developers who already build on your stack are the advantage, not the chip.", "ko": "시장이 생기기 전에 만들면 생태계가 해자가 됩니다. 이미 내 스택 위에서 개발하는 개발자들이 우위지, 칩 자체가 아닙니다.", "es": "Construye el mercado antes de que exista y el ecosistema se vuelve el foso. La ventaja son los desarrolladores que ya construyen sobre tu pila, no el chip.", "ja": "市場ができる前に作れば、生態系が堀になる。優位は既に自社スタックで開発している開発者たちであって、チップそのものではない。"}, "musk": {"en": "Momentum. He called moats lame in 2018 and argued that the rate of innovation is the real defense. Reality check: Buffett answered that you still have to widen your moat all the time.", "ko": "추진력입니다. 그는 2018년 해자를 '시시하다'고 했고, 혁신 속도가 진짜 방어라고 주장했습니다. 현실 점검: 버핏은 그래도 해자는 늘 넓혀야 한다고 응수했습니다.", "es": "Impulso. En 2018 llamó aburridos a los fosos y defendió que la velocidad de innovación es la verdadera defensa. Prueba de realidad: Buffett respondió que igual hay que ensanchar el foso siempre.", "ja": "推進力です。彼は2018年に堀を「つまらない」と呼び、革新の速さこそ本当の防御だと主張しました。現実チェック:バフェットは、それでも堀は常に広げ続けるべきだと応じました。"}}}, {"id": "d4", "e": "duel", "q": {"en": "Advice for a 25-year-old?", "ko": "25살에게 해줄 조언은?", "es": "¿Consejo para alguien de 25 años?", "ja": "25歳へのアドバイスは?"}, "a": {"buffett": {"en": "Invest in yourself first, read every day, avoid debt, and hang out with people better than you. Compounding works on knowledge and reputation too.", "ko": "먼저 자기 자신에게 투자하고, 매일 읽고, 빚을 피하고, 나보다 나은 사람과 어울리세요. 복리는 지식과 평판에도 작동합니다.", "es": "Invierte primero en ti, lee cada día, evita las deudas y rodéate de gente mejor que tú. El interés compuesto también funciona con el conocimiento y la reputación.", "ja": "まず自分に投資し、毎日読み、借金を避け、自分より優れた人と付き合うこと。複利は知識と評判にも働きます。"}, "jensen": {"en": "Expect pain and get good at it; resilience beats expectations. Learn to use AI now, because the threat is the person who uses it better than you.", "ko": "고통을 예상하고 거기에 익숙해지세요. 회복력이 기대치를 이깁니다. 지금 AI를 쓰는 법을 배우세요. 위협은 AI를 나보다 잘 쓰는 사람입니다.", "es": "Espera dolor y aprende a manejarlo; la resiliencia vence a las expectativas. Aprende a usar la IA ahora, porque la amenaza es quien la usa mejor que tú.", "ja": "痛みを予期し、それに慣れること。回復力は期待に勝ちます。今AIの使い方を学びましょう。脅威はAIを自分より上手に使う人です。"}, "musk": {"en": "Work much harder than others, take big risks while your obligations are low, and ask friends for negative feedback (USC, 2014). Reality check: his own example compares 100-hour weeks with 50-hour ones, and that pace has real costs.", "ko": "남보다 훨씬 많이 일하고, 짊어진 책임이 적을 때 큰 위험을 감수하고, 친구에게 부정적 피드백을 구하라 (USC, 2014). 현실 점검: 그가 든 예시는 주 50시간 대 100시간이고, 그 속도의 대가는 실재합니다.", "es": "Trabaja mucho más que los demás, asume grandes riesgos mientras tienes pocas obligaciones y pide críticas a tus amigos (USC, 2014). Prueba de realidad: su propio ejemplo compara semanas de 100 horas con las de 50, y ese ritmo tiene costos reales.", "ja": "人よりはるかに多く働き、背負うものが少ないうちに大きなリスクを取り、友人に否定的なフィードバックを求めよ(USC、2014年)。現実チェック:彼の例えは週50時間対100時間で、そのペースの代償は現実にあります。"}}}]};

    case 'leverage':case 'debt':case 'margin':case '빚투':{if(!LV||!LV.regime){A(esc(t.lv_load));break;}const K=LV.kpi;A(`<pre>${esc(LV.regime.icon+' '+t.lv_reg[LV.regime.key]+' · '+fmt(t.lv_h2,{f:Math.round(LV.fuel),x:Math.round(LV.fire)}))}\n${esc((t.lv_v1[LV.verdict[0]]||'')+' '+(t.lv_v2[LV.verdict[1]]||''))}\n\n${esc(t.lv_k[0])}  ${esc(lvJo(K.credit))}\n${esc(t.lv_k[1])}  ${esc(lvEok(K.forced))} (${esc(fmt(t.lv_fx,{x:K.forced_x!=null?K.forced_x.toFixed(1):'—'}))})\n${esc(t.lv_k[2])}  ${esc(lvJo(K.unpaid))}\n${esc(t.lv_k[3])}  ${esc(lvJo(K.deposit,1))}\n${esc(t.lv_k[4])}  ${K.kospi}\n\nas of ${LV.asof} · KOFIA FreeSIS</pre><a href="#leverage">#leverage</a>`);break;}
    case 'quote':case 'card':case '명언':{const c=qtPick(qtDay());if(!c){A(esc(t.q_load));break;}const x=qtL(c.q);A(`<pre>${esc(c.th.tag+' · '+qtNm(c.th))}

<b>“${esc(x.text)}”</b>
— ${esc(x.who)} · ${esc(x.ctx)}

${esc(t.q_order)}: ${esc(x.order)}</pre><a href="#quote">#quote</a>`);break;}
    case 'lockup':case 'lock':case 'unlock':case '락업':{if(!LK){A(esc(t.lk_load));break;}A(`<pre>${LK.tranches.filter(x=>!x.void&&!x.done).map(x=>`${lkWhen(x).padEnd(12)} ${(x.estimated?t.lk_est:lkDD(x)).padEnd(7)} ${lkSh(x.shares_m).padStart(8)}  ${esc(lkLbl(x))}`).join('\n')}\n\n${esc(fmt(t.lk_locked,{v:lkSh(LK.summary.locked_m),p:Math.round(LK.summary.locked_pct)}))} · ${esc(fmt(t.lk_elig,{p:LK.summary.eligible_pct.toFixed(1)}))}</pre>`);break;}
    case 'schedule':case 'calendar':case 'agenda':case '일정':{if(!SC){A(esc(t.sc_load));break;}const q=a.join(' ').toLowerCase(),tk=new Date(Date.now()+9*3600e3).toISOString().slice(0,10),e14=addD(tk,14),l=SC.events.filter(e=>(e.end||e.date)>=tk&&e.date<=e14&&e.imp>=2&&(!q||[e.title,scTitle(e),e.cat,...e.tickers].join(' ').toLowerCase().includes(q)));
      A(`<pre>${esc(fmt(t.t_scn,{n:l.length}))}\n${l.map(e=>`${e.date.slice(5)} ${(e.time||'     ')} KST  ${e.imp>=3?'★ ':''}<a href="${esc(e.source||'#')}" target="_blank" rel="noopener">${esc(scTitle(e))}</a>${scTag(e)?' ('+esc(scTag(e))+')':''}`).join('\n')||esc(t.sc_none)}</pre>`);break;}
    case 'research':case 'reports':case 'library':case '리서치':{if(!RS){A(esc(t.lib_load));break;}const q=a.join(' ').toLowerCase(),l=RS.reports.filter(x=>!q||[x.slug,...Object.values(x.title),...(x.tickers||[]),...Object.values(x.tags||{}).flat()].join(' ').toLowerCase().includes(q));
      A(`<pre>${esc(fmt(t.t_rsn,{n:l.length}))}\n${l.map(x=>`${x.date}  <a href="${rUrl(x.slug)}" target="_blank" rel="noopener">${esc(x.title[lang]||x.title.en)}</a>  ${esc(x.key.value)}`).join('\n')||esc(t.lib_none)}</pre>`);break;}
    case 'api':A(`<pre>${esc(apiData(BUILD)['index.json'].endpoints.map(n=>'curl '+API_BASE+n).join('\n'))}</pre>`);break;
    case 'contact':case 'mail':case 'email':{const t2=T();A(`<pre>${esc([MAIL.main.padEnd(28,' ')+t2.ct_main,MAIL.dev.padEnd(28,' ')+t2.ct_dev,MAIL.biz.padEnd(28,' ')+t2.ct_biz,MAIL.thanks[lang].padEnd(28,' ')+'✉'].join('\n'))}</pre>`);break;}
    case 'git':if(arg==='config')A(`<pre>user.name=stayhungryasi\nuser.email=${MAIL.dev}</pre>`);else if(arg==='log')A(`<pre>${CHANGELOG.map(c=>`<span class="xn">${c.h.padEnd(7,' ')}</span> ${c.d}  ${esc(c.m[lang]||c.m.en)}`).join('\n')}</pre>`);else if(arg==='status')A('<pre>On branch main\nChanges not staged for commit:\n  <span class="vno">modified:   src/earnings.ts</span>\n  <span class="vno">modified:   research/spacex-3q26.md</span></pre>');else A('usage: git log | git status');break;
    case 'npm':if(raw.includes('launch')){A('&gt; stayhungry@1.0.0 launch · see the terminal ↓');launch();}else if(arg==='test'||arg==='t'){vpTab='term';rPanel();vWatchNow();A('✓ rerun · see the terminal ↓');}else if(arg==='i'||arg==='install')A('added 1 package: stay-hungry@∞ · 0 vulnerabilities');else A('npm run launch · npm test · npm install');break;
    case 'vim':case 'vi':case 'nvim':A("You're already in it. Click the editor, then type :q");break;

/* ================= GAME ================= */
const NS='http://www.w3.org/2000/svg',svg=$('candles'),R=10;
let score=0,streak=0,best=0,data=[],locked=false,curShown=7,lastV=null,results=[];
function rn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function gen(){let p=40+Math.random()*460,dr=(Math.random()-.5)*.012,vol=.012+Math.random()*.02;const o=[];for(let j=0;j<10;j++){if(j===7)dr=(Math.random()-.5)*.012;const op=p,cl=op*(1+dr+rn()*vol),h=Math.max(op,cl)*(1+Math.abs(rn())*vol*.5),l=Math.min(op,cl)*(1-Math.abs(rn())*vol*.5);o.push({o:op,c:cl,h,l});p=cl;}return o;}
function el(tag,at,txt){const e=document.createElementNS(NS,tag);for(const q in at)e.setAttribute(q,at[q]);if(txt!=null)e.textContent=txt;return e;}
function render(shown){curShown=shown;if(!data.length)return;svg.innerHTML='';const col=COL(),Lp=62,Rp=18,Tp=16,B=32,w=640-Lp-Rp,h=270-Tp-B,slot=w/10;
  const vis=data.slice(0,shown);let lo=Math.min(...vis.map(d=>d.l)),hi=Math.max(...vis.map(d=>d.h));const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;const y=v=>Tp+(hi-v)/(hi-lo)*h;
  for(let j=0;j<=4;j++){const v=lo+(hi-lo)*j/4,yy=y(v);svg.appendChild(el('line',{x1:Lp,x2:640-Rp,y1:yy,y2:yy,stroke:'#1D2330'}));svg.appendChild(el('text',{x:Lp-8,y:yy+4,fill:'#8D95A8','font-size':12,'text-anchor':'end','font-family':'IBM Plex Mono,monospace'},v.toFixed(2)));}
  const base=data[6].c;if(shown>7)svg.appendChild(el('line',{x1:Lp,x2:640-Rp,y1:y(base),y2:y(base),stroke:'#F26522','stroke-dasharray':'4 4'}));
  for(let j=0;j<10;j++){const cx=Lp+slot*j+slot/2;svg.appendChild(el('text',{x:cx,y:270-10,fill:j>=7?'#F26522':'#8D95A8','font-size':12,'text-anchor':'middle','font-family':'IBM Plex Mono,monospace'},j<7?`D-${6-j}`:`D+${j-6}`));
    if(j<shown){const d=data[j],cc=d.c>=d.o?col.up:col.down;svg.appendChild(el('line',{x1:cx,x2:cx,y1:y(d.h),y2:y(d.l),stroke:cc,'stroke-width':1.8}));svg.appendChild(el('rect',{x:cx-slot*.3,y:y(Math.max(d.o,d.c)),width:slot*.6,height:Math.max(2,Math.abs(y(d.o)-y(d.c))),fill:cc,rx:2}));}
    else{svg.appendChild(el('rect',{x:cx-slot*.34,y:Tp+6,width:slot*.68,height:h-12,fill:'rgba(242,101,34,.06)',stroke:'#F26522','stroke-dasharray':'4 4',rx:7}));svg.appendChild(el('text',{x:cx,y:Tp+h/2+8,fill:'#F26522','font-size':24,'font-weight':900,'text-anchor':'middle','font-family':'Noto Sans KR,sans-serif'},'?'));}}
  if(shown===10){const d=data[9],chg=(d.c/base-1)*100,ex=Lp+slot*9.5,ey=y(d.c);svg.appendChild(el('circle',{cx:ex,cy:ey,r:5,fill:'#EEF0F5'}));svg.appendChild(el('text',{x:ex-10,y:Math.max(ey-12,16),fill:chg>=0?col.up:col.down,'font-size':17,'font-weight':900,'text-anchor':'end','font-family':'Noto Sans KR,sans-serif'},pct(chg)));}}
function hud(){const t=T();$('gSum').textContent=fmt(t.gm_sum,{p:score,f:results.length-score,n:R});$('gK').textContent=streak;$('dots').innerHTML=Array.from({length:R},(_,j)=>{const r=results[j];return `<i class="${r==null?'':r?'ok':'no'}">${r==null?j+1:r?'✓':'✗'}</i>`;}).join('');}
function newRound(){data=gen();locked=false;lastV=null;render(7);$('bUp').disabled=$('bDown').disabled=false;$('verdict').textContent='';hud();}
function showV(){const t=T(),v=lastV;$('verdict').style.color=v.ok?'var(--green)':'var(--red)';$('verdict').textContent=fmt(v.ok?t.gm_pass:t.gm_fail,{c:pct(v.chg)});}
function answer(up){if(locked||results.length>=R)return;locked=true;$('bUp').disabled=$('bDown').disabled=true;const ok=(data[9].c>data[6].c)===up,red=matchMedia('(prefers-reduced-motion: reduce)').matches;let st=7;
  const tk=()=>{st++;render(st);if(st<10)setTimeout(tk,red?0:240);else fin();};tk();
  function fin(){results.push(ok);if(ok){score++;streak++;best=Math.max(best,streak);}else streak=0;lastV={ok,chg:(data[9].c/data[6].c-1)*100};showV();hud();setTimeout(()=>{if(results.length>=R)end();else newRound();},red?900:1400);}}
const tier=s=>T().tiers[s>=8?3:s>=6?2:s>=4?1:0];
function endText(){const t=T();$('rBig').innerHTML=`${score} / ${R}<em>${esc(tier(score))}</em>`;$('rText').textContent=fmt(t.gm_end,{b:best})+' '+(score>=6?t.gm_good:t.gm_norm);}
function end(){$('bUp').disabled=$('bDown').disabled=true;$('res').hidden=false;endText();$('hofForm').hidden=score<3;$('copied').textContent='';}
function hofRender(){const list=store.get('sha-hof',[]),ol=$('hofList');ol.innerHTML='';if(!list.length){const li=document.createElement('li');li.textContent=T().hof_empty;ol.appendChild(li);return;}
  list.forEach(r=>{const li=document.createElement('li'),b=document.createElement('b');b.textContent=r.name;li.appendChild(b);li.appendChild(document.createTextNode(` · ${r.score}/${R} · ${r.date}`));ol.appendChild(li);});}
$('hofSave').addEventListener('click',()=>{const nm=$('hofName').value.trim()||'anonymous',list=store.get('sha-hof',[]);list.push({name:nm,score,date:new Date().toISOString().slice(0,10)});list.sort((a,b)=>b.score-a.score);store.set('sha-hof',list.slice(0,5));hofRender();$('hofForm').hidden=true;});
$('share').addEventListener('click',()=>{const t=T(),txt=fmt(t.share,{s:score,t:tier(score)})+'@stayhungryasi · '+TG,done=()=>{$('copied').textContent=t.copied;};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){$('copied').textContent=txt;}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb();});
$('again').addEventListener('click',()=>{results=[];score=0;streak=0;best=0;$('res').hidden=true;newRound();});
$('bUp').addEventListener('click',()=>answer(true));$('bDown').addEventListener('click',()=>answer(false));

data=gen();renderAll();boot();newRound();
if(location.hash==='#dev'||store.get('sha-mode','reader')==='dev')setDev(true,true);
setInterval(tick,1000);
setInterval(()=>{rEarn();wrapPins();fit();if(devOn()){rCode();tick();vtyPaint();}},60000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
